# The one screen of the Power App "SACM actions" (builds B6, D5 and 0.52.0, D294 to D296, D317, D334), written by hand. To use it: in
# Power Apps Studio, select the screen in the Tree view, then Paste (Ctrl+V) this whole file (powerbi/README.md §6.4).
# It is drawn for the places of README §6.4 (300 wide, 300 to 620 high) and grows with a wider place. The reply reader
# needs 480 high (Person, Case, Work queue); on the short place of Card it says to open the person.
# At the top, the header line (D334): the time of the report's data and the changes on these lines saved since then,
# which the report does not show yet. Only the button Refresh now asks flow F5 (SACMRefresh) for a refresh: at most one
# in each window of the refresh rule (D333), and the flow says when the window was used. No Save refreshes (D332).
# Two tabs:
#   - Actions: the manager picks an action the selected lines all have, types or picks what it asks, and presses Save.
#     Save adds ONE row to the list SACM Journal (never changes or removes a row, D272). Below: what the team did lately
#     on these lines, read from the list at once, each row not in the report yet marked so. When such a row is of the
#     same type as the action, Save waits until the manager ticks Save anyway. Share out (build B7) adds one row per member.
#   - Reply (the reply reader, design pass §7): what the person wrote (the list SACM Replies, filed by flow F3), next to
#     the lines it is about, with a tick box each. Mark answered (the main button), Waiting until a date, or Add note
#     add rows to SACM Journal on the ticked lines.
# Nothing is sent from this app: the app SACM messages sends. The visual gives the app 1,000 lines at most (Microsoft's
# limit), so Save is off at 1,000: the app may not have them all.
Screens:
  ActionsScreen:
    Properties:
      Fill: =ColourSurface
    Children:
      - TitleLabel:
          Control: Label
          Properties:
            Text: |-
              =If(LineCount = 0, "SACM actions", LineCount & If(LineCount = 1, " line", " lines")) & If(TooManyLines, " · too many", "")
            Tooltip: |-
              =If(TooManyLines, "The report gives the app 1,000 lines at most. Select or filter fewer lines.", MeName)
            Font: =AppFont
            FontWeight: =FontWeight.Semibold
            Size: =11
            Color: =If(TooManyLines, ColourRed, ColourInk)
            X: =16
            Y: =8
            Width: =Parent.Width - 212
            Height: =36
      - ReportLabel:
          Control: Label
          Properties:
            # The header line (D334): the time of the report's data, and how many changes on these lines it does not show yet.
            Text: =ReportLine
            Tooltip: =RefreshRuleText
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            X: =16
            Y: =44
            Width: =Parent.Width - 32
            Height: =32
      - Tabs:
          Control: ModernTabList@1.0.0
          Properties:
            Items: =["Actions", "Reply"]
            Default: =If(ToReadCount > 0, "Reply", "Actions")
            Appearance: =TabListAppearance.Subtle
            Alignment: =TabListAlignment.End
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            AccessibleLabel: ="Actions or the reply"
            Visible: =LineCount > 0
            X: =Parent.Width - 196
            Y: =6
            Width: =184
            Height: =36
      - HeadRule:
          Control: Rectangle
          Properties:
            Fill: =ColourLine
            X: =0
            Y: =79
            Width: =Parent.Width
            Height: =1
      - EmptyLabel:
          Control: Label
          Properties:
            Text: |-
              ="Select lines in the report (on a card, a case or a person), then pick what to do."
            Font: =AppFont
            Size: =10
            Color: =ColourMuted
            Visible: =LineCount = 0
            X: =16
            Y: =84
            Width: =Parent.Width - 32
            Height: =48
      # ------------------------------------------------------------------ the tab Actions
      - ActionPick:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =AvailableActions
            Default: =First(AvailableActions)
            ItemDisplayText: =ThisItem.Value
            AccessibleLabel: ="What to do"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Actions"
            X: =16
            Y: =84
            Width: =Parent.Width - 32
            Height: =36
      - StatusPick:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =StatusChoices
            ItemDisplayText: =ThisItem.Value
            AccessibleLabel: ="Status"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =Tabs.Selected.Value = "Actions" && ",status," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =128
            Width: =Parent.Width - 32
            Height: =36
      - RequestText:
          Control: ModernTextInput@1.0.0
          Properties:
            Default: =""
            Placeholder: ="The request number (RITM…)"
            AccessibleLabel: ="Request number"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =Tabs.Selected.Value = "Actions" && ",request," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =128
            Width: =Parent.Width - 32
            Height: =36
      - MemberPick:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =TeamNames
            Default: |-
              ={ Value: MeName }
            ItemDisplayText: =ThisItem.Value
            AccessibleLabel: ="Team member"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =Tabs.Selected.Value = "Actions" && ",member," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =128
            Width: =Parent.Width - 32
            Height: =36
      - ReasonPick:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =ExceptionReasons
            ItemDisplayText: =ThisItem.Value
            AccessibleLabel: ="Reason"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =Tabs.Selected.Value = "Actions" && ",reason," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =128
            Width: =Parent.Width - 32
            Height: =36
      - ReviewDate:
          Control: ModernDatePicker@1.0.0
          Properties:
            DefaultDate: =DateAdd(Today(), ExceptionMonths, TimeUnit.Months)
            StartDate: =Today() + 1
            Format: =DatePickerFormat.Short
            AccessibleLabel: ="Review date"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =Tabs.Selected.Value = "Actions" && ",reviewOn," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =172
            Width: =Parent.Width - 32
            Height: =36
      - RetireDate:
          Control: ModernDatePicker@1.0.0
          Properties:
            DefaultDate: =First(Lines).RetireOn
            Format: =DatePickerFormat.Short
            Placeholder: ="No date (takes it away)"
            AccessibleLabel: ="Planned retirement date (empty takes it away)"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =Tabs.Selected.Value = "Actions" && ",retireOn," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =128
            Width: =Parent.Width - 32
            Height: =36
      - StagePick:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =StageChoices
            ItemDisplayText: =ThisItem.Value
            AccessibleLabel: ="Stage"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =Tabs.Selected.Value = "Actions" && ",stage," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =128
            Width: =Parent.Width - 32
            Height: =36
      - NoteText:
          Control: ModernTextInput@1.0.0
          Properties:
            Default: =""
            Type: =TextInputType.Multiline
            Placeholder: |-
              =If(ActionPick.Selected.Id = "stop", "Note (needed for Other): who agreed, a request number, a reference", "Note for the team")
            AccessibleLabel: ="Note"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =Tabs.Selected.Value = "Actions" && ",text," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =216
            Width: =Parent.Width - 32
            # Short on the place of Card (300 high), so Save still fits.
            Height: =If(Parent.Height < 400, 36, 68)
      - SaveButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Save"
            Icon: ="Checkmark"
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Tooltip: =Coalesce(SaveWhy.Text, "Add it to the journal of these lines")
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Actions"
            DisplayMode: |-
              =If(IsBlank(SaveWhy.Text), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =Set(varError, "");
              With(
                  { action: ActionPick.Selected },
                  Set(
                      varSaved,
                      IfError(
                          If(
                              // Share out: one assign row per member, with the lines the refresh gave that member (D24).
                              action.Id = "share-out",
                              ForAll(
                                  ShareMembers As member,
                                  Patch(
                                      'SACM Journal',
                                      Defaults('SACM Journal'),
                                      {
                                          Title: Text(GUID()),
                                          At: Now(),
                                          By: Lower(User().Email),
                                          ByName: MeName,
                                          Type: "assign",
                                          Keys: Concat(Filter(ShareLines, ShareTo = member.Value), Key, Char(10)),
                                          Text: member.Value
                                      }
                                  )
                              ),
                              Patch(
                                  'SACM Journal',
                                  Defaults('SACM Journal'),
                                  {
                                      Title: Text(GUID()),
                                      At: Now(),
                                      By: Lower(User().Email),
                                      ByName: MeName,
                                      Type: action.Type,
                                      Keys: Switch(action.Scope, "mine", KeysFor.mine, "person", "", KeysFor.lines),
                                      Text: Switch(
                                          action.Id,
                                          "status", StatusPick.Selected.Status,
                                          "request", Trim(RequestText.Text),
                                          "assign", If(MemberPick.Selected.Value = Nobody, "", MemberPick.Selected.Value),
                                          "stage", StagePick.Selected.Id,
                                          If(",text," in "," & action.Asks & ",", Trim(NoteText.Text), action.Text)
                                      ),
                                      To: If(action.Id = "handover", MemberPick.Selected.Value, ""),
                                      Person: If(action.Scope = "person", First(LinePeople).Value, ""),
                                      Reason: Switch(action.Id, "stop", ReasonPick.Selected.Value, "follow-again", FollowAgainReason, ""),
                                      ReviewOn: Switch(action.Id, "stop", ReviewDate.SelectedDate, "follow-again", Today(), Blank()),
                                      RetireOn: If(action.Id = "retirement", RetireDate.SelectedDate, Blank())
                                  }
                              )
                          );
                          true,
                          Set(varError, FirstError.Message);
                          false
                      )
                  );
                  If(
                      !varSaved,
                      Notify("Not saved: " & varError, NotificationType.Error),
                      // No refresh after a Save (D332): Done lately shows the row at once, the report after the next refresh.
                      Notify("Saved: " & action.Value & If(action.Id = "share-out", " to " & Concat(ShareMembers, Value, ", "), "") & ". Done lately shows it now; the report shows it after the next refresh.", NotificationType.Success);
                      Reset(NoteText);
                      Reset(RequestText);
                      Reset(AnywayCheck)
                  )
              )
            X: =Parent.Width - 136
            Y: =NoteText.Y + NoteText.Height + 4
            Width: =120
            Height: =36
      - RefreshButton:
          Control: ModernButton@1.0.0
          Properties:
            # The only control that asks for a refresh (D332, lint): flow F5 refreshes at most once in each window (D333)
            # and answers what happened. The same formula in the three apps.
            Text: ="Refresh now"
            Icon: ="ArrowSync"
            Appearance: =ButtonAppearance.Subtle
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: =RefreshRuleText
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Actions" && IsBlank(SameLabel.Text)
            OnSelect: |-
              =With(
                  { answer: IfError(SACMRefresh.Run(), { result: "error", at: "", by: "", message: "" }) },
                  Switch(
                      answer.result,
                      "started", Notify(RefreshStartedText, NotificationType.Success),
                      "taken", Notify(Coalesce(answer.by, "A colleague") & " asked for a refresh at " & answer.at & ". One refresh every " & RefreshWindowWords & ": " & RefreshNextText & ". Your work is saved, and this app shows it.", NotificationType.Information),
                      "closed", Notify(RefreshClosedText, NotificationType.Information),
                      "refused", Notify("Power BI did not start the refresh: " & answer.message & ". Your work is saved.", NotificationType.Warning),
                      Notify(RefreshErrorText, NotificationType.Error)
                  )
              )
            X: =16
            Y: =SaveButton.Y
            Width: =128
            Height: =36
      - AnywayCheck:
          Control: ModernCheckbox@1.0.0
          Properties:
            # In the place of Refresh now when SameLabel says a row of the same type is not in the report yet (D334).
            Label: ="Save anyway"
            Checked: =false
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Actions" && !IsBlank(SameLabel.Text)
            X: =16
            Y: =SaveButton.Y
            Width: =128
            Height: =36
      - SameLabel:
          Control: Label
          Properties:
            # The guard against a second row (D334): a row of the same type as the action, on one of these lines, saved
            # by anyone since the report's data. The menu still offers the action until the refresh. Empty when there is
            # none, and for a note. Not shown: SaveWhy says it.
            Text: |-
              =If(
                  LineCount = 0 || IsBlank(ActionPick.Selected.Id) || ActionPick.Selected.Id in ["note", "person-note"], "",
                  With(
                      { last: First(Sort(Filter(PendingEvents, Type = ActionPick.Selected.Type), At, SortOrder.Descending)) },
                      If(
                          IsBlank(last.At), "",
                          Coalesce(last.ByName, last.By) & " saved " &
                          Switch(
                              last.Type,
                              "assign", If(IsBlank(last.Text), "an assign to nobody", "an assign to " & last.Text),
                              "status", "the status " & last.Text,
                              "request", "the request " & last.Text,
                              "exception", "a decision about following",
                              "reviewed", "the step " & last.Text,
                              "retirement", "a retirement date",
                              "stage", "a stage",
                              "no-process", "the process mark",
                              "handover", "a hand-over",
                              last.Type) &
                          " on " & CountRows(Filter(Split(last.Keys, Char(10)) As key, Trim(key.Value) in SelectedKeys.Value)) &
                          " of these lines at " & Text(last.At, "hh:mm") & ". The report shows it after the next refresh.")))
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - SaveWhy:
          Control: Label
          Properties:
            # Why Save is grey: what the action still asks for (LOOK rule 7). Empty when Save is on. Shown in the tooltip of
            # Save and, with room, under the buttons.
            Text: |-
              =If(
                  LineCount = 0, "",
                  IsBlank(ActionPick.Selected.Id), "Pick what to do.",
                  TooManyLines, "Too many lines: select fewer than 1,000.",
                  !IsBlank(SameLabel.Text) && !AnywayCheck.Checked, SameLabel.Text & " Tick Save anyway to save it again.",
                  Switch(
                      ActionPick.Selected.Id,
                      "note", If(IsBlank(Trim(NoteText.Text)), "Type the note.", ""),
                      "person-note", If(IsBlank(Trim(NoteText.Text)), "Type the note.", ""),
                      "request", If(IsBlank(Trim(RequestText.Text)), "Type the request number.", ""),
                      "assign", If(IsBlank(MemberPick.Selected.Value), "Pick the team member.", ""),
                      "handover", If(IsBlank(MemberPick.Selected.Value) || MemberPick.Selected.Value = MeName || MemberPick.Selected.Value = Nobody, "Pick the colleague who takes your work.", ""),
                      "retirement", If(RetireDate.SelectedDate = First(Lines).RetireOn, "Pick another date, or empty the date to take it away.", ""),
                      "status", If(IsBlank(StatusPick.Selected.Status), "Pick the status.", ""),
                      "stage", If(IsBlank(StagePick.Selected.Id), "Pick the stage. The lines must all be of the same class.", ""),
                      "stop", If(
                          IsBlank(ReasonPick.Selected.Value), "Pick the reason.",
                          ReviewDate.SelectedDate <= Today(), "Pick a review date after today.",
                          ReasonPick.Selected.Value = "Other" && IsBlank(Trim(NoteText.Text)), "With the reason Other, type a note.",
                          ""),
                      ""
                  )
              )
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Actions" && Parent.Height > 400
            X: =16
            Y: =SaveButton.Y + 40
            Width: =Parent.Width - 32
            Height: =32
      - MenuNote:
          Control: Label
          Properties:
            # When Save is on and these lines have rows the report does not show yet: the menu is from the report's data (D334).
            Text: |-
              ="The menu is from " & ReportAtText & ": press Refresh now to see what the lines allow now."
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Actions" && Parent.Height > 400 && IsBlank(SaveWhy.Text) && PendingCount > 0
            X: =16
            Y: =SaveButton.Y + 40
            Width: =Parent.Width - 32
            Height: =32
      - RecentLabel:
          Control: Label
          Properties:
            Text: |-
              =If(CountRows(RecentEvents) = 0, "Nothing done on these lines in the last 60 days.", "Done lately (also before the report shows it)")
            Font: =AppFont
            FontWeight: =FontWeight.Semibold
            Size: =9.5
            Color: =ColourMuted
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Actions" && Parent.Height > 400
            X: =16
            Y: =SaveButton.Y + 76
            Width: =Parent.Width - 32
            Height: =24
      - RecentGallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: =RecentEvents
            TemplateSize: =44
            TemplatePadding: =0
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Actions" && Parent.Height > 400
            X: =16
            Y: =RecentLabel.Y + 28
            Width: =Parent.Width - 32
            Height: =Parent.Height - Self.Y - 8
          Children:
            - RecentLine:
                Control: Label
                Properties:
                  Text: |-
                    =Text(ThisItem.At, "d mmm hh:mm") & " · " & Coalesce(ThisItem.ByName, ThisItem.By) & Char(10) &
                    ThisItem.Type & If(IsBlank(ThisItem.Text), "", ": " & ThisItem.Text)
                  Font: =AppFont
                  Size: =9
                  Color: =ColourInk
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth - If(!IsBlank(ReportSince) && ThisItem.At >= ReportSince, 128, 0)
                  Height: =Parent.TemplateHeight - 1
            - RecentChip:
                Control: Label
                Properties:
                  # A row the report does not show yet (D334).
                  Text: ="not in the report yet"
                  Font: =AppFont
                  Size: =9
                  Color: =ColourGrey
                  Fill: =ColourGreySoft
                  Align: =Align.Center
                  Visible: =!IsBlank(ReportSince) && ThisItem.At >= ReportSince
                  X: =Parent.TemplateWidth - 124
                  Y: =3
                  Width: =124
                  Height: =18
            - RecentRule:
                Control: Rectangle
                Properties:
                  Fill: =ColourLine
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
      # ------------------------------------------------------------------ the tab Reply (the reply reader)
      - NoReplyLabel:
          Control: Label
          Properties:
            Text: |-
              ="No reply on these lines yet. A reply to the SACM mailbox with the reference in its subject shows here."
            Font: =AppFont
            Size: =10
            Color: =ColourMuted
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && IsEmpty(LineReplies)
            X: =16
            Y: =84
            Width: =Parent.Width - 32
            Height: =56
      - SmallLabel:
          Control: Label
          Properties:
            Text: |-
              ="The app is too small here to read the reply: press Open person (or Open CI) and read it there."
            Font: =AppFont
            Size: =10
            Color: =ColourMuted
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height < 480
            X: =16
            Y: =84
            Width: =Parent.Width - 32
            Height: =56
      - ReplyPick:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =LineReplies
            Default: =First(LineReplies)
            ItemDisplayText: =ThisItem.From & " · " & Text(ThisItem.Received, "d mmm hh:mm")
            AccessibleLabel: ="Which reply"
            BasePaletteColor: =ColourViolet
            Font: =AppFont
            Size: =10
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            X: =16
            Y: =84
            Width: =Parent.Width - 32
            Height: =32
      - ReplySubject:
          Control: Label
          Properties:
            Text: =ReplyPick.Selected.Subject
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            X: =16
            Y: =120
            Width: =Parent.Width - 32
            Height: =20
      - ReplyBody:
          Control: Label
          Properties:
            # What they wrote, as the flow F3 filed it (plain text). It scrolls when it is long.
            Text: =ReplyPick.Selected.Body
            Font: =AppFont
            Size: =10
            Color: =ColourInk
            Fill: =ColourVioletSoft
            BorderColor: =ColourLine
            BorderThickness: =1
            PaddingLeft: =10
            PaddingRight: =10
            PaddingTop: =8
            PaddingBottom: =8
            VerticalAlign: =VerticalAlign.Top
            Overflow: =Overflow.Scroll
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            X: =16
            Y: =144
            Width: =Parent.Width - 32
            Height: =Max(40, (Parent.Height - 144 - 156 - 28) / 2)
      - TickCaption:
          Control: Label
          Properties:
            # Why the buttons are grey (LOOK rule 7), else how many lines they act on.
            Text: |-
              =With(
                  { ticked: CountRows(Filter(ReplyGallery.AllItems, LineCheck.Checked)) },
                  If(
                      !IsBlank(ReplyDoneLabel.Text), ReplyDoneLabel.Text,
                      ticked = 0, "Tick the lines the reply answers.",
                      ticked & If(ticked = 1, " line ticked.", " lines ticked.") &
                      If(IsBlank(WaitDate.SelectedDate) || WaitDate.SelectedDate <= Today(), " Waiting until needs a date after today.", "") &
                      If(IsBlank(Trim(ReplyNote.Text)), " Add note needs a note.", "")))
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            X: =16
            Y: =ReplyBody.Y + ReplyBody.Height + 4
            Width: =Parent.Width - 32
            Height: =22
      - ReplyDoneLabel:
          Control: Label
          Properties:
            # A reply already answered or put to wait since the report's data (D334): the status Answered or Fix in
            # progress on a line of this reply, saved by anyone. The report shows the reply as read after the next
            # refresh; until then Mark answered and Waiting until stay off. Not shown: TickCaption says it.
            Text: |-
              =With(
                  { replyKeys: Filter(Lines, LastRef = ReplyPick.Selected.Title) },
                  With(
                      {
                          done: First(Sort(
                              Filter(PendingEvents As event, event.Type = "status" && (event.Text = "Answered" || event.Text = "Fix in progress") &&
                                  CountRows(Filter(Split(event.Keys, Char(10)) As key, Trim(key.Value) in replyKeys.Key)) > 0),
                              At, SortOrder.Descending))
                      },
                      If(IsBlank(done.At), "", Coalesce(done.ByName, done.By) & " set " & done.Text & " at " & Text(done.At, "hh:mm") & " on the lines of this reply. The report shows it after the next refresh.")))
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - ReplyGallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            # The lines, those of this reply's message first.
            Items: =Sort(Lines, If(LastRef = ReplyPick.Selected.Title, 0, 1))
            TemplateSize: =44
            TemplatePadding: =0
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            X: =16
            Y: =TickCaption.Y + 24
            Width: =Parent.Width - 32
            Height: =Max(40, Parent.Height - 156 - (TickCaption.Y + 24) - 8)
          Children:
            - LineCheck:
                Control: ModernCheckbox@1.0.0
                Properties:
                  Label: =""
                  Checked: =ThisItem.LastRef = ReplyPick.Selected.Title
                  AccessibleLabel: ="The reply answers " & ThisItem.CiName
                  BasePaletteColor: =ColourNavy
                  X: =0
                  Y: =6
                  Width: =32
                  Height: =32
            - LineName:
                Control: Label
                Properties:
                  Text: =ThisItem.CiName
                  Font: =AppFont
                  FontWeight: =FontWeight.Semibold
                  Size: =9.5
                  Color: =ColourInk
                  X: =36
                  Y: =2
                  Width: =Parent.TemplateWidth - 36
                  Height: =20
            - LineCard:
                Control: Label
                Properties:
                  Text: =Coalesce(ThisItem.Card, ThisItem.CheckId) & " · " & ThisItem.Status
                  Font: =AppFont
                  Size: =9
                  Color: =ColourMuted
                  X: =36
                  Y: =22
                  Width: =Parent.TemplateWidth - 36
                  Height: =20
            - LineRule:
                Control: Rectangle
                Properties:
                  Fill: =ColourLine
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
      - ReplyNote:
          Control: ModernTextInput@1.0.0
          Properties:
            Default: =""
            Placeholder: ="Note (what they said, optional)"
            AccessibleLabel: ="Note"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            X: =16
            Y: =Parent.Height - 148
            Width: =Parent.Width - 32
            Height: =36
      - WaitDate:
          Control: ModernDatePicker@1.0.0
          Properties:
            DefaultDate: =Today() + 7
            StartDate: =Today() + 1
            Format: =DatePickerFormat.Short
            AccessibleLabel: ="Waiting until"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            X: =16
            Y: =Parent.Height - 104
            Width: =(Parent.Width - 40) / 2
            Height: =36
      - WaitButton:
          Control: ModernButton@1.0.0
          Properties:
            # They said they will fix it: status Fix in progress (no reminder while it stands) and a note with the date.
            Text: ="Waiting until"
            Icon: ="Calendar"
            Appearance: =ButtonAppearance.Secondary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: |-
              ="Fix in progress, with a note of the date they gave: no reminder goes while it stands"
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            DisplayMode: |-
              =If(
                  CountRows(Filter(ReplyGallery.AllItems, LineCheck.Checked)) = 0 || IsBlank(WaitDate.SelectedDate) || WaitDate.SelectedDate <= Today() || TooManyLines ||
                  !IsBlank(ReplyDoneLabel.Text),
                  DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  {
                      keys: Concat(Filter(ReplyGallery.AllItems, LineCheck.Checked), Key, Char(10)),
                      note: "Waiting until " & Text(WaitDate.SelectedDate, "d mmm yyyy", "en-GB") & " (reply of " & ReplyPick.Selected.From & ")" & If(IsBlank(Trim(ReplyNote.Text)), "", ": " & Trim(ReplyNote.Text))
                  },
                  IfError(
                      Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: Lower(User().Email), ByName: MeName, Type: "status", Keys: keys, Text: "Fix in progress" });
                      Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: Lower(User().Email), ByName: MeName, Type: "note", Keys: keys, Text: note });
                      Notify("Saved: Fix in progress, waiting until " & Text(WaitDate.SelectedDate, "d mmm") & ". The report shows it after the next refresh.", NotificationType.Success);
                      Reset(ReplyNote),
                      Notify("Not saved: " & FirstError.Message, NotificationType.Error)
                  )
              )
            X: =24 + (Parent.Width - 40) / 2
            Y: =Parent.Height - 104
            Width: =(Parent.Width - 40) / 2
            Height: =36
      - NoteButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Add note"
            Icon: ="Note"
            Appearance: =ButtonAppearance.Secondary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: =If(IsBlank(Trim(ReplyNote.Text)), "Type the note first", "Add the note to the ticked lines")
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            DisplayMode: |-
              =If(CountRows(Filter(ReplyGallery.AllItems, LineCheck.Checked)) = 0 || IsBlank(Trim(ReplyNote.Text)), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =IfError(
                  Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: Lower(User().Email), ByName: MeName, Type: "note", Keys: Concat(Filter(ReplyGallery.AllItems, LineCheck.Checked), Key, Char(10)), Text: Trim(ReplyNote.Text) });
                  Notify("Note saved. The report shows it after the next refresh.", NotificationType.Success);
                  Reset(ReplyNote),
                  Notify("Not saved: " & FirstError.Message, NotificationType.Error)
              )
            X: =16
            Y: =Parent.Height - 56
            Width: =(Parent.Width - 40) / 2
            Height: =40
      - AnsweredButton:
          Control: ModernButton@1.0.0
          Properties:
            # The main button of the reader: the reply answers the ticked lines (status Answered: no reminder goes).
            Text: ="Mark answered"
            Icon: ="Checkmark"
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Tooltip: ="Status Answered on the ticked lines, with the note when you typed one"
            Visible: =LineCount > 0 && Tabs.Selected.Value = "Reply" && !IsEmpty(LineReplies) && Parent.Height >= 480
            DisplayMode: |-
              =If(
                  CountRows(Filter(ReplyGallery.AllItems, LineCheck.Checked)) = 0 || TooManyLines ||
                  !IsBlank(ReplyDoneLabel.Text),
                  DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  { keys: Concat(Filter(ReplyGallery.AllItems, LineCheck.Checked), Key, Char(10)), note: Trim(ReplyNote.Text) },
                  IfError(
                      Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: Lower(User().Email), ByName: MeName, Type: "status", Keys: keys, Text: "Answered" });
                      If(!IsBlank(note), Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: Lower(User().Email), ByName: MeName, Type: "note", Keys: keys, Text: note }));
                      Notify("Marked answered. The report shows it after the next refresh.", NotificationType.Success);
                      Reset(ReplyNote),
                      Notify("Not saved: " & FirstError.Message, NotificationType.Error)
                  )
              )
            X: =24 + (Parent.Width - 40) / 2
            Y: =Parent.Height - 56
            Width: =(Parent.Width - 40) / 2
            Height: =40
