# The one screen of the Power App "SACM actions" (build B6, D294 to D296), written by hand. To use it: in Power Apps Studio,
# select the screen in the Tree view, then Paste (Ctrl+V) this whole file (powerbi/README.md §6). Structure only: the
# visual design pass comes later.
# What it does: the manager picks an action the selected lines all have, types or picks what it asks, and presses Save.
# Save adds ONE row to the list SACM Journal (never changes or removes a row, D272), then asks flow F5 (SACMRefresh) to
# refresh the report. Below: what the team did lately on these lines, read from the list at once (before the refresh).
# Share out (build B7) adds one row per member. Nothing is sent from this app: the app SACM messages sends (build B7).
# The visual gives the app 1,000 lines at most (Microsoft's limit), so Save is off at 1,000: the app may not have them all.
Screens:
  ActionsScreen:
    Properties:
      Fill: =RGBA(255, 255, 255, 1)
    Children:
      - TitleLabel:
          Control: Label
          Properties:
            Text: |-
              ="SACM actions: " & LineCount & If(LineCount = 1, " line", " lines") & If(IsBlank(MeName), "", " · " & MeName) & If(TooManyLines, " · Too many lines: the report gives the app 1,000 at most. Select or filter fewer lines.", "")
            FontWeight: =FontWeight.Semibold
            Size: =14
            X: =16
            Y: =8
            Width: =Parent.Width - 32
            Height: =32
      - EmptyLabel:
          Control: Label
          Properties:
            Text: |-
              ="Select lines in the report (on a card, a case or a person), then pick what to do."
            Visible: =LineCount = 0
            X: =16
            Y: =44
            Width: =Parent.Width - 32
            Height: =48
      - ActionPick:
          Control: Classic/DropDown
          Properties:
            Items: =AvailableActions
            AccessibleLabel: ="What to do"
            Visible: =LineCount > 0
            X: =16
            Y: =44
            Width: =Parent.Width - 32
            Height: =36
      - StatusPick:
          Control: Classic/DropDown
          Properties:
            Items: =StatusChoices
            AccessibleLabel: ="Status"
            Visible: |-
              =",status," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =88
            Width: =Parent.Width - 32
            Height: =36
      - RequestText:
          Control: Classic/TextInput
          Properties:
            Default: =""
            HintText: ="The request number (RITM…)"
            AccessibleLabel: ="Request number"
            Visible: |-
              =",request," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =88
            Width: =Parent.Width - 32
            Height: =36
      - MemberPick:
          Control: Classic/DropDown
          Properties:
            Items: =TeamNames
            Default: =MeName
            AccessibleLabel: ="Team member"
            Visible: |-
              =",member," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =88
            Width: =Parent.Width - 32
            Height: =36
      - ReasonPick:
          Control: Classic/DropDown
          Properties:
            Items: =ExceptionReasons
            AccessibleLabel: ="Reason"
            Visible: |-
              =",reason," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =88
            Width: =Parent.Width - 32
            Height: =36
      - ReviewDate:
          Control: Classic/DatePicker
          Properties:
            DefaultDate: =DateAdd(Today(), ExceptionMonths, TimeUnit.Months)
            AccessibleLabel: ="Review date"
            Visible: |-
              =",reviewOn," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =132
            Width: =Parent.Width - 32
            Height: =36
      - RetireDate:
          Control: Classic/DatePicker
          Properties:
            DefaultDate: =First(Lines).RetireOn
            AccessibleLabel: ="Planned retirement date (empty takes it away)"
            Visible: |-
              =",retireOn," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =88
            Width: =Parent.Width - 32
            Height: =36
      - StagePick:
          Control: Classic/DropDown
          Properties:
            Items: =StageChoices
            AccessibleLabel: ="Stage"
            Visible: |-
              =",stage," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =88
            Width: =Parent.Width - 32
            Height: =36
      - NoteText:
          Control: Classic/TextInput
          Properties:
            Default: =""
            Mode: =TextMode.MultiLine
            HintText: |-
              =If(ActionPick.Selected.Id = "stop", "Note (needed for Other): who agreed, a request number, a reference", "Note for the team")
            AccessibleLabel: ="Note"
            Visible: |-
              =",text," in "," & ActionPick.Selected.Asks & ","
            X: =16
            Y: =176
            Width: =Parent.Width - 32
            Height: =72
      - SaveButton:
          Control: Classic/Button
          Properties:
            Text: ="Save"
            Visible: =LineCount > 0
            DisplayMode: |-
              =If(IsBlank(SaveWhy.Text), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =Set(varError, "");
              With(
                  { action: ActionPick.Selected },
                  Set(
                      varSaved,
                      IfError(
                          If(
                              // Share out: one assign row per member, with the lines the refresh gave that member (D24).
                              action.Id = "share-out",
                              ForAll(
                                  ShareMembers As member,
                                  Patch(
                                      'SACM Journal',
                                      Defaults('SACM Journal'),
                                      {
                                          Title: Text(GUID()),
                                          At: Now(),
                                          By: Lower(User().Email),
                                          ByName: MeName,
                                          Type: "assign",
                                          Keys: Concat(Filter(ShareLines, ShareTo = member.Value), Key, Char(10)),
                                          Text: member.Value
                                      }
                                  )
                              ),
                              Patch(
                                  'SACM Journal',
                                  Defaults('SACM Journal'),
                                  {
                                      Title: Text(GUID()),
                                      At: Now(),
                                      By: Lower(User().Email),
                                      ByName: MeName,
                                      Type: action.Type,
                                      Keys: Switch(action.Scope, "mine", KeysFor.mine, "person", "", KeysFor.lines),
                                      Text: Switch(
                                          action.Id,
                                          "status", StatusPick.Selected.Status,
                                          "request", Trim(RequestText.Text),
                                          "assign", If(MemberPick.Selected.Value = Nobody, "", MemberPick.Selected.Value),
                                          "stage", StagePick.Selected.Id,
                                          If(",text," in "," & action.Asks & ",", Trim(NoteText.Text), action.Text)
                                      ),
                                      To: If(action.Id = "handover", MemberPick.Selected.Value, ""),
                                      Person: If(action.Scope = "person", First(LinePeople).Value, ""),
                                      Reason: Switch(action.Id, "stop", ReasonPick.Selected.Value, "follow-again", FollowAgainReason, ""),
                                      ReviewOn: Switch(action.Id, "stop", ReviewDate.SelectedDate, "follow-again", Today(), Blank()),
                                      RetireOn: If(action.Id = "retirement", RetireDate.SelectedDate, Blank())
                                  }
                              )
                          );
                          true,
                          Set(varError, FirstError.Message);
                          false
                      )
                  );
                  If(
                      !varSaved,
                      Notify("Not saved: " & varError, NotificationType.Error),
                      Set(varJustSaved, { Id: action.Id, Keys: KeysFor.lines, At: Now() });
                      Notify("Saved: " & action.Value & If(action.Id = "share-out", " to " & Concat(ShareMembers, Value, ", "), "") & ". The report shows it after the next refresh, in about a minute.", NotificationType.Success);
                      IfError(SACMRefresh.Run(), Notify("Saved. The refresh could not start now: the report shows it after the next refresh.", NotificationType.Warning));
                      Reset(NoteText);
                      Reset(RequestText)
                  )
              )
            X: =16
            Y: =256
            Width: =120
            Height: =36
      - SaveWhy:
          Control: Label
          Properties:
            # Why Save is off: what the action still asks for. Empty when Save is on (LOOK rule 7: a grey button says why).
            Text: |-
              =If(
                  LineCount = 0 || IsBlank(ActionPick.Selected.Id), "",
                  TooManyLines, "Too many lines: select fewer than 1,000.",
                  !(ActionPick.Selected.Id in ["note", "person-note"]) && varJustSaved.Id = ActionPick.Selected.Id && varJustSaved.Keys = KeysFor.lines && Now() < DateAdd(varJustSaved.At, 3, TimeUnit.Minutes),
                  "Saved just now. The menu shows what these lines allow after the refresh, in about a minute.",
                  Switch(
                      ActionPick.Selected.Id,
                      "note", If(IsBlank(Trim(NoteText.Text)), "Type the note.", ""),
                      "person-note", If(IsBlank(Trim(NoteText.Text)), "Type the note.", ""),
                      "request", If(IsBlank(Trim(RequestText.Text)), "Type the request number.", ""),
                      "assign", If(IsBlank(MemberPick.Selected.Value), "Pick the team member.", ""),
                      "handover", If(IsBlank(MemberPick.Selected.Value) || MemberPick.Selected.Value = MeName || MemberPick.Selected.Value = Nobody, "Pick the colleague who takes your work.", ""),
                      "retirement", If(RetireDate.SelectedDate = First(Lines).RetireOn, "Pick another date, or empty the date to take it away.", ""),
                      "status", If(IsBlank(StatusPick.Selected.Status), "Pick the status.", ""),
                      "stage", If(IsBlank(StagePick.Selected.Id), "Pick the stage. The lines must all be of the same class.", ""),
                      "stop", If(
                          ReviewDate.SelectedDate <= Today(), "Pick a review date after today.",
                          ReasonPick.Selected.Value = "Other" && IsBlank(Trim(NoteText.Text)), "With the reason Other, type a note.",
                          ""),
                      ""
                  )
              )
            Visible: =LineCount > 0
            X: =292
            Y: =256
            Width: =Parent.Width - 308
            Height: =36
      - RefreshButton:
          Control: Classic/Button
          Properties:
            Text: ="Refresh now"
            OnSelect: |-
              =IfError(
                  SACMRefresh.Run();
                  Notify("The report refreshes now, in about a minute.", NotificationType.Success),
                  Notify("The refresh could not start now. Try again in two minutes.", NotificationType.Warning)
              )
            X: =144
            Y: =256
            Width: =140
            Height: =36
      - RecentLabel:
          Control: Label
          Properties:
            Text: |-
              =If(CountRows(RecentEvents) = 0, "Nothing done on these lines in the last 60 days.", "Done lately on these lines (also before the report shows it):")
            Visible: =LineCount > 0
            X: =16
            Y: =300
            Width: =Parent.Width - 32
            Height: =28
      - RecentGallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: =RecentEvents
            TemplateSize: =44
            Visible: =LineCount > 0
            X: =16
            Y: =332
            Width: =Parent.Width - 32
            Height: =Parent.Height - 340
          Children:
            - RecentLine:
                Control: Label
                Properties:
                  Text: |-
                    =Text(ThisItem.At, "d mmm hh:mm") & " · " & Coalesce(ThisItem.ByName, ThisItem.By) & " · " & ThisItem.Type & If(IsBlank(ThisItem.Text), "", ": " & ThisItem.Text)
                  X: =0
                  Y: =0
                  Width: =Parent.TemplateWidth
                  Height: =Parent.TemplateHeight
