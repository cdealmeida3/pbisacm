# The one screen of the Power App "SACM messages", the email studio (builds B7, D5, 0.52.0 and R6, D301, D313 to D317,
# D334, D371 to D373), written by hand. To use it: in Power Apps Studio, select the screen in the Tree view, then Paste
# (Ctrl+V) this whole file (powerbi/README.md §6.6). It is drawn for the place of the app on the page Messages: the right
# side, 580 × 620 (README §6.4). From build R6 the list of the emails is a table of the page, at the left (D371): the
# app gets the one email chosen there (AppEmail, its visual filter Selected email is 1) and shows, from the top:
#   - The head: the kind and who gets it, the time of the report's data and the changes since then (D334), and Refresh
#     now (flow F5, once in each window of the refresh rule, D333).
#   - The fields: To, Cc and Subject, which the manager can change. A new email gets its reference at the first Test to
#     me, Send, Outlook draft or Teams; until then the subject says "new reference" (D371).
#   - One line on what happens: sent, a colleague wrote to this person or about these cases in the last 24 hours (then
#     the buttons wait for Send anyway), or nobody wrote.
#   - The email exactly as it will arrive (its Html, joined from its pieces, D372), with the line of its file.
#   - The buttons, and above them why one is grey (LOOK rule 7):
#       Send (the main button): flow F2 (SACMSend) sends it from the shared mailbox, with its file. Then the app adds the
#         message to the list SACM Journal (D272: rows are only added) for EVERY part of the email, under its one
#         reference. No refresh (D332): the email stays in the list, Sent for everyone, until the next refresh (D334).
#       Test to me: flow F4 (SACMTest) sends it, with its file, to the manager only. The cases are not changed.
#       Outlook draft: flow F7 (SACMDraft) puts it in the manager's own Drafts, From = the shared mailbox (D315), and
#         Outlook on the web opens it. The manager sends it there, then answers "Sent from Outlook?". Yes records it.
#       Teams: opens a Teams chat with the person and the first message, then asks "Did you start the chat?".
# After a send the manager chooses the next email in the list of the page: the app cannot move the page's selection.
# Nothing is sent without a press (D2). One main button (LOOK rule 6); a grey button says why (LOOK rule 7).
Screens:
  MessagesScreen:
    Properties:
      Fill: =ColourSurface
      OnVisible: |-
        =Set(varAsk, Blank());
        Set(varAnyway, "");
        Set(varRef, { Id: "", Ref: "" })
    Children:
      # ------------------------------------------------------------------ the head
      - HeadTitle:
          Control: Label
          Properties:
            Text: |-
              =If(
                  DraftCount = 0, "No email chosen",
                  ThisEmail.KindLabel &
                  " to " & Coalesce(ThisEmail.ToName, ThisEmail.To, "no address yet"))
            Font: =AppFont
            FontWeight: =FontWeight.Semibold
            Size: =12
            Color: =ColourInk
            X: =16
            Y: =8
            Width: =Parent.Width - 16 - 136
            Height: =28
      - ReportLabel:
          Control: Label
          Properties:
            # The header line (D334): the time of the report's data, and how many changes of the team it does not show yet.
            Text: =ReportLine
            Tooltip: =RefreshRuleText
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            X: =16
            Y: =36
            Width: =Parent.Width - 16 - 136
            Height: =20
      - RefreshButton:
          Control: ModernButton
          Properties:
            # The only control that asks for a refresh (D332, lint): flow F5 refreshes at most once in each window (D333)
            # and answers what happened. The same formula in the three apps.
            Text: ="Refresh now"
            Icon: ="ArrowSync"
            Appearance: =ButtonAppearance.Subtle
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: =RefreshRuleText
            OnSelect: |-
              =With(
                  { answer: IfError(SACMRefresh.Run(), { result: "error", at: "", by: "", message: "" }) },
                  Switch(
                      answer.result,
                      "started", Notify(RefreshStartedText, NotificationType.Success),
                      "taken", Notify(Switch(Lower(Coalesce(answer.by, "")), "", "A colleague", "button", "A colleague", "reply", "A reply that came in", Coalesce(LookUp('SACM Team', Lower(Email) = Lower(answer.by)).Title, answer.by)) & " asked for a refresh at " & answer.at & ". One refresh every " & RefreshWindowWords & ": " & RefreshNextText & ". Your work is saved, and this app shows it.", NotificationType.Information),
                      "closed", Notify(RefreshClosedText, NotificationType.Information),
                      "refused", Notify("Power BI did not start the refresh: " & answer.message & ". Your work is saved.", NotificationType.Warning),
                      Notify(RefreshErrorText, NotificationType.Error)
                  )
              )
            X: =Parent.Width - 128
            Y: =12
            Width: =112
            Height: =32
      - HeadRule:
          Control: Rectangle
          Properties:
            Fill: =ColourLine
            X: =0
            Y: =60
            Width: =Parent.Width
            Height: =1
      - EmptyLabel:
          Control: Label
          Properties:
            Text: |-
              ="No email is chosen. Choose one in the list at the left of the page. When the list is empty, no email is ready: after the next report, or when a reminder is due, it is listed there."
            Font: =AppFont
            Size: =10.5
            Color: =ColourMuted
            Align: =Align.Center
            Visible: =DraftCount = 0
            X: =32
            Y: =120
            Width: =Parent.Width - 64
            Height: =96
      # ------------------------------------------------------------------ the fields
      - RefValue:
          Control: Label
          Properties:
            # The reference of the email: a reminder keeps the one of its first message (D5); a new email gets the one the
            # app made at its first Test to me, Send, Outlook draft or Teams ("SACM-" and six letters and digits, as the
            # HTML app), kept under the email's first key while the email stays chosen. Not shown: the formulas read it.
            Text: |-
              =If(
                  !IsBlank(ThisEmail.Ref), ThisEmail.Ref,
                  varRef.Id = ThisEmail.SentKey, varRef.Ref,
                  "")
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - ToCaption:
          Control: Label
          Properties:
            Text: |-
              =If(
                  ThisEmail.NobodyAbove, "To (nobody is known above: type the address)",
                  IsBlank(ThisEmail.To), "To (no address yet: the line below says why)",
                  "To")
            Font: =AppFont
            Size: =9
            Color: =If(IsBlank(Trim(ToText.Text)), ColourRed, ColourMuted)
            Visible: =DraftCount > 0
            X: =16
            Y: =68
            Width: =(Parent.Width - 48) / 2
            Height: =18
      - ToText:
          Control: ModernTextInput
          Properties:
            Default: =ThisEmail.To
            Placeholder: ="name@company; name@company"
            AccessibleLabel: ="To"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =DraftCount > 0
            X: =16
            Y: =86
            Width: =(Parent.Width - 48) / 2
            Height: =32
      - CcCaption:
          Control: Label
          Properties:
            Text: ="Cc"
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =DraftCount > 0
            X: =32 + (Parent.Width - 48) / 2
            Y: =68
            Width: =(Parent.Width - 48) / 2
            Height: =18
      - CcText:
          Control: ModernTextInput
          Properties:
            Default: =ThisEmail.Cc
            Placeholder: ="Nobody"
            AccessibleLabel: ="Cc"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =DraftCount > 0
            X: =32 + (Parent.Width - 48) / 2
            Y: =86
            Width: =(Parent.Width - 48) / 2
            Height: =32
      - SubjectCaption:
          Control: Label
          Properties:
            Text: ="Subject"
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =DraftCount > 0
            X: =16
            Y: =124
            Width: =Parent.Width - 32
            Height: =18
      - SubjectText:
          Control: ModernTextInput
          Properties:
            # A new email shows "new reference" in place of its reference; the buttons put the reference there (D371).
            Default: =Substitute(ThisEmail.Subject, "%%REF%%", If(IsBlank(ThisEmail.Ref), NewRefWords, ThisEmail.Ref))
            AccessibleLabel: ="Subject"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =DraftCount > 0
            X: =16
            Y: =142
            Width: =Parent.Width - 32
            Height: =32
      - WarnLabel:
          Control: Label
          Properties:
            # The double contact (doubleContacts of src/core/team/team.ts): a colleague's message of the last 24 hours to
            # one of these addresses, or about one of these cases. Empty when there is none. Not shown: StateBox says it.
            Text: |-
              =With(
                  {
                      toList: ForAll(Split(Lower(Substitute(ToText.Text, ",", ";")), ";") As address, Trim(address.Value)),
                      keyList: ForAll(Split(ThisEmail.Keys, Char(10)) As key, Trim(key.Value))
                  },
                  With(
                      {
                          found: Filter(
                              RecentMessages As event,
                              CountRows(Filter(Split(Lower(Substitute(event.To, ",", ";")), ";") As address, !IsBlank(Trim(address.Value)) && Trim(address.Value) in toList.Value)) > 0 ||
                              CountRows(Filter(Split(event.Keys, Char(10)) As key, !IsBlank(Trim(key.Value)) && Trim(key.Value) in keyList.Value)) > 0)
                      },
                      If(
                          CountRows(found) = 0, "",
                          "A colleague wrote lately: " &
                          Concat(
                              FirstN(Sort(found, At, SortOrder.Descending), 3) As event,
                              Coalesce(event.ByName, event.By) & " at " & Text(event.At, "d mmm hh:mm") & ", " &
                              If(
                                  CountRows(Filter(Split(Lower(Substitute(event.To, ",", ";")), ";") As address, !IsBlank(Trim(address.Value)) && Trim(address.Value) in toList.Value)) > 0,
                                  "to the same person",
                                  "about " & CountRows(Filter(Split(event.Keys, Char(10)) As key, Trim(key.Value) in keyList.Value)) & " of these cases"),
                              "; ") &
                          If(CountRows(found) > 3, " and " & (CountRows(found) - 3) & " more", "") & "."
                      )
                  )
              )
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - StateBox:
          Control: Label
          Properties:
            # One line on what happens: sent, a colleague wrote lately, or nobody wrote (the mockup of design A).
            Text: |-
              =If(
                  DraftCount = 0, "",
                  (ThisEmail.IsSent || ThisEmail.SentKey in varSentIds) && varLast.Key <> ThisEmail.SentKey,
                  // Sent by a colleague, or in another session, since the report's data (D334).
                  "Sent by " & Coalesce(ThisEmail.SentBy, MeName) & If(IsBlank(ThisEmail.SentAt), "", " at " & Text(ThisEmail.SentAt, "hh:mm")) & ". It leaves the list after the next refresh: choose another email in the list.",
                  (ThisEmail.IsSent || ThisEmail.SentKey in varSentIds),
                  Switch(varLast.Channel, "teams", "Teams chat recorded with ", "outlook", "Recorded as sent from Outlook to ", "Sent from the SACM mailbox to ") &
                  varLast.To & " at " & Text(varLast.At, "hh:mm") & ". " & varLast.Cases &
                  If(varLast.Cases = 1, " case is", " cases are") & " now asked. Choose the next email in the list at the left.",
                  !IsBlank(WarnLabel.Text), WarnLabel.Text,
                  "Nobody in the team wrote to this person, or about these cases, in the last 24 hours.")
            Font: =AppFont
            Size: =9.5
            Color: |-
              =If((ThisEmail.IsSent || ThisEmail.SentKey in varSentIds), ColourBlue, !IsBlank(WarnLabel.Text), ColourAmber, ColourGrey)
            Fill: |-
              =If((ThisEmail.IsSent || ThisEmail.SentKey in varSentIds), ColourBlueSoft, !IsBlank(WarnLabel.Text), ColourAmberSoft, ColourGreySoft)
            PaddingLeft: =10
            PaddingRight: =10
            Visible: =DraftCount > 0
            X: =16
            Y: =182
            Width: =If(AnywayCheck.Visible, Parent.Width - 32 - 136, Parent.Width - 32)
            Height: =40
      - AnywayCheck:
          Control: ModernCheckbox
          Properties:
            # Kept for the email it was ticked on (varAnyway holds its first key), so a tick never carries to the next email.
            Label: ="Send anyway"
            Default: =varAnyway = ThisEmail.SentKey
            OnCheck: =Set(varAnyway, ThisEmail.SentKey)
            OnUncheck: =Set(varAnyway, "")
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =DraftCount > 0 && !IsBlank(WarnLabel.Text) && !((ThisEmail.IsSent || ThisEmail.SentKey in varSentIds))
            X: =Parent.Width - 144
            Y: =186
            Width: =128
            Height: =32
      # ------------------------------------------------------------------ the email as it will arrive
      - FileChip:
          Control: Label
          Properties:
            # From, the reference and the file of a long list (D314, D315).
            Text: |-
              ="From the shared SACM mailbox · " &
              If(IsBlank(RefValue.Text), "the reference is given at the first Test to me, Send, Outlook draft or Teams", "Ref. " & RefValue.Text) & " · " &
              If(
                  IsBlank(ThisEmail.Csv),
                  ThisEmail.CiCount & If(ThisEmail.CiCount = 1, " CI", " CIs") & ", every line is in the email",
                  ThisEmail.CiCount & " CIs, the full list goes as the file " & Coalesce(RefValue.Text, "SACM-······") & ".csv")
            Font: =AppFont
            Size: =9
            Color: =If(IsBlank(ThisEmail.Csv), ColourMuted, ColourBlue)
            Visible: =DraftCount > 0
            X: =16
            Y: =228
            Width: =Parent.Width - 32
            Height: =36
      - PreviewView:
          Control: HtmlViewer
          Properties:
            # The email as it goes (its Html, joined from the pieces), with its reference and the manager's name. The
            # modern controls have no HTML viewer: this one stays classic (D317).
            HtmlText: |-
              =Substitute(Substitute(ThisEmail.Html, "%%REF%%", Coalesce(RefValue.Text, "SACM-······")), "%%SENDER%%", MeHtml)
            Fill: =ColourMailPage
            Visible: =DraftCount > 0
            X: =8
            Y: =268
            Width: =Parent.Width - 16
            Height: =Parent.Height - 268 - 104
      # ------------------------------------------------------------------ the buttons
      - SendWhy:
          Control: Label
          Properties:
            # Why Send, Test to me and Outlook draft are grey. Empty when they are on. Not shown: WhyLine says it.
            Text: |-
              =If(
                  DraftCount = 0, "",
                  EmailCount > 1, "The app got " & EmailCount & " emails: give its Power Apps visual the filter Selected email is 1 (README 6.6).",
                  !IsBlank(varAsk) && varAsk.Keys <> ThisEmail.Keys, "Answer first whether the email to " & varAsk.To & " went: choose it in the list again.",
                  (ThisEmail.IsSent || ThisEmail.SentKey in varSentIds), "Sent. It leaves the list after the next refresh.",
                  ThisEmail.Whole = "cut", "The app got only part of this email. Press Refresh in the report's top bar; if it stays, give its Power Apps visual every field of AppEmail (README 6.6).",
                  ThisEmail.Whole = "unknown", "Add the fields HtmlLength and CsvLength of AppEmail to the Power Apps visual (README 6.6).",
                  IsBlank(Trim(ToText.Text)), Coalesce(ThisEmail.AddressWhy, "Fill in To first."),
                  IsBlank(RefValue.Text) && !(NewRefWords in SubjectText.Text), "Keep the words " & NewRefWords & " in Subject: they become the reference a reply is found by.",
                  !IsBlank(WarnLabel.Text) && varAnyway <> ThisEmail.SentKey, "Read the warning, then tick Send anyway.",
                  "")
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - WhyLine:
          Control: Label
          Properties:
            # Why a button is grey, in words above the buttons (LOOK rule 7): Send, Test to me and Outlook draft, then
            # Teams.
            Text: |-
              =If(
                  !IsBlank(SendWhy.Text), SendWhy.Text,
                  !IsBlank(TeamsWhy.Text), "Teams is off: " & TeamsWhy.Text,
                  "")
            Font: =AppFont
            Size: =9
            Color: =If(IsBlank(Trim(ToText.Text)), ColourRed, ColourMuted)
            VerticalAlign: =VerticalAlign.Bottom
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> ThisEmail.Keys)
            X: =16
            Y: =Parent.Height - 100
            Width: =Parent.Width - 32
            Height: =36
      - OutlookButton:
          Control: ModernButton
          Properties:
            Text: ="Outlook draft"
            Icon: ="Mail"
            Appearance: =ButtonAppearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: ="Put it in your own Drafts in Outlook, From the SACM mailbox, to change it before you send it"
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> ThisEmail.Keys) && !((ThisEmail.IsSent || ThisEmail.SentKey in varSentIds))
            DisplayMode: =If(IsBlank(SendWhy.Text), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =With(
                  {
                      d: ThisEmail,
                      ref: Coalesce(RefValue.Text, "SACM-" & Concat(Sequence(6), Mid(RefLetters, RandBetween(1, Len(RefLetters)), 1))),
                      addresses: Filter(ForAll(Split(Substitute(Trim(ToText.Text), ",", ";"), ";") As address, Trim(address.Value)), !IsBlank(Value)),
                      copies: Filter(ForAll(Split(Substitute(Trim(CcText.Text), ",", ";"), ";") As address, Trim(address.Value)), !IsBlank(Value))
                  },
                  If(IsBlank(RefValue.Text), Set(varRef, { Id: d.SentKey, Ref: ref }));
                  With(
                      {
                          subject: Substitute(Trim(SubjectText.Text), NewRefWords, ref),
                          // The draft as Microsoft Graph takes it (POST /me/messages). The flow puts the file in place of
                          // %%CSV%% and the address of the shared mailbox in place of %%FROM%% (README §6.3, F7).
                          message: JSON(
                              {
                                  subject: Substitute(Trim(SubjectText.Text), NewRefWords, ref),
                                  body: { contentType: "HTML", content: Substitute(Substitute(d.Html, "%%REF%%", ref), "%%SENDER%%", MeHtml) },
                                  toRecipients: ForAll(addresses As address, { emailAddress: { address: address.Value } }),
                                  ccRecipients: ForAll(copies As address, { emailAddress: { address: address.Value } }),
                                  from: { emailAddress: { address: "%%FROM%%" } },
                                  attachments: Filter(
                                      Table({ '@odata.type': "#microsoft.graph.fileAttachment", name: ref & ".csv", contentType: "text/csv", contentBytes: "%%CSV%%" }),
                                      !IsBlank(d.Csv))
                              },
                              JSONFormat.Compact)
                      },
                      IfError(
                          With(
                              { answer: SACMDraft.Run(message, d.Csv & "") },
                              Launch(answer.link);
                              Notify("The draft is in your Drafts in Outlook, From the SACM mailbox. Send it there, then answer Sent from Outlook.", NotificationType.Success);
                              Set(varAsk, { DraftId: d.DraftId, SentKey: d.SentKey, Channel: "outlook", Ref: ref, To: Concat(addresses, Value, "; "), Cc: Concat(copies, Value, "; "), Subject: subject, Text: "", Kind: d.Kind, Keys: d.Keys, NewKeys: d.NewKeys, FreeKeys: d.FreeKeys })
                          ),
                          Notify("No draft was made: " & FirstError.Message, NotificationType.Error)
                      )
                  )
              )
            X: =Parent.Width - 504
            Y: =Parent.Height - 56
            Width: =116
            Height: =40
      - TeamsButton:
          Control: ModernButton
          Properties:
            Text: ="Teams"
            Icon: ="Chat"
            Appearance: =ButtonAppearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: =Coalesce(TeamsWhy.Text, "Open a Teams chat with the person, with the first message ready")
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> ThisEmail.Keys) && !((ThisEmail.IsSent || ThisEmail.SentKey in varSentIds))
            DisplayMode: =If(IsBlank(SendWhy.Text) && IsBlank(TeamsWhy.Text), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =With(
                  {
                      d: ThisEmail,
                      ref: Coalesce(RefValue.Text, "SACM-" & Concat(Sequence(6), Mid(RefLetters, RandBetween(1, Len(RefLetters)), 1))),
                      users: Filter(ForAll(Split(Substitute(Trim(ToText.Text), ",", ";"), ";") As address, Trim(address.Value)), !IsBlank(Value))
                  },
                  If(IsBlank(RefValue.Text), Set(varRef, { Id: d.SentKey, Ref: ref }));
                  With(
                      { chat: Substitute(Substitute(d.Chat, "%%REF%%", ref), "%%SENDER%%", MeName), subject: Substitute(Trim(SubjectText.Text), NewRefWords, ref) },
                      // A Teams deep link (teamsLink of the HTML app): a new chat with these people, a topic when they are
                      // more than one, and the first message, which the manager can still change. The app makes no connection.
                      Launch(
                          "https://teams.microsoft.com/l/chat/0/0?users=" & Concat(users, EncodeUrl(Value), ",") &
                          If(CountRows(users) > 1, "&topicName=" & EncodeUrl(subject), "") &
                          "&message=" & EncodeUrl(chat));
                      // As the HTML app records a chat (TeamsDialog): every case of the message, a first message when
                      // nobody was asked yet, else a reminder.
                      Set(varAsk, { DraftId: d.DraftId, SentKey: d.SentKey, Channel: "teams", Ref: ref, To: Concat(users, Value, "; "), Cc: "", Subject: subject, Text: chat, Kind: If(d.Kind = "first", "first", "reminder"), Keys: d.Keys, NewKeys: "", FreeKeys: d.FreeKeys })
                  )
              )
            X: =Parent.Width - 380
            Y: =Parent.Height - 56
            Width: =116
            Height: =40
      - TeamsWhy:
          Control: Label
          Properties:
            # Why Teams is grey when Send is on (LOOK rule 7): shown in its tooltip and by WhyLine.
            Text: |-
              =If(
                  ThisEmail.Mailbox, "A mailbox gets an email, not a chat.",
                  ThisEmail.PartCount > 1 || !IsBlank(ThisEmail.Csv), "A long list goes by email, with its file.",
                  CountRows(Split(Substitute(Trim(ToText.Text), ",", ";"), ";")) > TeamsLimit, "More than " & TeamsLimit & " people: use email.",
                  "")
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - TestButton:
          Control: ModernButton
          Properties:
            Text: ="Test to me"
            Icon: ="Eye"
            Appearance: =ButtonAppearance.Secondary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: ="Send it, with its file, to you only. The cases are not changed."
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> ThisEmail.Keys) && !((ThisEmail.IsSent || ThisEmail.SentKey in varSentIds))
            DisplayMode: =If(EmailCount <> 1 || ThisEmail.Whole <> "yes", DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  {
                      d: ThisEmail,
                      ref: Coalesce(RefValue.Text, "SACM-" & Concat(Sequence(6), Mid(RefLetters, RandBetween(1, Len(RefLetters)), 1)))
                  },
                  If(IsBlank(RefValue.Text), Set(varRef, { Id: d.SentKey, Ref: ref }));
                  IfError(
                      SACMTest.Run(
                          "[TEST for " & Coalesce(Trim(ToText.Text), "nobody yet") & "] " & Substitute(Trim(SubjectText.Text), NewRefWords, ref),
                          Substitute(Substitute(d.Html, "%%REF%%", ref), "%%SENDER%%", MeHtml),
                          d.Csv & "", ref & ".csv");
                      Notify("Test sent to you (" & MeEmail & ") from the shared mailbox" & If(IsBlank(d.Csv), "", ", with the file") & ". The cases are not changed.", NotificationType.Success),
                      Notify("The test was not sent: " & FirstError.Message, NotificationType.Error)
                  )
              )
            X: =Parent.Width - 256
            Y: =Parent.Height - 56
            Width: =116
            Height: =40
      - SendButton:
          Control: ModernButton
          Properties:
            Text: ="Send"
            Icon: ="Send"
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Tooltip: ="Send it from the shared SACM mailbox, with its file, and record it on the cases"
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> ThisEmail.Keys) && !((ThisEmail.IsSent || ThisEmail.SentKey in varSentIds))
            DisplayMode: =If(IsBlank(SendWhy.Text), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =Set(varError, "");
              With(
                  {
                      d: ThisEmail,
                      ref: Coalesce(RefValue.Text, "SACM-" & Concat(Sequence(6), Mid(RefLetters, RandBetween(1, Len(RefLetters)), 1))),
                      to: Trim(ToText.Text), cc: Trim(CcText.Text)
                  },
                  If(IsBlank(RefValue.Text), Set(varRef, { Id: d.SentKey, Ref: ref }));
                  With(
                      { subject: Substitute(Trim(SubjectText.Text), NewRefWords, ref) },
                      Set(
                          varSent,
                          IfError(
                              SACMSend.Run(to, cc, subject, Substitute(Substitute(d.Html, "%%REF%%", ref), "%%SENDER%%", MeHtml), d.Csv & "", ref & ".csv");
                              true,
                              Set(varError, FirstError.Message);
                              false
                          )
                      );
                      If(
                          !varSent,
                          Notify("Not sent: " & varError, NotificationType.Error),
                          // Recorded as the HTML app records it (recordSent), for every part of the email under its one
                          // reference (D314): the message on the cases still open, the points new since the first message
                          // as a first message with the same reference (D161), and the cases nobody had become the
                          // sender's (D164).
                          With(
                              {
                                  still: Concat(Filter(Split(d.Keys, Char(10)) As key, !IsBlank(key.Value) && !(key.Value in Split(d.NewKeys, Char(10)).Value)), Value, Char(10))
                              },
                              IfError(
                                  If(
                                      !IsBlank(still),
                                      Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "message", Keys: still, Ref: ref, To: to, Cc: cc, Subject: subject, Kind: d.Kind, Channel: "mailbox" })
                                  );
                                  If(
                                      !IsBlank(d.NewKeys),
                                      Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "message", Keys: d.NewKeys, Ref: ref, To: to, Cc: cc, Subject: subject, Kind: "first", Channel: "mailbox" })
                                  );
                                  If(
                                      !IsBlank(d.FreeKeys) && !IsBlank(MeName),
                                      Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "assign", Keys: d.FreeKeys, Text: MeName })
                                  );
                                  Notify("Sent from the shared mailbox to " & to & ". Choose the next email in the list at the left.", NotificationType.Success),
                                  Notify("Sent, but not recorded: " & FirstError.Message & ". Add a note on the cases.", NotificationType.Error)
                              )
                          );
                          Set(varSentIds, varSentIds & d.SentKey);
                          Set(varLast, { Key: d.SentKey, Channel: "mailbox", To: to, At: Now(), Cases: CountRows(Filter(Split(d.Keys, Char(10)), !IsBlank(Value))) });
                          Set(varAnyway, "")
                      )
                  )
              )
            X: =Parent.Width - 132
            Y: =Parent.Height - 56
            Width: =116
            Height: =40
      # ------------------------------------------------------------------ after Outlook draft or Teams: did it go?
      - AskLabel:
          Control: Label
          Properties:
            Text: |-
              =If(varAsk.Channel = "teams", "Did you start the chat? Yes records it on the cases.", "Sent from Outlook? Yes records it on the cases.")
            Font: =AppFont
            Size: =10
            Color: =ColourInk
            Fill: =ColourBlueSoft
            PaddingLeft: =10
            Visible: =!IsBlank(varAsk) && varAsk.Keys = ThisEmail.Keys
            X: =16
            Y: =Parent.Height - 56
            Width: =Parent.Width - 32 - 256
            Height: =40
      - NoButton:
          Control: ModernButton
          Properties:
            Text: ="No"
            Appearance: =ButtonAppearance.Secondary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =!IsBlank(varAsk) && varAsk.Keys = ThisEmail.Keys
            OnSelect: =Set(varAsk, Blank())
            X: =Parent.Width - 256
            Y: =Parent.Height - 56
            Width: =116
            Height: =40
      - YesButton:
          Control: ModernButton
          Properties:
            Text: ="Yes"
            Icon: ="Checkmark"
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Visible: =!IsBlank(varAsk) && varAsk.Keys = ThisEmail.Keys
            OnSelect: |-
              =With(
                  {
                      // The cases are those kept when the manager pressed Outlook draft or Teams: a refresh in between
                      // may number the drafts again. A chat is recorded on every case at once (no new points); an email
                      // splits off the new points (D161).
                      sent: varAsk,
                      still: Concat(Filter(Split(varAsk.Keys, Char(10)) As key, !IsBlank(key.Value) && !(key.Value in Split(varAsk.NewKeys, Char(10)).Value)), Value, Char(10))
                  },
                  IfError(
                      If(
                          !IsBlank(still),
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "message", Keys: still, Ref: sent.Ref, To: sent.To, Cc: sent.Cc, Subject: sent.Subject, Kind: sent.Kind, Channel: sent.Channel, Text: sent.Text })
                      );
                      If(
                          !IsBlank(sent.NewKeys),
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "message", Keys: sent.NewKeys, Ref: sent.Ref, To: sent.To, Cc: sent.Cc, Subject: sent.Subject, Kind: "first", Channel: sent.Channel, Text: sent.Text })
                      );
                      If(
                          !IsBlank(sent.FreeKeys) && !IsBlank(MeName),
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "assign", Keys: sent.FreeKeys, Text: MeName })
                      );
                      Notify(If(sent.Channel = "teams", "Recorded: the Teams chat.", "Recorded as sent from Outlook.") & " The report shows it after the next refresh.", NotificationType.Success);
                      Set(varSentIds, varSentIds & sent.SentKey);
                      Set(varLast, { Key: sent.SentKey, Channel: sent.Channel, To: sent.To, At: Now(), Cases: CountRows(Filter(Split(sent.Keys, Char(10)), !IsBlank(Value))) });
                      Set(varAsk, Blank()),
                      Notify("Not recorded: " & FirstError.Message, NotificationType.Error)
                  )
              )
            X: =Parent.Width - 132
            Y: =Parent.Height - 56
            Width: =116
            Height: =40
