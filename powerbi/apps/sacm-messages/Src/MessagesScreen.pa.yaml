# The one screen of the Power App "SACM messages", the email studio (builds B7 and D5, D301, D313 to D317), written by
# hand. To use it: in Power Apps Studio, select the screen in the Tree view, then Paste (Ctrl+V) this whole file
# (powerbi/README.md §6.6). It is drawn for the place of the app on the page Messages: 1032 × 620 (README §6.4).
# Three columns, as the mockup of design A (design pass §7):
#   - Left: the emails ready to send (the tabs choose All, First, Reminder or Escalate). A long message is one email
#     with its full list as a file (D314).
#   - Middle: the email exactly as it will arrive (Drafts[Html], D313), with its reference and the manager's name.
#   - Right: From (the shared SACM mailbox, D315), To, Cc and Subject, which the manager can change; the warning when a
#     colleague wrote to the same person or about the same cases in the last 24 hours; and the buttons:
#       Send (the main button): flow F2 (SACMSend) sends it from the shared mailbox, with its file. Then the app adds the
#         message to the list SACM Journal (D272: rows are only added) for EVERY part of the email, under its one
#         reference, and asks flow F5 (SACMRefresh) to refresh the report.
#       Test to me: flow F4 (SACMTest) sends it, with its file, to the manager only. The cases are not changed.
#       Outlook draft: flow F7 (SACMDraft) puts it in the manager's own Drafts, From = the shared mailbox (D315), and
#         Outlook on the web opens it. The manager sends it there, then answers "Sent from Outlook?". Yes records it.
#       Teams: opens a Teams chat with the person and the first message, then asks "Did you start the chat?".
# Nothing is sent without a press (D2). One main button (LOOK rule 6); a grey button says why (LOOK rule 7).
Screens:
  MessagesScreen:
    Properties:
      Fill: =ColourSurface
      OnVisible: |-
        =Set(varAsk, Blank());
        Set(varOpen, First(Emails).DraftId);
        Set(varRef, { Id: First(Emails).DraftId, Ref: "SACM-" & Concat(Sequence(6), Mid(RefLetters, RandBetween(1, Len(RefLetters)), 1)) })
    Children:
      # ------------------------------------------------------------------ the head: how many, and the tabs
      - HeadTitle:
          Control: Label
          Properties:
            Text: |-
              =If(
                  DraftCount = 0, "Nothing to send",
                  EmailCount & If(EmailCount = 1, " email ready to send", " emails ready to send")) &
              If(TooManyDrafts, " · the report gives the app 1,000 messages at most: filter the page", "")
            Font: =AppFont
            FontWeight: =FontWeight.Semibold
            Size: =12
            Color: =ColourInk
            X: =16
            Y: =10
            Width: =Parent.Width - 520
            Height: =32
      - KindTabs:
          Control: ModernTabList@1.0.0
          Properties:
            Items: =KindTabs
            Default: ="All"
            Appearance: =TabListAppearance.Subtle
            Alignment: =TabListAlignment.End
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            AccessibleLabel: ="Which emails the list shows"
            Visible: =DraftCount > 0
            X: =Parent.Width - 496
            Y: =8
            Width: =480
            Height: =36
      - HeadRule:
          Control: Rectangle
          Properties:
            Fill: =ColourLine
            X: =0
            Y: =51
            Width: =Parent.Width
            Height: =1
      # ------------------------------------------------------------------ the list
      - EmptyLabel:
          Control: Label
          Properties:
            Text: |-
              ="No email is ready to send. After the next report, or when a reminder is due, the list shows it here."
            Font: =AppFont
            Size: =10.5
            Color: =ColourMuted
            Align: =Align.Center
            Visible: =DraftCount = 0
            X: =32
            Y: =120
            Width: =Parent.Width - 64
            Height: =64
      - DraftGallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: |-
              =If(
                  KindTabs.Selected.Value = "All", Emails,
                  Filter(Emails, Kind = LookUp(KindOf, Tab = KindTabs.Selected.Value).Kind))
            Default: =LookUp(Emails, DraftId = varOpen)
            TemplateSize: =64
            TemplatePadding: =0
            TemplateFill: =If(ThisItem.IsSelected, ColourNavySoft, ColourSurface)
            Visible: =DraftCount > 0
            OnSelect: |-
              =Set(varOpen, ThisItem.DraftId);
              Reset(AnywayCheck);
              // The journal is read again when an email is opened, so the warning knows a colleague's latest message.
              Refresh('SACM Journal');
              If(
                  IsBlank(ThisItem.Ref) && varRef.Id <> ThisItem.DraftId,
                  Set(varRef, { Id: ThisItem.DraftId, Ref: "SACM-" & Concat(Sequence(6), Mid(RefLetters, RandBetween(1, Len(RefLetters)), 1)) })
              )
            X: =0
            Y: =52
            Width: =248
            Height: =Parent.Height - 52
          Children:
            - ItemBar:
                Control: Rectangle
                Properties:
                  Fill: =ColourNavy
                  Visible: =ThisItem.IsSelected
                  X: =0
                  Y: =0
                  Width: =3
                  Height: =Parent.TemplateHeight
            - ItemName:
                Control: Label
                Properties:
                  Text: =Coalesce(ThisItem.ToName, ThisItem.To, "Nobody known yet")
                  Font: =AppFont
                  FontWeight: =FontWeight.Semibold
                  Size: =10.5
                  Color: =ColourInk
                  X: =16
                  Y: =8
                  Width: =Parent.TemplateWidth - 112
                  Height: =24
            - ItemChip:
                Control: Label
                Properties:
                  # The kind in a word, in its colour (LOOK rule 5); Sent once this app sent it.
                  Text: |-
                    =If(
                        "|" & ThisItem.DraftId & "|" in varSentIds, "Sent",
                        Switch(ThisItem.Kind, "first", "First", "reminder", "Reminder", "escalation", "Escalate", ThisItem.KindLabel))
                  Font: =AppFont
                  FontWeight: =FontWeight.Semibold
                  Size: =9
                  Align: =Align.Center
                  Color: |-
                    =If("|" & ThisItem.DraftId & "|" in varSentIds, ColourGreen, Coalesce(LookUp(KindColour, Kind = ThisItem.Kind).Ink, ColourGrey))
                  Fill: |-
                    =If("|" & ThisItem.DraftId & "|" in varSentIds, ColourGreenSoft, Coalesce(LookUp(KindColour, Kind = ThisItem.Kind).Soft, ColourGreySoft))
                  X: =Parent.TemplateWidth - 92
                  Y: =10
                  Width: =80
                  Height: =20
            - ItemLine:
                Control: Label
                Properties:
                  Text: |-
                    =ThisItem.CiCount & If(ThisItem.CiCount = 1, " CI", " CIs") &
                    If(ThisItem.Topics > 1, " · " & ThisItem.Topics & " kinds", "") &
                    If(IsBlank(ThisItem.About), "", " · about " & ThisItem.About) &
                    If(IsBlank(ThisItem.Csv), "", " · with a file") &
                    " · " & If(IsBlank(ThisItem.AssignedTo), "free", ThisItem.AssignedTo = MeName, "mine", ThisItem.AssignedTo) &
                    If(!IsBlank(varAsk) && varAsk.Keys = ThisItem.Keys, " · sent? open it", "")
                  Font: =AppFont
                  Size: =9
                  Color: =ColourMuted
                  X: =16
                  Y: =34
                  Width: =Parent.TemplateWidth - 28
                  Height: =22
            - ItemRule:
                Control: Rectangle
                Properties:
                  Fill: =ColourLine
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
      - ListRule:
          Control: Rectangle
          Properties:
            Fill: =ColourLine
            Visible: =DraftCount > 0
            X: =248
            Y: =52
            Width: =1
            Height: =Parent.Height - 52
      # ------------------------------------------------------------------ the email as it will arrive
      - RefValue:
          Control: Label
          Properties:
            # The reference of the email open: a reminder keeps the one of its first message (D5); a new email gets the
            # one the app made when the manager opened it ("SACM-" and six letters and digits, as the HTML app). Not shown:
            # the formulas read it.
            Text: |-
              =If(
                  !IsBlank(DraftGallery.Selected.Ref), DraftGallery.Selected.Ref,
                  varRef.Id = DraftGallery.Selected.DraftId, varRef.Ref,
                  "")
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - PreviewTitle:
          Control: Label
          Properties:
            Text: |-
              =Switch(DraftGallery.Selected.Kind, "first", "First message", "reminder", "Reminder", "escalation", "Escalation", DraftGallery.Selected.KindLabel) &
              " to " & Coalesce(DraftGallery.Selected.ToName, DraftGallery.Selected.To, "nobody known yet")
            Font: =AppFont
            FontWeight: =FontWeight.Semibold
            Size: =11
            Color: =ColourInk
            Visible: =DraftCount > 0
            X: =264
            Y: =60
            Width: =Parent.Width - 264 - 288 - 168
            Height: =28
      - PreviewRef:
          Control: Label
          Properties:
            Text: =If(IsBlank(RefValue.Text), "Ref. given when you open it", "Ref. " & RefValue.Text)
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Align: =Align.Right
            Visible: =DraftCount > 0
            X: =Parent.Width - 288 - 168
            Y: =60
            Width: =160
            Height: =28
      - FileChip:
          Control: Label
          Properties:
            # A long list (D314): the tables show their first lines, and the full list goes as a file.
            Text: |-
              =If(
                  IsBlank(DraftGallery.Selected.Csv),
                  DraftGallery.Selected.CiCount & If(DraftGallery.Selected.CiCount = 1, " CI", " CIs") & " · every line is in the email",
                  DraftGallery.Selected.CiCount & " CIs · long list: the full list goes as the file " & RefValue.Text & ".csv")
            Font: =AppFont
            Size: =9
            Color: =If(IsBlank(DraftGallery.Selected.Csv), ColourMuted, ColourAmber)
            Visible: =DraftCount > 0
            X: =264
            Y: =86
            Width: =Parent.Width - 264 - 288
            Height: =20
      - PreviewView:
          Control: HtmlViewer
          Properties:
            # The email as it goes (Drafts[Html]), with its reference and the manager's name. The modern controls have no
            # HTML viewer: this one stays classic (D317).
            HtmlText: |-
              =Substitute(Substitute(DraftGallery.Selected.Html, "%%REF%%", Coalesce(RefValue.Text, "SACM-······")), "%%SENDER%%", MeHtml)
            Fill: =ColourMailPage
            Visible: =DraftCount > 0
            X: =256
            Y: =112
            Width: =Parent.Width - 256 - 280
            Height: =Parent.Height - 120
      - FieldsRule:
          Control: Rectangle
          Properties:
            Fill: =ColourLine
            Visible: =DraftCount > 0
            X: =Parent.Width - 273
            Y: =52
            Width: =1
            Height: =Parent.Height - 52
      # ------------------------------------------------------------------ the fields
      - FromCaption:
          Control: Label
          Properties:
            Text: ="From"
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =60
            Width: =240
            Height: =18
      - FromValue:
          Control: Label
          Properties:
            Text: ="The shared SACM mailbox"
            Font: =AppFont
            Size: =10
            Color: =ColourInk
            Fill: =ColourGreySoft
            PaddingLeft: =10
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =78
            Width: =240
            Height: =32
      - ToCaption:
          Control: Label
          Properties:
            Text: =If(DraftGallery.Selected.NobodyAbove, "To (nobody is known above: type the address)", "To")
            Font: =AppFont
            Size: =9
            Color: =If(DraftGallery.Selected.NobodyAbove && IsBlank(Trim(ToText.Text)), ColourRed, ColourMuted)
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =116
            Width: =240
            Height: =18
      - ToText:
          Control: ModernTextInput@1.0.0
          Properties:
            Default: =DraftGallery.Selected.To
            Placeholder: ="name@company; name@company"
            AccessibleLabel: ="To"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =134
            Width: =240
            Height: =32
      - CcCaption:
          Control: Label
          Properties:
            Text: ="Cc"
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =172
            Width: =240
            Height: =18
      - CcText:
          Control: ModernTextInput@1.0.0
          Properties:
            Default: =DraftGallery.Selected.Cc
            Placeholder: ="Nobody"
            AccessibleLabel: ="Cc"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =190
            Width: =240
            Height: =32
      - SubjectCaption:
          Control: Label
          Properties:
            Text: ="Subject"
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =228
            Width: =240
            Height: =18
      - SubjectText:
          Control: ModernTextInput@1.0.0
          Properties:
            Default: =Substitute(DraftGallery.Selected.Subject, "%%REF%%", RefValue.Text)
            Type: =TextInputType.Multiline
            AccessibleLabel: ="Subject"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =246
            Width: =240
            Height: =56
      - WarnLabel:
          Control: Label
          Properties:
            # The double contact (doubleContacts of src/core/team/team.ts): a colleague's message of the last 24 hours to
            # one of these addresses, or about one of these cases. Empty when there is none. Not shown: StateBox says it.
            Text: |-
              =With(
                  {
                      toList: ForAll(Split(Lower(Substitute(ToText.Text, ",", ";")), ";") As address, Trim(address.Value)),
                      keyList: ForAll(Split(DraftGallery.Selected.Keys, Char(10)) As key, Trim(key.Value))
                  },
                  With(
                      {
                          found: Filter(
                              RecentMessages As event,
                              CountRows(Filter(Split(Lower(Substitute(event.To, ",", ";")), ";") As address, !IsBlank(Trim(address.Value)) && Trim(address.Value) in toList.Value)) > 0 ||
                              CountRows(Filter(Split(event.Keys, Char(10)) As key, !IsBlank(Trim(key.Value)) && Trim(key.Value) in keyList.Value)) > 0)
                      },
                      If(
                          CountRows(found) = 0, "",
                          "A colleague wrote lately: " &
                          Concat(
                              FirstN(Sort(found, At, SortOrder.Descending), 3) As event,
                              Coalesce(event.ByName, event.By) & " at " & Text(event.At, "d mmm hh:mm") & ", " &
                              If(
                                  CountRows(Filter(Split(Lower(Substitute(event.To, ",", ";")), ";") As address, !IsBlank(Trim(address.Value)) && Trim(address.Value) in toList.Value)) > 0,
                                  "to the same person",
                                  "about " & CountRows(Filter(Split(event.Keys, Char(10)) As key, Trim(key.Value) in keyList.Value)) & " of these cases"),
                              "; ") &
                          If(CountRows(found) > 3, " and " & (CountRows(found) - 3) & " more", "") & "."
                      )
                  )
              )
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - StateBox:
          Control: Label
          Properties:
            # One line on what happens: sent, a colleague wrote lately, or nobody wrote (the mockup of design A).
            Text: |-
              =If(
                  DraftCount = 0, "",
                  "|" & DraftGallery.Selected.DraftId & "|" in varSentIds,
                  Switch(varLast.Channel, "teams", "Teams chat recorded with ", "outlook", "Recorded as sent from Outlook to ", "Sent from the SACM mailbox to ") &
                  varLast.To & " at " & Text(varLast.At, "hh:mm") & ". " & varLast.Cases &
                  If(varLast.Cases = 1, " case is", " cases are") & " now asked. The report shows it after the refresh, in about a minute.",
                  !IsBlank(WarnLabel.Text), WarnLabel.Text,
                  "Nobody in the team wrote to this person, or about these cases, in the last 24 hours.")
            Font: =AppFont
            Size: =9.5
            Color: |-
              =If("|" & DraftGallery.Selected.DraftId & "|" in varSentIds, ColourGreen, !IsBlank(WarnLabel.Text), ColourRed, ColourGrey)
            Fill: |-
              =If("|" & DraftGallery.Selected.DraftId & "|" in varSentIds, ColourGreenSoft, !IsBlank(WarnLabel.Text), ColourRedSoft, ColourGreySoft)
            PaddingLeft: =10
            PaddingRight: =10
            Visible: =DraftCount > 0
            X: =Parent.Width - 256
            Y: =312
            Width: =240
            Height: =76
      - AnywayCheck:
          Control: ModernCheckbox@1.0.0
          Properties:
            Label: ="Send anyway"
            Checked: =false
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: |-
              =DraftCount > 0 && !IsBlank(WarnLabel.Text) && !("|" & DraftGallery.Selected.DraftId & "|" in varSentIds)
            X: =Parent.Width - 256
            Y: =394
            Width: =240
            Height: =32
      # ------------------------------------------------------------------ the buttons
      - SendWhy:
          Control: Label
          Properties:
            # Why Send, Test to me and Outlook draft are grey (LOOK rule 7). Empty when they are on.
            Text: |-
              =If(
                  DraftCount = 0, "",
                  !IsBlank(varAsk) && varAsk.Keys <> DraftGallery.Selected.Keys, "Answer first whether the email to " & varAsk.To & " went: open it in the list.",
                  IsBlank(RefValue.Text), "Press the email in the list to open it.",
                  "|" & DraftGallery.Selected.DraftId & "|" in varSentIds, "Sent. It leaves the list after the refresh.",
                  DraftGallery.Selected.Whole = "cut", "The report gave the app only part of this email (it is too long for the Power Apps visual). Tell the project thread; lower rowsInEmail in Settings to shorten it.",
                  DraftGallery.Selected.Whole = "unknown", "Add the fields HtmlLength and CsvLength of Drafts to the Power Apps visual (README 6.6).",
                  IsBlank(Trim(ToText.Text)), "Fill in To first.",
                  !IsBlank(WarnLabel.Text) && !AnywayCheck.Checked, "Read the warning, then tick Send anyway.",
                  "")
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            VerticalAlign: =VerticalAlign.Bottom
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> DraftGallery.Selected.Keys)
            X: =Parent.Width - 256
            Y: =Parent.Height - 160
            Width: =240
            Height: =44
      - OutlookButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Outlook draft"
            Icon: ="Mail"
            Appearance: =ButtonAppearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: ="Put it in your own Drafts in Outlook, From the SACM mailbox, to change it before you send it"
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> DraftGallery.Selected.Keys) && !("|" & DraftGallery.Selected.DraftId & "|" in varSentIds)
            DisplayMode: =If(IsBlank(SendWhy.Text), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =With(
                  {
                      d: DraftGallery.Selected, ref: RefValue.Text, subject: Trim(SubjectText.Text),
                      addresses: Filter(ForAll(Split(Substitute(Trim(ToText.Text), ",", ";"), ";") As address, Trim(address.Value)), !IsBlank(Value)),
                      copies: Filter(ForAll(Split(Substitute(Trim(CcText.Text), ",", ";"), ";") As address, Trim(address.Value)), !IsBlank(Value))
                  },
                  With(
                      {
                          // The draft as Microsoft Graph takes it (POST /me/messages). The flow puts the file in place of
                          // %%CSV%% and the address of the shared mailbox in place of %%FROM%% (README §6.3, F7).
                          message: JSON(
                              {
                                  subject: subject,
                                  body: { contentType: "HTML", content: Substitute(Substitute(d.Html, "%%REF%%", ref), "%%SENDER%%", MeHtml) },
                                  toRecipients: ForAll(addresses As address, { emailAddress: { address: address.Value } }),
                                  ccRecipients: ForAll(copies As address, { emailAddress: { address: address.Value } }),
                                  from: { emailAddress: { address: "%%FROM%%" } },
                                  attachments: Filter(
                                      Table({ '@odata.type': "#microsoft.graph.fileAttachment", name: ref & ".csv", contentType: "text/csv", contentBytes: "%%CSV%%" }),
                                      !IsBlank(d.Csv))
                              },
                              JSONFormat.Compact)
                      },
                      IfError(
                          With(
                              { answer: SACMDraft.Run(message, d.Csv & "") },
                              Launch(answer.link);
                              Notify("The draft is in your Drafts in Outlook, From the SACM mailbox. Send it there, then answer Sent from Outlook.", NotificationType.Success);
                              Set(varAsk, { DraftId: d.DraftId, Channel: "outlook", Ref: ref, To: Concat(addresses, Value, "; "), Cc: Concat(copies, Value, "; "), Subject: subject, Text: "", Kind: d.Kind, Keys: d.Keys, NewKeys: d.NewKeys, FreeKeys: d.FreeKeys })
                          ),
                          Notify("No draft was made: " & FirstError.Message, NotificationType.Error)
                      )
                  )
              )
            X: =Parent.Width - 256
            Y: =Parent.Height - 108
            Width: =116
            Height: =36
      - TeamsButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Teams"
            Icon: ="Chat"
            Appearance: =ButtonAppearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: =Coalesce(TeamsWhy.Text, "Open a Teams chat with the person, with the first message ready")
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> DraftGallery.Selected.Keys) && !("|" & DraftGallery.Selected.DraftId & "|" in varSentIds)
            DisplayMode: =If(IsBlank(SendWhy.Text) && IsBlank(TeamsWhy.Text), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =With(
                  {
                      d: DraftGallery.Selected, ref: RefValue.Text, subject: Trim(SubjectText.Text),
                      users: Filter(ForAll(Split(Substitute(Trim(ToText.Text), ",", ";"), ";") As address, Trim(address.Value)), !IsBlank(Value))
                  },
                  With(
                      { chat: Substitute(Substitute(d.Chat, "%%REF%%", ref), "%%SENDER%%", MeName) },
                      // A Teams deep link (teamsLink of the HTML app): a new chat with these people, a topic when they are
                      // more than one, and the first message, which the manager can still change. The app makes no connection.
                      Launch(
                          "https://teams.microsoft.com/l/chat/0/0?users=" & Concat(users, EncodeUrl(Value), ",") &
                          If(CountRows(users) > 1, "&topicName=" & EncodeUrl(subject), "") &
                          "&message=" & EncodeUrl(chat));
                      // As the HTML app records a chat (TeamsDialog): every case of the message, a first message when
                      // nobody was asked yet, else a reminder.
                      Set(varAsk, { DraftId: d.DraftId, Channel: "teams", Ref: ref, To: Concat(users, Value, "; "), Cc: "", Subject: subject, Text: chat, Kind: If(d.Kind = "first", "first", "reminder"), Keys: d.Keys, NewKeys: "", FreeKeys: d.FreeKeys })
                  )
              )
            X: =Parent.Width - 132
            Y: =Parent.Height - 108
            Width: =116
            Height: =36
      - TeamsWhy:
          Control: Label
          Properties:
            # Why Teams is grey when Send is on (LOOK rule 7): shown in its tooltip and under the buttons.
            Text: |-
              =If(
                  DraftGallery.Selected.Mailbox, "A mailbox gets an email, not a chat.",
                  DraftGallery.Selected.PartCount > 1 || !IsBlank(DraftGallery.Selected.Csv), "A long list goes by email, with its file.",
                  CountRows(Split(Substitute(Trim(ToText.Text), ",", ";"), ";")) > TeamsLimit, "More than " & TeamsLimit & " people: use email.",
                  "")
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            Visible: =false
            X: =0
            Y: =0
            Width: =10
            Height: =10
      - TestButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Test to me"
            Icon: ="Eye"
            Appearance: =ButtonAppearance.Secondary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: ="Send it, with its file, to you only. The cases are not changed."
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> DraftGallery.Selected.Keys) && !("|" & DraftGallery.Selected.DraftId & "|" in varSentIds)
            DisplayMode: =If(IsBlank(RefValue.Text), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  { d: DraftGallery.Selected, ref: RefValue.Text },
                  IfError(
                      SACMTest.Run(
                          "[TEST for " & Coalesce(Trim(ToText.Text), "nobody yet") & "] " & Trim(SubjectText.Text),
                          Substitute(Substitute(d.Html, "%%REF%%", ref), "%%SENDER%%", MeHtml),
                          d.Csv & "", ref & ".csv");
                      Notify("Test sent to you (" & MeEmail & ") from the shared mailbox" & If(IsBlank(d.Csv), "", ", with the file") & ". The cases are not changed.", NotificationType.Success),
                      Notify("The test was not sent: " & FirstError.Message, NotificationType.Error)
                  )
              )
            X: =Parent.Width - 256
            Y: =Parent.Height - 60
            Width: =116
            Height: =40
      - SendButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Send"
            Icon: ="Send"
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Tooltip: ="Send it from the shared SACM mailbox, with its file, and record it on the cases"
            Visible: =DraftCount > 0 && (IsBlank(varAsk) || varAsk.Keys <> DraftGallery.Selected.Keys) && !("|" & DraftGallery.Selected.DraftId & "|" in varSentIds)
            DisplayMode: =If(IsBlank(SendWhy.Text), DisplayMode.Edit, DisplayMode.Disabled)
            OnSelect: |-
              =Set(varError, "");
              With(
                  {
                      d: DraftGallery.Selected, ref: RefValue.Text,
                      to: Trim(ToText.Text), cc: Trim(CcText.Text), subject: Trim(SubjectText.Text)
                  },
                  Set(
                      varSent,
                      IfError(
                          SACMSend.Run(to, cc, subject, Substitute(Substitute(d.Html, "%%REF%%", ref), "%%SENDER%%", MeHtml), d.Csv & "", ref & ".csv");
                          true,
                          Set(varError, FirstError.Message);
                          false
                      )
                  );
                  If(
                      !varSent,
                      Notify("Not sent: " & varError, NotificationType.Error),
                      // Recorded as the HTML app records it (recordSent), for every part of the email under its one
                      // reference (D314): the message on the cases still open, the points new since the first message
                      // as a first message with the same reference (D161), and the cases nobody had become the
                      // sender's (D164).
                      With(
                          {
                              still: Concat(Filter(Split(d.Keys, Char(10)) As key, !IsBlank(key.Value) && !(key.Value in Split(d.NewKeys, Char(10)).Value)), Value, Char(10))
                          },
                          IfError(
                              If(
                                  !IsBlank(still),
                                  Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, Type: "message", Keys: still, Ref: ref, To: to, Cc: cc, Subject: subject, Kind: d.Kind, Channel: "mailbox" })
                              );
                              If(
                                  !IsBlank(d.NewKeys),
                                  Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, Type: "message", Keys: d.NewKeys, Ref: ref, To: to, Cc: cc, Subject: subject, Kind: "first", Channel: "mailbox" })
                              );
                              If(
                                  !IsBlank(d.FreeKeys) && !IsBlank(MeName),
                                  Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, Type: "assign", Keys: d.FreeKeys, Text: MeName })
                              );
                              Notify("Sent from the shared mailbox to " & to & ". The report shows it after the next refresh, in about a minute.", NotificationType.Success),
                              Notify("Sent, but not recorded: " & FirstError.Message & ". Add a note on the cases.", NotificationType.Error)
                          )
                      );
                      Set(varSentIds, varSentIds & "|" & d.DraftId & "|");
                      Set(varLast, { Channel: "mailbox", To: to, At: Now(), Cases: CountRows(Filter(Split(d.Keys, Char(10)), !IsBlank(Value))) });
                      Reset(AnywayCheck);
                      IfError(SACMRefresh.Run(), Notify("The refresh could not start now: the report shows it after the next refresh.", NotificationType.Warning))
                  )
              )
            X: =Parent.Width - 132
            Y: =Parent.Height - 60
            Width: =116
            Height: =40
      - NextButton:
          Control: ModernButton@1.0.0
          Properties:
            # After Send: the next email of the list that is not sent yet.
            Text: ="Next email"
            Icon: ="ArrowRight"
            Layout: =ButtonLayout.IconAfter
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Visible: =DraftCount > 0 && "|" & DraftGallery.Selected.DraftId & "|" in varSentIds
            DisplayMode: |-
              =If(IsBlank(LookUp(DraftGallery.AllItems, !("|" & DraftId & "|" in varSentIds))), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  {
                      next: Coalesce(
                          LookUp(DraftGallery.AllItems, Value(Mid(DraftId, 2)) > Value(Mid(DraftGallery.Selected.DraftId, 2)) && !("|" & DraftId & "|" in varSentIds)),
                          LookUp(DraftGallery.AllItems, !("|" & DraftId & "|" in varSentIds)))
                  },
                  Set(varOpen, next.DraftId);
                  Reset(AnywayCheck);
                  Refresh('SACM Journal');
                  If(IsBlank(next.Ref), Set(varRef, { Id: next.DraftId, Ref: "SACM-" & Concat(Sequence(6), Mid(RefLetters, RandBetween(1, Len(RefLetters)), 1)) }))
              )
            X: =Parent.Width - 256
            Y: =Parent.Height - 60
            Width: =240
            Height: =40
      # ------------------------------------------------------------------ after Outlook draft or Teams: did it go?
      - AskLabel:
          Control: Label
          Properties:
            Text: |-
              =If(varAsk.Channel = "teams", "Did you start the chat? Yes records it on the cases.", "Sent from Outlook? Yes records it on the cases.")
            Font: =AppFont
            Size: =10
            Color: =ColourInk
            Fill: =ColourBlueSoft
            PaddingLeft: =10
            Visible: =!IsBlank(varAsk) && varAsk.Keys = DraftGallery.Selected.Keys
            X: =Parent.Width - 256
            Y: =Parent.Height - 116
            Width: =240
            Height: =48
      - NoButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="No"
            Appearance: =ButtonAppearance.Secondary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =!IsBlank(varAsk) && varAsk.Keys = DraftGallery.Selected.Keys
            OnSelect: =Set(varAsk, Blank())
            X: =Parent.Width - 256
            Y: =Parent.Height - 60
            Width: =116
            Height: =40
      - YesButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Yes"
            Icon: ="Checkmark"
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Visible: =!IsBlank(varAsk) && varAsk.Keys = DraftGallery.Selected.Keys
            OnSelect: |-
              =With(
                  {
                      // The cases are those kept when the manager pressed Outlook draft or Teams: a refresh in between
                      // may number the drafts again. A chat is recorded on every case at once (no new points); an email
                      // splits off the new points (D161).
                      sent: varAsk,
                      still: Concat(Filter(Split(varAsk.Keys, Char(10)) As key, !IsBlank(key.Value) && !(key.Value in Split(varAsk.NewKeys, Char(10)).Value)), Value, Char(10))
                  },
                  IfError(
                      If(
                          !IsBlank(still),
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, Type: "message", Keys: still, Ref: sent.Ref, To: sent.To, Cc: sent.Cc, Subject: sent.Subject, Kind: sent.Kind, Channel: sent.Channel, Text: sent.Text })
                      );
                      If(
                          !IsBlank(sent.NewKeys),
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, Type: "message", Keys: sent.NewKeys, Ref: sent.Ref, To: sent.To, Cc: sent.Cc, Subject: sent.Subject, Kind: "first", Channel: sent.Channel, Text: sent.Text })
                      );
                      If(
                          !IsBlank(sent.FreeKeys) && !IsBlank(MeName),
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, Type: "assign", Keys: sent.FreeKeys, Text: MeName })
                      );
                      Notify(If(sent.Channel = "teams", "Recorded: the Teams chat.", "Recorded as sent from Outlook.") & " The report shows it after the next refresh.", NotificationType.Success);
                      Set(varSentIds, varSentIds & "|" & sent.DraftId & "|");
                      Set(varLast, { Channel: sent.Channel, To: sent.To, At: Now(), Cases: CountRows(Filter(Split(sent.Keys, Char(10)), !IsBlank(Value))) });
                      Set(varAsk, Blank());
                      IfError(SACMRefresh.Run(), Notify("The refresh could not start now: the report shows it after the next refresh.", NotificationType.Warning)),
                      Notify("Not recorded: " & FirstError.Message, NotificationType.Error)
                  )
              )
            X: =Parent.Width - 132
            Y: =Parent.Height - 60
            Width: =116
            Height: =40
