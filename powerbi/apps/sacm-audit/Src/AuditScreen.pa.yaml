# The one screen of the Power App "SACM audit" (builds B8, D5 and 0.52.0, D306, D308, D317, D334), written by hand. To use it: in Power
# Apps Studio, select the screen in the Tree view, then Paste (Ctrl+V) this whole file (powerbi/README.md §6.8). It is
# drawn for its place on the page Lifecycle review (300 × 620, README §6.4), with the modern controls (D317).
# What it does, on two tabs:
#   - Lifecycle review: New review adds one row to SACM Journal with the sample the report drew from the newest CI report
#     (D306). Then a manager ticks CIs of the newest review, picks the result (Same in EPO, Not the same, Not in EPO) and
#     a note, and Save adds one row per CI. "Mark N same in EPO" marks at once the CIs whose status EPO shows the same.
#   - Settings: the numbers of the team (D158) with their ranges, and the lines a table of an email shows (D314). Save adds one row to SACM Settings per changed
#     number (the last row counts, D308) and one settings row to SACM Journal that says what changed.
# At the top, the header line (D334) and Refresh now (flow F5, once in each window of the refresh rule, D333). No Save
# refreshes (D332): a review started today, and marks saved since the report's data, show in the app at once, the
# report shows them after the next refresh. The app changes and removes no row, and sends nothing.
Screens:
  AuditScreen:
    Properties:
      Fill: =ColourSurface
    Children:
      - TitleLabel:
          Control: Label
          Properties:
            Text: |-
              ="SACM audit" & If(IsBlank(MeName), "", " · " & MeName) & If(TooManyLines, " · The report gives the app 1,000 lines at most: filter the page.", "")
            Font: =AppFont
            FontWeight: =FontWeight.Semibold
            Size: =11
            Color: =ColourInk
            X: =16
            Y: =8
            Width: =Parent.Width - 32 - 120
            Height: =28
      - RefreshButton:
          Control: ModernButton@1.0.0
          Properties:
            # The only control that asks for a refresh (D332, lint): flow F5 refreshes at most once in each window (D333)
            # and answers what happened. The same formula in the three apps.
            Text: ="Refresh now"
            Icon: ="ArrowSync"
            Appearance: =ButtonAppearance.Subtle
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: =RefreshRuleText
            OnSelect: |-
              =With(
                  { answer: IfError(SACMRefresh.Run(), { result: "error", at: "", by: "", message: "" }) },
                  Switch(
                      answer.result,
                      "started", Notify(RefreshStartedText, NotificationType.Success),
                      "taken", Notify(Switch(Lower(Coalesce(answer.by, "")), "", "A colleague", "button", "A colleague", "reply", "A reply that came in", Coalesce(LookUp('SACM Team', Lower(Email) = Lower(answer.by)).Title, answer.by)) & " asked for a refresh at " & answer.at & ". One refresh every " & RefreshWindowWords & ": " & RefreshNextText & ". Your work is saved, and this app shows it.", NotificationType.Information),
                      "closed", Notify(RefreshClosedText, NotificationType.Information),
                      "refused", Notify("Power BI did not start the refresh: " & answer.message & ". Your work is saved.", NotificationType.Warning),
                      Notify(RefreshErrorText, NotificationType.Error)
                  )
              )
            X: =Parent.Width - 128
            Y: =6
            Width: =112
            Height: =32
      - ReportLabel:
          Control: Label
          Properties:
            # The header line (D334): the time of the report's data, and how many changes of the team it does not show yet.
            Text: =ReportLine
            Tooltip: =RefreshRuleText
            Font: =AppFont
            Size: =9
            Color: =ColourMuted
            X: =16
            Y: =38
            Width: =Parent.Width - 32
            Height: =32
      - Tabs:
          Control: ModernTabList@1.0.0
          Properties:
            Items: =["Lifecycle review", "Settings"]
            Default: ="Lifecycle review"
            Appearance: =TabListAppearance.Underline
            Alignment: =TabListAlignment.Start
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            AccessibleLabel: ="The review or the settings"
            X: =8
            Y: =72
            Width: =Parent.Width - 16
            Height: =40
      - HeadRule:
          Control: Rectangle
          Properties:
            Fill: =ColourLine
            X: =0
            Y: =115
            Width: =Parent.Width
            Height: =1
      # ------------------------------------------------------------------ the lifecycle review
      - ReviewLine:
          Control: Label
          Properties:
            Text: |-
              =If(
                  IsEmpty(CurrentLines), "No lifecycle review yet. New review draws " & CountRows(NextLines) & " CIs from the newest CI report.",
                  "Review " & CurrentId & ": " & MarkedCount & " of " & CountRows(CurrentLines) & " CIs checked." &
                  If(ReviewPending, " Review of today: not in the report yet. Marks are saved on it.", "") &
                  // Why the buttons are grey (LOOK rule 7).
                  If(StartedToday && !ReviewPending, " A review was started today: one a day.", "") &
                  If(IsEmpty(Filter(LineGallery.AllItems, MarkCheck.Checked)), " Tick CIs to mark them.", "") &
                  If(IsEmpty(AgreeingLines), " No CI left that EPO shows the same.", ""))
            Font: =AppFont
            Size: =10
            Color: =ColourInk
            Visible: =Tabs.Selected.Value = "Lifecycle review"
            X: =16
            Y: =124
            Width: =Parent.Width - 32
            Height: =40
      - NewReviewButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="New review"
            Icon: ="Add"
            # The main button only while there is no review to mark (LOOK rule 6: one main button).
            Appearance: =If(IsEmpty(CurrentLines), ButtonAppearance.Primary, ButtonAppearance.Outline)
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: |-
              =If(
                  StartedToday, "A review was started today: one review a day.",
                  IsEmpty(NextLines), "The newest CI report has no CI to draw.",
                  IsBlank(MeEmail), "The app does not know who you are: sign in again.",
                  TooManyLines, "The report gives the app 1,000 lines at most: filter the page.",
                  "Draw " & CountRows(NextLines) & " CIs from the newest CI report")
            Visible: =Tabs.Selected.Value = "Lifecycle review"
            DisplayMode: |-
              =If(StartedToday || IsEmpty(NextLines) || IsBlank(MeEmail) || TooManyLines, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =IfError(
                  Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "review", Ref: TodayId, Text: NewReviewText, Items: NewReviewItems });
                  Notify("The review is started: " & CountRows(NextLines) & " CIs. Mark them here now; the report shows the review after the next refresh.", NotificationType.Success),
                  Notify("Not started: " & FirstError.Message, NotificationType.Error)
              )
            X: =16
            Y: =168
            Width: =Parent.Width - 32
            Height: =36
      - LineGallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: =CurrentLines
            TemplateSize: =56
            TemplatePadding: =0
            Visible: =Tabs.Selected.Value = "Lifecycle review" && !IsEmpty(CurrentLines)
            X: =16
            Y: =212
            Width: =Parent.Width - 32
            Height: =Parent.Height - 212 - 196
          Children:
            - MarkCheck:
                Control: ModernCheckbox@1.0.0
                Properties:
                  Label: =""
                  Checked: =false
                  AccessibleLabel: ="Mark " & ThisItem.CiName
                  BasePaletteColor: =ColourNavy
                  X: =0
                  Y: =12
                  Width: =32
                  Height: =32
            - MarkName:
                Control: Label
                Properties:
                  Text: =ThisItem.CiName & " · " & ThisItem.ClassLabel
                  Font: =AppFont
                  FontWeight: =FontWeight.Semibold
                  Size: =9.5
                  Color: =ColourInk
                  X: =36
                  Y: =4
                  Width: =Parent.TemplateWidth - 36 - If(ThisItem.CiKey in MarkedSince.CiKey, 128, 0)
                  Height: =22
            - MarkChip:
                Control: Label
                Properties:
                  # A mark saved since the report's data (D334): the report shows it after the next refresh.
                  Text: ="not in the report yet"
                  Font: =AppFont
                  Size: =9
                  Color: =ColourGrey
                  Fill: =ColourGreySoft
                  Align: =Align.Center
                  Visible: =ThisItem.CiKey in MarkedSince.CiKey
                  X: =Parent.TemplateWidth - 124
                  Y: =6
                  Width: =124
                  Height: =18
            - MarkLine:
                Control: Label
                Properties:
                  # The result of the report, or the mark saved since its data (the newest, D334).
                  Text: |-
                    =With(
                        { mark: First(Sort(Filter(MarkedSince, CiKey = ThisItem.CiKey), At, SortOrder.Descending)) },
                        "ServiceNow " & ThisItem.Status & " · EPO " & Coalesce(ThisItem.EpoStatus, "not in the report") & " · " &
                        If(IsBlank(mark.At), ThisItem.ResultLabel, Coalesce(LookUp(ReviewResults, Id = mark.Reason).Label, mark.Reason) & " by " & mark.ByName))
                  Font: =AppFont
                  Size: =9
                  Color: =ColourMuted
                  X: =36
                  Y: =28
                  Width: =Parent.TemplateWidth - 36
                  Height: =22
            - MarkRule:
                Control: Rectangle
                Properties:
                  Fill: =ColourLine
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
      - ResultPick:
          Control: ModernDropdown@1.0.0
          Properties:
            Items: =ReviewResults
            Default: =First(ReviewResults)
            ItemDisplayText: =ThisItem.Label
            AccessibleLabel: ="Result"
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =Tabs.Selected.Value = "Lifecycle review" && !IsEmpty(CurrentLines)
            X: =16
            Y: =Parent.Height - 188
            Width: =Parent.Width - 32
            Height: =36
      - NoteText:
          Control: ModernTextInput@1.0.0
          Properties:
            Default: =""
            Placeholder: ="Note (what EPO says)"
            AccessibleLabel: ="Note"
            Appearance: =Appearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Visible: =Tabs.Selected.Value = "Lifecycle review" && !IsEmpty(CurrentLines)
            X: =16
            Y: =Parent.Height - 144
            Width: =Parent.Width - 32
            Height: =36
      - MarkButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Save the mark"
            Icon: ="Checkmark"
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Tooltip: |-
              =If(IsEmpty(Filter(LineGallery.AllItems, MarkCheck.Checked)), "Tick the CIs first.", IsBlank(ResultPick.Selected.Id), "Pick the result.", "Save the result on the ticked CIs")
            Visible: =Tabs.Selected.Value = "Lifecycle review" && !IsEmpty(CurrentLines)
            DisplayMode: |-
              =If(IsEmpty(Filter(LineGallery.AllItems, MarkCheck.Checked)) || IsBlank(ResultPick.Selected.Id) || IsBlank(MeEmail) || TooManyLines, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  { ticked: Filter(LineGallery.AllItems, MarkCheck.Checked), result: ResultPick.Selected.Id, note: Trim(NoteText.Text) },
                  IfError(
                      ForAll(
                          ticked As line,
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "review", Ref: CurrentId, CiKey: line.CiKey, CiName: line.CiName, Reason: result, Text: note })
                      );
                      Notify(CountRows(ticked) & If(CountRows(ticked) = 1, " CI marked ", " CIs marked ") & ResultPick.Selected.Label & ". The list shows it now; the report after the next refresh.", NotificationType.Success);
                      Reset(NoteText),
                      Notify("Not saved: " & FirstError.Message, NotificationType.Error)
                  )
              )
            X: =16
            Y: =Parent.Height - 100
            Width: =Parent.Width - 32
            Height: =40
      - SameButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Mark " & CountRows(AgreeingLines) & " same in EPO"
            Appearance: =ButtonAppearance.Outline
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10
            Tooltip: |-
              =If(IsEmpty(AgreeingLines), "No CI left whose status the EPO systems report shows the same.", "Mark at once the CIs whose status EPO shows the same")
            Visible: =Tabs.Selected.Value = "Lifecycle review" && !IsEmpty(CurrentLines)
            DisplayMode: |-
              =If(IsEmpty(AgreeingLines) || IsBlank(MeEmail) || TooManyLines, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  { agreeing: AgreeingLines, note: AgreeNote },
                  IfError(
                      ForAll(
                          agreeing As line,
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "review", Ref: CurrentId, CiKey: line.CiKey, CiName: line.CiName, Reason: "same", Text: note })
                      );
                      Notify(CountRows(agreeing) & " CIs marked Same in EPO. The list shows it now; the report after the next refresh.", NotificationType.Success),
                      Notify("Not saved: " & FirstError.Message, NotificationType.Error)
                  )
              )
            X: =16
            Y: =Parent.Height - 52
            Width: =Parent.Width - 32
            Height: =36
      # ------------------------------------------------------------------ the settings
      - SettingGallery:
          Control: Gallery
          Variant: Vertical
          Properties:
            Items: =Sort(SettingRows, Order)
            TemplateSize: =76
            TemplatePadding: =0
            Visible: =Tabs.Selected.Value = "Settings"
            X: =16
            Y: =124
            Width: =Parent.Width - 32
            Height: =Parent.Height - 124 - 112
          Children:
            - SettingLabel:
                Control: Label
                Properties:
                  Text: =ThisItem.Label
                  Font: =AppFont
                  FontWeight: =FontWeight.Semibold
                  Size: =9.5
                  Color: =ColourInk
                  VerticalAlign: =VerticalAlign.Top
                  X: =0
                  Y: =6
                  Width: =Parent.TemplateWidth - 84
                  Height: =36
            - SettingHelp:
                Control: Label
                Properties:
                  Text: |-
                    =ThisItem.Min & " to " & ThisItem.Max & ", default " & ThisItem.Default & "." & If(ThisItem.Unused <> "", " The saved value " & ThisItem.Unused & " is not used: the default counts.", "")
                  Font: =AppFont
                  Size: =9
                  Color: =If(ThisItem.Unused <> "", ColourRed, ColourMuted)
                  VerticalAlign: =VerticalAlign.Top
                  X: =0
                  Y: =42
                  Width: =Parent.TemplateWidth - 84
                  Height: =32
            - ValueInput:
                Control: ModernTextInput@1.0.0
                Properties:
                  Default: =Text(ThisItem.Current)
                  AccessibleLabel: =ThisItem.Label
                  Appearance: =Appearance.Outline
                  BasePaletteColor: =ColourNavy
                  Font: =AppFont
                  Size: =10
                  Align: =Align.Right
                  # A number Save refuses (D158) shows red.
                  ValidationState: |-
                    =If(IsMatch(Trim(Self.Text), "\d+") && Value(Trim(Self.Text)) >= ThisItem.Min && Value(Trim(Self.Text)) <= ThisItem.Max, ValidationState.None, ValidationState.Error)
                  X: =Parent.TemplateWidth - 76
                  Y: =10
                  Width: =76
                  Height: =32
            - SettingRule:
                Control: Rectangle
                Properties:
                  Fill: =ColourLine
                  X: =0
                  Y: =Parent.TemplateHeight - 1
                  Width: =Parent.TemplateWidth
                  Height: =1
      - SettingsWhy:
          Control: Label
          Properties:
            # Why Save is off: a value that is not a whole number in its range (D158), named by its label.
            Text: |-
              =Concat(
                  Filter(SettingGallery.AllItems As row, !(IsMatch(Trim(row.ValueInput.Text), "\d+") && Value(Trim(row.ValueInput.Text)) >= row.Min && Value(Trim(row.ValueInput.Text)) <= row.Max)) As bad,
                  bad.Label & ": a whole number from " & bad.Min & " to " & bad.Max & ".",
                  " ")
            Font: =AppFont
            Size: =9
            Color: =ColourRed
            Visible: =Tabs.Selected.Value = "Settings"
            X: =16
            Y: =Parent.Height - 108
            Width: =Parent.Width - 32
            Height: =48
      - SaveSettingsButton:
          Control: ModernButton@1.0.0
          Properties:
            Text: ="Save the settings"
            Icon: ="Save"
            Appearance: =ButtonAppearance.Primary
            BasePaletteColor: =ColourNavy
            Font: =AppFont
            Size: =10.5
            FontWeight: =FontWeight.Semibold
            Visible: =Tabs.Selected.Value = "Settings"
            DisplayMode: |-
              =If(!IsBlank(SettingsWhy.Text) || IsBlank(MeEmail), DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =With(
                  {
                      changed: Filter(
                          ForAll(SettingGallery.AllItems As row, { Key: row.Key, Label: row.Label, Before: Text(row.Current), After: Text(Value(Trim(row.ValueInput.Text))) }),
                          After <> Before)
                  },
                  If(
                      IsEmpty(changed),
                      Notify("Nothing changed.", NotificationType.Information),
                      IfError(
                          ForAll(changed As setting, Patch('SACM Settings', Defaults('SACM Settings'), { Title: setting.Key, Value: setting.After }));
                          Patch('SACM Journal', Defaults('SACM Journal'), { Title: Text(GUID()), At: Now(), By: MeEmail, ByName: MeName, EntryType: "settings", Text: "Team settings changed. " & Concat(changed, Label & ": " & Before & " → " & After, "; ") });
                          Notify("Saved. The numbers count in the report after the next refresh.", NotificationType.Success),
                          Notify("Not saved: " & FirstError.Message, NotificationType.Error)
                      )
                  )
              )
            X: =16
            Y: =Parent.Height - 56
            Width: =Parent.Width - 32
            Height: =40
