# The Power BI report's Power Query, run for real on the invented samples (plan §9.2, the job "powerbi-eval"). Microsoft's
# Power Query test tool (PQTest, in the NuGet package Microsoft.PowerQuery.SdkTools) runs only on Windows, so this job
# uses GitHub's own Windows runner, never a self-hosted one (D286).
#   1. tools/powerbi/connector.ts packs every query of the model into a small test connector (SacmEval.mez).
#   2. PQTest runs each table of the model and the unit cases of the reading functions, in Sample mode: no data source.
#   3. tools/powerbi/parity.ts compares the result with the answer key (src/core/ and tests/recorded/), line by line.
#   4. The job "powerbi-time": the refresh time on invented samples at the size of the real reports (tools/powerbi/time.ps1,
#      D283), and the counts at that size against src/core. On a pull request it is the gate: it fails over 120 s in all,
#      or over 60 s for one table. Started by hand, it times the sizes and stages asked for, with no gate.
#   5. The job "powerbi-desktop" (D309): Power BI Desktop itself, installed on the runner, opens the project, refreshes it on
#      the samples and runs the query of every visual of every page (tools/powerbi/desktop.ps1); it fails when Desktop
#      would show a visual broken or empty, a card "(Blank)", a blank line, or a measure or table with an error. Then it
#      takes a picture of every page (tools/powerbi/pictures.ps1, D318) and fails on a page that shows a broken visual or
#      "(Blank)", or takes more than 3 s to draw. The pictures are an artifact of the run. Started by hand with "pictures",
#      the job also commits them to the branch (never to main), because a cloud thread cannot download an artifact:
#      the repository rules fail while the folder pictures/ is in the branch, so it is removed before the merge.
# Only on pull requests that change the report, the check files, the samples, the readers or the answer key.
name: Power BI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - powerbi/**
      - checks/**
      - samples/**
      - src/core/**
      - tests/recorded/**
      - tests/sample-record.ts
      - tools/powerbi/**
      - package-lock.json
      - .github/workflows/powerbi.yml
  workflow_dispatch:
    inputs:
      sizes:
        description: Copies of the samples to time (170 is about 3,200 CIs)
        default: "42,85,170"
      history:
        description: Earlier dates of the CI and Relationship report
        default: "0"
      stages:
        description: Time the stages of the checks too
        type: boolean
        default: true
      cap:
        description: Seconds before a probe is stopped
        default: "240"
      only:
        description: Only the probes whose name matches this regular expression (empty for all)
        default: ""
      jobs:
        description: Which jobs to run (eval, time, desktop; empty for all)
        default: ""
      pictures:
        description: Commit the pictures of the pages to this branch (never main), to review them
        type: boolean
        default: false

permissions:
  contents: read

# A run started by hand is never cancelled by another: each measures its own commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  powerbi-eval:
    if: github.event.pull_request.draft != true && (inputs.jobs == '' || inputs.jobs == null || contains(inputs.jobs, 'eval'))
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      SDK_VERSION: 2.160.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Power Query SDK tools (cached)
        id: sdk
        uses: actions/cache@v4
        with:
          path: .build/pqsdk
          key: pqsdk-${{ env.SDK_VERSION }}
      - name: Download the SDK tools
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.powerquery.sdktools/$env:SDK_VERSION/microsoft.powerquery.sdktools.$env:SDK_VERSION.nupkg" -OutFile .build/pqsdk.zip
          Expand-Archive .build/pqsdk.zip -DestinationPath .build/pqsdk
      - name: Build the test connector
        run: |
          node tools/powerbi/connector.ts .build/powerbi
          Compress-Archive -Path .build/powerbi/SacmEval/SacmEval.pq -DestinationPath .build/powerbi/SacmEval.zip
          Move-Item .build/powerbi/SacmEval.zip .build/powerbi/SacmEval.mez
      - name: Run the queries
        run: |
          $pqtest = ".build/pqsdk/tools/PQTest.exe"
          $mez = ".build/powerbi/SacmEval.mez"
          $queries = Get-ChildItem .build/powerbi/queries -Filter *.pq | Sort-Object Name
          New-Item -ItemType Directory -Force .build/powerbi/results | Out-Null
          # The name of the query is not part of the data source path (connector.ts), so one (anonymous) credential serves
          # every query; a query the store does not know it for gets its own.
          & $pqtest credential-template -e $mez -q $queries[0].FullName -p -ak Anonymous | & $pqtest set-credential -e $mez -q $queries[0].FullName -p | Out-Null
          foreach ($query in $queries) {
            $out = ".build/powerbi/results/$($query.BaseName).json"
            & $pqtest run-test -e $mez -q $query.FullName -p | Out-File -Encoding utf8NoBOM $out
            if (-not (Select-String -Path $out -Pattern '"Status": *"Passed"' -Quiet) -and (Select-String -Path $out -Pattern 'redential' -Quiet)) {
              & $pqtest credential-template -e $mez -q $query.FullName -p -ak Anonymous | & $pqtest set-credential -e $mez -q $query.FullName -p | Out-Null
              & $pqtest run-test -e $mez -q $query.FullName -p | Out-File -Encoding utf8NoBOM $out
            }
            Write-Output "$($query.BaseName): $((Get-Item $out).Length) bytes"
            # A failed query: its error in the log, so the reason is seen without the artifact (invented samples only).
            if (Select-String -Path $out -Pattern '"Status": *"Failed"' -Quiet) { Get-Content $out -TotalCount 40 | Write-Output }
          }
          # Every query failing with "SacmEval.Contents wasn't recognized": the M parses but Power Query refuses the
          # connector. load-check.ps1 says which query stops it.
          if (Select-String -Path ".build/powerbi/results/About.json" -Pattern "SacmEval.Contents' wasn't recognized" -Quiet) { ./tools/powerbi/load-check.ps1 }
          exit 0
      - name: Compare with the answer key
        run: node tools/powerbi/parity.ts .build/powerbi/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerbi-eval
          path: .build/powerbi/results/
          retention-days: 7

  # On a pull request: the gate of D283 (170 copies, the tables only, 90 s per table at most; fails over the budget).
  # Started by hand: the sizes and stages asked for, no gate.
  powerbi-time:
    if: github.event.pull_request.draft != true && (inputs.jobs == '' || inputs.jobs == null || contains(inputs.jobs, 'time'))
    runs-on: windows-latest
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && 90 || 20 }}
    defaults:
      run:
        shell: pwsh
    env:
      SDK_VERSION: 2.160.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Power Query SDK tools (cached)
        id: sdk
        uses: actions/cache@v4
        with:
          path: .build/pqsdk
          key: pqsdk-${{ env.SDK_VERSION }}
      - name: Download the SDK tools
        if: steps.sdk.outputs.cache-hit != 'true'
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.powerquery.sdktools/$env:SDK_VERSION/microsoft.powerquery.sdktools.$env:SDK_VERSION.nupkg" -OutFile .build/pqsdk.zip
          Expand-Archive .build/pqsdk.zip -DestinationPath .build/pqsdk
      - name: Time the refresh at real size
        env:
          SIZES: ${{ inputs.sizes || '170' }}
          HISTORY: ${{ inputs.history || '0' }}
          STAGES: ${{ github.event_name == 'workflow_dispatch' && inputs.stages || false }}
          CAP: ${{ inputs.cap || '90' }}
          GATE: ${{ github.event_name != 'workflow_dispatch' }}
          ONLY: ${{ inputs.only || '' }}
        run: |
          $stages = $env:STAGES -eq "true"
          $gate = $env:GATE -eq "true"
          ./tools/powerbi/time.ps1 -Sizes $env:SIZES -History ([int]$env:HISTORY) -Stages:$stages -Cap ([int]$env:CAP) -Gate:$gate -Only "$env:ONLY"

  # D309: every visual in the engine of Power BI Desktop, as Carlos opens the report (tools/powerbi/desktop.ps1).
  powerbi-desktop:
    if: github.event.pull_request.draft != true && (inputs.jobs == '' || inputs.jobs == null || contains(inputs.jobs, 'desktop'))
    runs-on: windows-latest
    timeout-minutes: 100
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build the runner
        run: dotnet build tools/powerbi/desktop-check -c Release
      - name: PREVIEW ONLY - the reports folder, invented at real size with many people
        run: |
          node tools/powerbi/scaled.ts --write C:\preview-data --history 1
          python tools/preview/people.py C:\preview-data
      - name: Open the report in Power BI Desktop and run every visual
        run: ./tools/powerbi/desktop.ps1 -Out .build/desktop
      - name: What Desktop would show wrong
        continue-on-error: true
        run: node tools/powerbi/desktop.ts judge .build/desktop/results.json .build/desktop/pictures/pictures.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: powerbi-desktop
          path: .build/desktop/
          retention-days: 7

  # D318: the pictures of the Desktop check, committed to the branch in pictures/ for the review, only when the run was
  # started by hand with "pictures" (the repository rules refuse the folder at the merge). A job of its own, so only it
  # can write to the repository.
  powerbi-pictures:
    needs: powerbi-desktop
    if: always() && github.event_name == 'workflow_dispatch' && inputs.pictures && github.ref_name != 'main' && needs.powerbi-desktop.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: powerbi-desktop
          path: .build/desktop
      - name: Commit the pictures to the branch
        run: |
          git config user.name "Desktop check"
          git config user.email "desktop-check@example.com"
          rm -rf pictures && mkdir -p pictures
          cp .build/desktop/pictures/* pictures/ 2>/dev/null || true
          git add -f pictures
          git commit -m "Pictures of the pages from the Desktop check (for review; remove before the merge)" || exit 0
          git push origin "HEAD:${GITHUB_REF_NAME}"
