cess without target criticality (BIA missing)",ok="BIA missing",lk="An Operational Business Process has no CIA values and no tag BIA N/A or BIA is pending. SACM checks the status or the tag.",rk="Criticality starts on the Business Process: its CIA values come from the BIA, and the process becomes Operational after its mapping. A process in Ready without CIA values is not listed: it may wait there. An Operational (or Under retirement) process without CIA values is wrong, unless the tag BIA N/A or BIA is pending says why: SACM checks the status, or adds the tag. Nobody is written to: SACM does not chase the BIA.",ck="criticality",dk="completeness",uk="high",fk={classes:["business_process"],exclude:{operational_status:["retired","ready"]}},mk={type:"rule",when:{op:"levelsMissing",field:"target"}},hk={path:"sacm-fix",audience:["sacm"]},pk={id:sk,status:ak,title:ik,cardLabel:ok,cardHint:lk,cardText:rk,family:ck,dimension:dk,severity:uk,scope:fk,detector:mk,playbook:hk},gk="DESC-QUALITY",yk="proposed",xk="Description is missing or of poor quality",vk="Description",wk="The description is empty, too short, the same as the name, or a placeholder. The owner writes what the CI is and what it is for.",bk="The description is empty, too short, the same as the name, or a placeholder. The owner writes what the CI is and what it is for. On a Business Service or a Service Instance the owner corrects it in EPO. A Business Application is not asked: SACM copies the description of its Service Instance (card Application ≠ Instance).",Sk="description",Nk="completeness",jk="medium",Ck={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},kk={type:"rule",when:{any:[{field:"description",op:"isEmpty"},{field:"description",op:"shorterThan",value:30},{field:"description",op:"equalsField",value:"name"},{field:"description",op:"matchesAny",value:["^tb nce/epo-id"},Uk={path:"sacm-fix",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],askWhenUnsure:"Must be created in EPO: ask the owner",message:{subject:"EPO ID to check",intro:"These CIs have no EPO ID in ServiceNow, or the same EPO ID as another CI, so they cannot be matched with EPO.",ask:"Please check that the system or service exists in EPO, once only. If it is not in EPO, please create it there: ServiceNow receives it from EPO. {Reply} if you have a question.",why:"The EPO ID links the ServiceNow record to EPO. Without it the two cannot be compared."}},Hk={id:_k,status:Ok,title:Ek,cardLabel:Ak,cardHint:Mk,cardText:Rk,family:Dk,dimension:Ik,severity:Lk,scope:zk,detector:Bk,playbook:Uk},Pk="NAME-DUPLICATE",qk="live",Gk="CI name is used twice in one class, or has double spaces",Kk="Duplicate names",Yk="Two live CIs of one class have the same name, or a name has two spaces. SACM looks first: one thing twice, retire one.",Vk='Two live CIs of the same class with the same name, or a name with two spaces in a row. A Retired CI, or a CI of another class, with the same name does not count. SACM looks at each line first. Two records for one thing: SACM retires one, and removes the double space itself. Two real CIs: open the CI and press "Two real CIs: ask the owner": the owner gives each one its own name (in EPO for a Business Service or a Service Instance).',Fk="name",Xk="correctness",Zk="medium",Qk={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},Jk={type:"rule",when:{any:[{op:"duplicatedInClass",field:"name",value:1},{op:"hasDoubleSpaces",field:"name"}]}},Wk={path:"sacm-fix",audience:["managed_by","owned_by","managerOf(owned_by)"],askWhenUnsure:"Two real CIs: ask the owner",routeBy:"epo",message:{subject:"Duplicate name",intro:"Another live CI of the same class has the same name. They are two different CIs.",ask:"Could you give each one a name of its own? {Reply} with the right names, and we will update ServiceNow for you.",why:"A CI is found by its name, so each name must be unique.",epoWhat:"name"}},e2={id:Pk,status:qk,title:Gk,cardLabel:Kk,cardHint:Yk,cardText:Vk,family:Fk,dimension:Xk,severity:Zk,scope:Qk,detector:Jk,playbook:Wk},t2="NAME-FORMAT",n2="proposed",s2="CI name has a wrong dash or a space at its start or end",a2="Name to tidy",i2="Small faults in a name, such as a space at the start or the end. SACM corrects them itself; nobody is asked.",o2='Small faults in a name that SACM corrects itself, nobody is asked: an API offering that does not start with "API - " (for example another dash), and a space at the start or the end of a name.',l2="name",r2="compliance",c2="low",d2={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},u2={type:"code",module:"ci/name-standard",ref:"reference/name-rules",rules:["api-prefix","outer-space"]},f2={path:"sacm-fix",audience:["sacm"]},m2={id:t2,status:n2,title:s2,cardLabel:a2,cardHint:i2,cardText:o2,family:l2,dimension:r2,severity:c2,scope:d2,detector:u2,playbook:f2},h2="NAME-HIDDEN-CHAR",p2="live",g2="CI name holds a hidden character",y2="Hidden character in name",x2="The name holds a character nobody can see, so searching and matching fail. SACM removes it in ServiceNow.",v2='The name holds a character nobody can see, most often a zero-width space. ServiceNow does not show it, but it is in the record, so searching for the name or matching it with another report fails. A CSV export shows it as "?". SACM removes it in ServiceNow; nobody needs to be asked.',w2="name",b2="correctness",S2="low",N2={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},j2={type:"rule",when:{op:"hasHiddenCharacters",field:"name"}},C2={path:"sacm-fix",audience:["sacm"]},k2={id:h2,status:p2,title:g2,cardLabel:y2,cardHint:x2,cardText:v2,family:w2,dimension:b2,severity:S2,scope:N2,detector:j2,playbook:C2},$2="NAME-STANDARD",T2="proposed",_2="CI name does not follow the naming standard",O2="Name not standard",E2="The name does not end as the instruction asks for its class, for example _BS. The owner corrects it in EPO.",A2='The instruction gives each class an ending: a Business Service ends with _BS, a Service Instance with " - PROD" or " - TEST". The owner is asked to correct the name in EPO. The name of a Business Application is on Application ≠ Instance: SACM copies it from its Service Instance.',M2="name",R2="compliance",D2="medium",I2={classes:["business_service","service_instance"],exclude:{operational_status:["retired"]}},L2={type:"code",module:"ci/name-standard",ref:"reference/name-rules",rules:["bs-suffix","si-suffix"]},z2={path:"service-request",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],routeBy:"epo",message:{subject:"Name not standard",intro:"Their name does not follow the SACM naming standard.",ask:"Please correct the name. {Reply} if you need help, or if the name is right as it is.",why:"A standard name lets everybody find the CI and see what it is.",epoWhat:"name"}},B2={id:$2,status:T2,title:_2,cardLabel:O2,cardHint:E2,cardText:A2,family:M2,dimension:R2,severity:D2,scope:I2,detector:L2,playbook:z2},U2="RESP-INACTIVE",H2="live",P2="Responsible person is an inactive user",q2="Inactive person",G2="Owned by or Managed by names a person who is no longer active, so we ask who took over. Supported by has its own card.",K2="responsibility",Y2="correctness",V2="high",F2={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},X2={type:"rule",forEach:["owned_by","managed_by","supported_by"],when:{op:"refInactive"},forEachClasses:{supported_by:[]}},Z2={path:"service-request",audience:["managed_by","otherRoles","managerOf(field)","departmentHeadOf(field)","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"Inactive {who}",intro:"Their {role} is no longer an active user.",ask:"Could you tell us who took over? You can {reply}, or raise the request {request}.",why:"Without an active owner, approvals for these CIs are rejected automatically.",request:"role",askNoRequest:"Could you tell us who took over? Please {reply}, and we will update ServiceNow for you.",askByClass:{service_offering:"Could you tell us who took over? You can {reply}, or raise the request {request:modify-service-offering}."},askByTeam:{"process-management":"Could you tell us who took over? Please {reply} with the name of the person for each process, and we will update ServiceNow."}},routeBy:"epo"},Q2={id:U2,status:H2,title:P2,cardLabel:q2,cardHint:G2,family:K2,dimension:Y2,severity:V2,scope:F2,detector:X2,playbook:Z2},J2="RESP-MISSING",W2="live",e$="Responsible person is missing",t$="Owner or manager missing",n$="Owned by or Managed by is empty: every CI needs an owner and a manager. Supported by has its own card.",s$="responsibility",a$="completeness",i$="high",o$={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},l$={type:"rule",forEach:["owned_by","managed_by","supported_by"],when:{op:"isEmpty"},forEachClasses:{supported_by:[]}},r$={path:"service-request",audience:["managed_by","otherRoles","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"No {who}",intro:"The role {role} is empty.",ask:"Could you tell us who it should be? You can {reply}, or raise the request {request}.",why:"Incidents, changes and approvals for these CIs have nobody to go to.",request:"role",askNoRequest:"Could you tell us who it should be? Please {reply}, and we will update ServiceNow for you.",askByClass:{service_offering:"Could you tell us who it should be? You can {reply}, or raise the request {request:modify-service-offering}."},askByTeam:{"process-management":"Could you tell us who it should be? Please {reply} with the name of the person for each process, and we will update ServiceNow."}},routeBy:"epo"},c$={id:J2,status:W2,title:e$,cardLabel:t$,cardHint:n$,family:s$,dimension:a$,severity:i$,scope:o$,detector:l$,playbook:r$},d$="RESP-SAME-PERSON",u$="proposed",f$="Owned by and Managed by are the same person",m$="Owner = Manager",h$="Owned by and Managed by name the same person. They should be two different people.",p$="responsibility",g$="correctness",y$="medium",x$={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},v$={type:"rule",when:{op:"samePersonAs",field:"owned_by",value:"managed_by"}},w$={path:"service-request",audience:["managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],routeBy:"epo",message:{subject:"Same person as owner and manager",intro:"The same person is Owned by and Managed by.",ask:"Could you name a second person for Managed by? You can reply, or raise the request {request:managed-by-update}.",why:"The two roles approve changes together. One person in both means there is no second check.",epoAsk:"Could you name a second person as Primary Responsible (Managed by) in EPO?",askByTeam:{"process-management":"Could you name a second person for Managed by? Please {reply} with the name for each process, and we will update ServiceNow."}}},b$={id:d$,status:u$,title:f$,cardLabel:m$,cardHint:h$,family:p$,dimension:g$,severity:y$,scope:x$,detector:v$,playbook:w$},S$="SUPPORT-GROUP-INACTIVE",N$="live",j$="Support group of the CI is not active",C$="Support group inactive",k$="The Support group is no longer active, so incidents on the CI reach nobody.",$$="The Service Offering or Service Instance has a Support group, but the group is no longer active, so incidents on the CI reach nobody (procedure 2.5). A CI with no Support group at all is on the card Support group.",T$="support",_$="correctness",O$="high",E$={classes:["service_offering","service_instance"],exclude:{operational_status:["retired"]}},A$={type:"rule",when:{op:"groupInactive",field:"support_group"}},M$={path:"service-request",audience:["managed_by","owned_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"Inactive Support group",intro:"Their Support group is no longer active.",ask:"Please raise the request {request:support-group-update} and name an active group.",askByClass:{service_offering:"Please raise the request {request:modify-service-offering} and name an active group."},why:"Without an active Support group, incidents on these CIs are not assigned to a team."}},R$={id:S$,status:N$,title:j$,cardLabel:C$,cardHint:k$,cardText:$$,family:T$,dimension:_$,severity:O$,scope:E$,detector:A$,playbook:M$},D$="SUPPORT-GROUP-MISSING",I$="live",L$="Service Offering or Service Instance has no support group",z$="Support group",B$="A Service Offering or Service Instance has no Support group, so incidents on it reach nobody.",U$="support",H$="completeness",P$="high",q$={classes:["service_offering","service_instance"],exclude:{operational_status:["retired"]}},G$={type:"rule",when:{op:"isEmpty",field:"support_group"}},K$={path:"service-request",audience:["managed_by","owned_by","supported_by","managerOf(owned_by)"],message:{subject:"No Support group",intro:"These CIs have no Support group.",ask:"Please raise the request {request:support-group-update}. If the group does not exist yet, there is a request to create it.",askByClass:{service_offering:"Please raise the request {request:modify-service-offering}. If the group does not exist yet, there is a request to create it."},why:"Without an active Support group, incidents on these CIs are not assigned to a team."}},Y$={id:D$,status:I$,title:L$,cardLabel:z$,cardHint:B$,family:U$,dimension:H$,severity:P$,scope:q$,detector:G$,playbook:K$},V$="SUPPORTED-BY",F$="live",X$="Supported by is empty or an inactive user",Z$="Supported by",Q$="Supported by is empty, or names a person who is no longer active. The owner or manager names the person.",J$="Supported by is important, but it comes after Owned by and Managed by. On a Service Instance the owner fills it in EPO (Secondary Responsible). On a Service Offering the owner or manager replies, or raises the request to modify the offering. Only these two classes are checked.",W$="responsibility",eT="completeness",tT="medium",nT="later",sT={classes:["service_offering","service_instance"],exclude:{operational_status:["retired"]}},aT={type:"rule",forEach:["supported_by"],when:{any:[{op:"isEmpty"},{op:"refInactive"}]}},iT={path:"service-request",audience:["managed_by","owned_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],routeBy:"epo",message:{subject:"Supported by to fill",intro:"The role Supported by is empty, or names a person who is no longer active.",ask:"Could you tell us who it should be? Please {reply}, and we will update ServiceNow for you.",why:"The support person is the second contact for incidents on these CIs.",askByClass:{service_offering:"Could you tell us who it should be? You can {reply}, or raise the request {request:modify-service-offering}."}}},oT={id:V$,status:F$,title:X$,cardLabel:Z$,cardHint:Q$,cardText:J$,family:W$,dimension:eT,severity:tT,priority:nT,scope:sT,detector:aT,playbook:iT},lT="TAG-INVALID",rT="off",cT="Tag key or value is not allowed",dT="Tag not allowed",uT="tags",fT="compliance",mT="low",hT={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},pT={type:"rule",when:{op:"tagsNotIn",ref:"reference/allowed-tags",field:"tags"}},gT={path:"self-fix",audience:["managed_by","managerOf(owned_by)"],message:{subject:"Tag not allowed",intro:"These CIs carry a tag that is not in the agreed list.",ask:"Could you tell us the right tag for each CI, or confirm that we can remove it?",why:"Reports and rules read the tags, so only the agreed tags can be used."}},yT={id:lT,status:rT,title:cT,cardLabel:dT,family:uT,dimension:fT,severity:mT,scope:hT,detector:pT,playbook:gT},xT="TAG-MISSING",vT="proposed",wT="Mandatory tag is missing",bT="Tag missing",ST="A tag the class must carry is missing (a process: customer facing or internal). SACM sets it, and asks Process Management when it cannot tell.",NT="tags",jT="compliance",CT="medium",kT={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},$T={type:"rule",when:{op:"missingTags",ref:"reference/mandatory-tags",field:"tags"}},TT={path:"sacm-fix",audience:["managed_by","owned_by","managerOf(owned_by)"],askWhenUnsure:"Cannot tell which type: ask Process Management",message:{subject:"Missing tag",intro:"A mandatory tag is missing on these CIs.",ask:"Could you tell us the right value for each CI? We will update ServiceNow for you.",why:"The mandatory tags say what kind of CI it is. Reports and rules depend on them.",askByTeam:{"process-management":"Is each process customer facing or internal? Please {reply}, and we will set the tag in ServiceNow."}}},_T={id:xT,status:vT,title:wT,cardLabel:bT,cardHint:ST,family:NT,dimension:jT,severity:CT,scope:kT,detector:$T,playbook:TT},OT="TAG-STATUS-CONFLICT",ET="proposed",AT="Tagged To be deleted, but still Operational",MT="Deleted but operational",RT="The CI is tagged To be deleted and is still Operational. The owner gives the planned retirement date.",DT="The CI is tagged To be deleted and is still Operational. Some are kept on purpose, for example to keep their data for some years. The owner is asked for the planned retirement date. Write it on the case (Planned retirement date): the CI then waits until that date. Business Applications are not on this card: they are decided in the mapping of their system.",IT="tags",LT="compliance",zT="medium",BT={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},UT={type:"rule",when:{all:[{op:"tagMatchesAny",field:"tags",value:["to be deleted"]},{op:"equals",field:"operational_status",value:"Operational"}]}},HT={path:"self-fix",audience:["owned_by","managed_by","managerOf(owned_by)"],routeBy:"epo",retirementDate:!0,message:{subject:"Tagged for deletion but still Operational",intro:"These CIs are tagged To be deleted, but they are still Operational.",ask:"When will they be retired? Please reply with the planned retirement date of each CI. It is fine to keep a CI for some years, for example to keep its data: we only need the date.",why:"A CI tagged To be deleted needs a planned date: on that date it is retired, so it no longer receives incidents or changes.",epoAsk:"When will they be retired? Please reply with the planned retirement date of each CI, and retire them in EPO on that date. It is fine to keep a CI for some years, for example to keep its data: we only need the date."}},PT={id:OT,status:ET,title:AT,cardLabel:MT,cardHint:RT,cardText:DT,family:IT,dimension:LT,severity:zT,scope:BT,detector:UT,playbook:HT},qT="CONTRACT-PROCUREMENT",GT="live",KT="contracts",YT="contract",VT="correctness",FT="medium",XT={classes:["contract"]},ZT="A problem in Solusi itself: only Procurement can correct it",QT="For Procurement",JT="Problems in Solusi itself, such as no contract owner or a person who left. Only Procurement can correct them: one message to their mailbox.",WT="Problems in Solusi itself: no contract owner, a contract owner or Procurement partner who left (inactive in ServiceNow, and no active account with that name is known), no vendor number, and an EPO ID that is unknown or names a Retired system. Nobody in SACM can correct them, and a correction in ServiceNow is lost at the next upload. One message goes to the Procurement mailbox (its address is in Settings), with one table per problem. After the reminders, the escalation goes to the Procurement lead of Settings. Export this list gives the same tables as a file. Nothing is sent before you press Send.",e_={type:"code",module:"contracts/problems",ref:"reference/contract-reports",rules:["noOwner","ownerLeft","partnerLeft","noVendorNumber","epoRetired","epoUnknown"]},t_={path:"source-fix",audience:["procurement"],message:{subject:"Contracts to correct in Solusi",intro:"These contracts need a correction in Solusi.",ask:"Please correct them in Solusi.",why:"ServiceNow receives the contract data from Solusi with each upload, so these values can only be corrected in Solusi. Please {reply} when it is done, or when a contract is right as it is.",byProblem:{noOwner:{subject:"No contract owner",intro:"These running contracts have no contract owner in Solusi.",ask:"Please add the contract owner in Solusi."},ownerLeft:{subject:"Contract owner left",intro:"The contract owner of these running contracts is no longer an active user in ServiceNow, and we know no active account with that name.",ask:"Please name a new contract owner in Solusi, or tell us if the person is still with the company."},partnerLeft:{subject:"Procurement partner left",intro:"The Procurement partner of these running contracts is no longer an active user in ServiceNow, and we know no active account with that name.",ask:"Please name a new Procurement partner in Solusi, or tell us if the person is still with the company."},noVendorNumber:{subject:"No vendor number",intro:"These contracts have no vendor number in Solusi. The upload finds the vendor by this number, so the vendor stays empty in ServiceNow.",ask:"Please add the vendor number in Solusi."},epoRetired:{subject:"The EPO ID names a Retired system",intro:"These running contracts name a system that is Retired in ServiceNow.",ask:"Please check if the contract still covers a system in use, and correct the EPO ID in Solusi."},epoUnknown:{subject:"The EPO ID is not a known EPO ID",intro:"The EPO ID of these running contracts holds a number that is not the EPO ID of a system in ServiceNow.",ask:"Please check the number, and correct the EPO ID in Solusi."}}}},n_={id:qT,status:GT,family:KT,subject:YT,dimension:VT,severity:FT,scope:XT,title:ZT,cardLabel:QT,cardHint:JT,cardText:WT,detector:e_,playbook:t_},s_="CONTRACT-NOT-IN-SOLUSI",a_="live",i_="A contract in ServiceNow is not in Solusi",o_="Not in Solusi",l_="Contracts in ServiceNow that the Solusi contract file does not hold. SACM deletes them in ServiceNow; the app deletes nothing.",r_='Contracts that ServiceNow holds and the Solusi contract file does not (procedure 2.8). What is not in Solusi does not exist, or should not exist, in ServiceNow: every line is to delete. SACM deletes them in ServiceNow; the app deletes nothing. A note "Still linked" on a line only says what links the contract to the CMDB. If Procurement asks to keep a contract, open it and choose Not followed up, with the reason.',c_="contracts",d_="contract",u_="compliance",f_="medium",m_={classes:["contract"]},h_={type:"code",module:"contracts/not-in-solusi",ref:"reference/contract-reports"},p_={path:"sacm-fix",markWord:"deleted",audience:["sacm"]},g_={id:s_,status:a_,title:i_,cardLabel:o_,cardHint:l_,cardText:r_,family:c_,subject:d_,dimension:u_,severity:f_,scope:m_,detector:h_,playbook:p_},y_="CONTRACT-SN-FIX",x_="live",v_="A contract value SACM corrects in ServiceNow",w_="Contracts to fix in ServiceNow",b_="Contract fields that are wrong in ServiceNow, such as an inactive account with the name of an active person. SACM corrects them itself.",S_='SACM corrects these contracts itself in ServiceNow; no email is needed: a contract owner or Procurement partner for whom the upload picked an inactive account while an active account with the same name exists (the line names the account to set), a person ServiceNow shows differently from Solusi, a fixed-term contract without an end date, and a Concluded contract whose end date has passed. A person who really left is on the card "For Procurement". Mark as fixed when it is done. A line is Verified when a later report no longer shows it.',N_="contracts",j_="contract",C_="correctness",k_="medium",$_={classes:["contract"]},T_={type:"code",module:"contracts/problems",ref:"reference/contract-reports",rules:["ownerInactive","partnerInactive","personName","endPassed","noEnd"]},__={path:"sacm-fix",audience:["sacm"]},O_={id:y_,status:x_,title:v_,cardLabel:w_,cardHint:b_,cardText:S_,family:N_,subject:j_,dimension:C_,severity:k_,scope:$_,detector:T_,playbook:__},E_="CONTRACT-STATUS",A_="proposed",M_="The status tag of a contract does not say what Solusi says",R_="Contract status",D_="The real status from Solusi is kept as a tag, because ServiceNow sets Expired by itself. The list shows the tag to set.",I_='ServiceNow sets "Expired" by itself from the end date, so the real status from Solusi is kept as a tag, for example "S - Concluded" (procedure 2.8, known challenge 4). This list shows the tag to add, change or remove. Contracts terminated in the last 7 days are checked the same way.',L_="contracts",z_="contract",B_="correctness",U_="medium",H_={classes:["contract"]},P_={type:"code",module:"contracts/status",ref:"reference/contract-reports"},q_={path:"sacm-fix",audience:["sacm"]},G_={id:E_,status:A_,title:M_,cardLabel:R_,cardHint:D_,cardText:I_,family:L_,subject:z_,dimension:B_,severity:U_,scope:H_,detector:P_,playbook:q_},K_="CONTRACT-TO-CLEAR",Y_="proposed",V_="A value removed in Solusi is still in ServiceNow",F_="To clear by hand",X_="A value Procurement removed in Solusi stays in ServiceNow, because the import never clears a field. SACM clears it by hand.",Z_="The import from Solusi never clears a field (procedure 2.8, known challenge 2). A value that Procurement removed in Solusi stays in ServiceNow until SACM clears it by hand. An old end date matters most: ServiceNow shows the contract as Expired because of it.",Q_="contracts",J_="contract",W_="correctness",eO="medium",tO={classes:["contract"]},nO={type:"code",module:"contracts/to-clear",ref:"reference/contract-reports"},sO={path:"sacm-fix",audience:["sacm"]},aO={id:K_,status:Y_,title:V_,cardLabel:F_,cardHint:X_,cardText:Z_,family:Q_,subject:J_,dimension:W_,severity:eO,scope:tO,detector:nO,playbook:sO},iO="CONTRACT-UPLOAD",oO="live",lO="contracts",rO="contract",cO="correctness",dO="medium",uO={classes:["contract"]},fO="A field differs between Solusi and ServiceNow after the upload",mO="Upload check",hO="Solusi and ServiceNow differ. First check that the Solusi file was uploaded; if it was, SACM sets the Solusi value itself.",pO="First question: was this Solusi contract file uploaded to ServiceNow? If not, upload it, load a new ServiceNow contract report and look again. If it was, SACM sets the value of Solusi in ServiceNow itself and marks the line as fixed; no incident is raised. A person's name that differs is on Contracts to fix in ServiceNow.",gO={type:"code",module:"contracts/upload-check",ref:"reference/contract-reports"},yO={path:"sacm-fix",audience:["sacm"]},xO={id:iO,status:oO,family:lO,subject:rO,dimension:cO,severity:dO,scope:uO,title:fO,cardLabel:mO,cardHint:hO,cardText:pO,detector:gO,playbook:yO},vO="EPO-DIFF",wO="live",bO="A service mapped CI differs from EPO",SO="EPO ≠ ServiceNow",NO="Service mapped CIs whose status, name, people or description differ from EPO. SACM copies the EPO value into ServiceNow.",jO='Service mapped CIs whose status, name, people or description in ServiceNow are not the same as in EPO (procedure 2.7). The description is compared by letters and digits only: empty in ServiceNow, cut short, or another start. The sync to these CIs is cut, so SACM copies the EPO value into ServiceNow by hand: use the fix list. When the Service Instance changes, change its Business Application too (the card "Application ≠ Instance" shows it at the next report). Never remove the relationships.',CO="epo-report",kO="correctness",$O="medium",TO={classes:["service_instance"]},_O={type:"code",module:"epo/differs",ref:"reference/epo-systems-report"},OO={path:"sacm-fix",audience:["sacm"]},EO={id:vO,status:wO,title:bO,cardLabel:SO,cardHint:NO,cardText:jO,family:CO,dimension:kO,severity:$O,scope:TO,detector:_O,playbook:OO},AO="EPO-NOT-ARRIVED",MO=!0,RO="ServiceNow should follow EPO by itself: listed for a review of the sync",DO="live",IO="EPO change not in ServiceNow (not service mapped)",LO="EPO update not arrived",zO="CIs that should follow EPO by themselves but differ from it: the sync did not bring the change. A list to look at.",BO="CIs that are not service mapped: ServiceNow must follow EPO by itself, so a difference means the sync did not bring the change. Status, name, the three people and the description are compared (the description by letters and digits only). Check a few of them in EPO and in ServiceNow. A change made in EPO less than two days before the report waits: the sync may still bring it. After two days, raise one incident for the pattern with the ServiceNow development team, and keep its number on the cases.",UO="epo-report",HO="correctness",PO="medium",qO={classes:["service_instance"]},GO={type:"code",module:"epo/not-arrived",ref:"reference/epo-systems-report"},KO={path:"source-fix",audience:["sacm"]},YO={id:AO,reviewOnly:MO,reviewWhy:RO,status:DO,title:IO,cardLabel:LO,cardHint:zO,cardText:BO,family:UO,dimension:HO,severity:PO,scope:qO,detector:GO,playbook:KO},VO="LIFECYCLE-REVIEW",FO="proposed",XO="Status in ServiceNow is not the same as in EPO (lifecycle review)",ZO="Lifecycle review",QO="A manager found that the status of a sampled CI is not the same as in EPO. SACM looks at the source first.",JO='From the lifecycle review (Audit, Lifecycle): a manager compared the status of a sampled CI with EPO and marked it Not the same. A service mapped CI: SACM copies the status of EPO into ServiceNow. A CI that is not service mapped should follow EPO by itself: raise an incident with the ServiceNow development team. Only when EPO itself looks wrong, press "EPO itself looks wrong: ask the owner" on the line. A line stays to solve until a later report shows another status for the CI.',WO="lifecycle",eE="compliance",tE="medium",nE={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},sE={type:"manual",module:"review/lifecycle",ref:"reference/lifecycle"},aE={path:"sacm-fix",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"Status differs from EPO",intro:"In our lifecycle review, their status in ServiceNow was not the same as in EPO, and the status in EPO looks wrong to us.",ask:"Which status is right? Please correct it in EPO, or {reply}.",why:"The status decides whether a CI is followed up, and whether incidents and changes can use it."},askWhenUnsure:"EPO itself looks wrong: ask the owner"},iE={id:VO,status:FO,title:XO,cardLabel:ZO,cardHint:QO,cardText:JO,family:WO,dimension:eE,severity:tE,scope:nE,detector:sE,playbook:aE},oE="PROCESS-STAGE",lE="proposed",rE="Business Process in Ready that is mapped: make it Operational",cE="Process stage",dE="A Business Process in Ready has its CIA values and something linked below: SACM makes it Operational.",uE="A Business Process is created in Ready. After the BIA its CIA values are added: that is the sign to map it. To map: nothing is linked below yet, so the process is a case of the Mapping backlog, where SACM plans a mapping session with the process owner. Mapped: a Business Application or Business Service is linked below, so SACM makes the process Operational: that is the line of this card. A process in Ready without CIA values waits for the BIA: it has no line, and nobody is chased. Needs the Relationship report.",fE="lifecycle",mE="compliance",hE="medium",pE={classes:["business_process"],exclude:{operational_status:["retired"]}},gE={type:"code",module:"process/stage",ref:"reference/lifecycle"},yE={path:"sacm-fix",audience:["sacm"]},xE={id:oE,status:lE,title:rE,cardLabel:cE,cardHint:dE,cardText:uE,family:fE,dimension:mE,severity:hE,scope:pE,detector:gE,playbook:yE},vE="READY-TOO-LONG-BC",wE="off",bE="Business Capability is in status Ready for too long",SE="Capability Ready too long",NE="A Business Capability has been in status Ready for too long. SACM makes it Operational itself.",jE="The Business Capability was created more than the number of days in Settings ago (90 at first) and is still in status Ready. SACM makes it Operational itself in ServiceNow; Enterprise Architecture owns the capabilities and only answers questions. Mark as fixed when it is done. A line is Verified when a later report shows it Operational.",CE="lifecycle",kE="compliance",$E="medium",TE={classes:["business_capability"],exclude:{operational_status:["retired"]}},_E={type:"code",module:"ci/status-age",ref:"reference/lifecycle",rules:["ready"]},OE={path:"sacm-fix",audience:["sacm"]},EE={id:vE,status:wE,title:bE,cardLabel:SE,cardHint:NE,cardText:jE,family:CE,dimension:kE,severity:$E,scope:TE,detector:_E,playbook:OE},AE="READY-TOO-LONG",ME="proposed",RE="CI is in status Ready for too long",DE="Ready too long",IE="The CI has been in status Ready for months. Its other problems wait while it is not live, so the owner is asked.",LE="The CI was created more than the number of days in Settings ago (90 at first) and is still in status Ready. A CI in Ready is not live, so its other problems wait. That is right for a new CI, not for one that sits in Ready for months: clarify it with the owner when there is time. Business Processes and Business Applications are not on this card.",zE="lifecycle",BE="compliance",UE="medium",HE="later",PE={classes:["business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},qE={type:"code",module:"ci/status-age",ref:"reference/lifecycle",rules:["ready"]},GE={path:"email",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"In status Ready for a long time",intro:"They are still in status Ready, long after they were created.",ask:"Is it in use? Then the status must be Operational. Is it not needed any more? Then it must be retired. Please make the change, or {reply}.",askByClass:{service_instance:"Is this system in use? Then its status must be Operational. Is it not needed any more? Then it must be retired. Please make the change in EPO, or {reply}."},why:"A CI in Ready is treated as not live: its owner, criticality and relationships are not followed up."}},KE={id:AE,status:ME,title:RE,cardLabel:DE,cardHint:IE,cardText:LE,family:zE,dimension:BE,severity:UE,priority:HE,scope:PE,detector:qE,playbook:GE},YE="UNDER-RETIREMENT-LONG",VE="proposed",FE="CI is Under retirement for too long",XE="Under retirement too long",ZE="The CI has been Under retirement for months without a change. The owner says if and when it is retired.",QE="The CI is in status Under retirement and its record did not change for more than the number of days in Settings (90 at first). The owner is asked if it is still going to be retired, and when. Write the date the owner gives on the case (Planned retirement date): the CI then waits until that date. Clarify it when there is time. Business Applications are not on this card: they follow their Service Instance.",JE="lifecycle",WE="compliance",eA="medium",tA="later",nA={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},sA={type:"code",module:"ci/status-age",ref:"reference/lifecycle",rules:["under-retirement"]},aA={path:"email",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],retirementDate:!0,message:{subject:"Under retirement for a long time",intro:"They are in status Under retirement, and nothing changed on them for a long time.",ask:"Is this CI still going to be retired, and when? Please {reply}. If it is no longer in use, please retire it.",askByClass:{service_instance:"Is this system still going to be retired, and when? Please {reply}. If it is no longer in use, please retire it in EPO."},why:"A CI that stays Under retirement keeps its relationships and its criticality, and nobody knows if it is still used.",askByTeam:{"process-management":"Is this process still going to be retired, and when? Please {reply}. If it is no longer in use, we will retire it in ServiceNow."}}},iA={id:YE,status:VE,title:FE,cardLabel:XE,cardHint:ZE,cardText:QE,family:JE,dimension:WE,severity:eA,priority:tA,scope:nA,detector:sA,playbook:aA},oA="APP-INSTANCE-MATCH",lA="live",rA="Business Application differs from its Service Instance",cA="Application ≠ Instance",dA="A Business Application is a copy of its Service Instance: owners, status, description and name. SACM copies what differs.",uA='A Business Application has the same Owned by, Managed by, Operational status and description as its Service Instance, and its name is the instance name without " - PROD" or " - TEST", plus "_BA" (procedure 2.9). With several instances: the production one whose name it carries. Nobody is asked about the owners, status, description or name of an application: SACM copies the value of the instance in ServiceNow. Use the fix list. When the instance itself is wrong, its own card asks its owner, in EPO.',fA="relationships",mA="correctness",hA="medium",pA={classes:["business_application"],exclude:{operational_status:["retired"]}},gA={type:"code",module:"relationships/application-instance",ref:"reference/relationship-model"},yA={path:"sacm-fix",audience:["sacm"]},xA={id:oA,status:lA,title:rA,cardLabel:cA,cardHint:dA,cardText:uA,family:fA,dimension:mA,severity:hA,scope:pA,detector:gA,playbook:yA},vA="MAPPING",wA="proposed",bA="CI to map with its owner",SA="Mapping backlog",NA="One case per CI to map: SACM invites the owner to a mapping session and moves the case through its stages.",jA="Everything that must be mapped, one case per CI: a Service Instance without a Business Application, a Business Service or Business Application without a Business Process, a Business Application without a Service Instance, a Business Process with nothing below (in Ready only once it has CIA values), and a Business Application tagged To be deleted that is still Operational. SACM invites the owner to a mapping session (no list of questions), maps the CI with the owner in the Service Mapping Workspace and makes the changes in ServiceNow. Set the stage on the case as it moves on. When the owner says the Business Process does not exist, mark it: Tell Process Management writes one message to the team. A case is solved when a later report no longer shows the problem. CIs tagged To Be Mapped, Descoped or Process is missing or unknown are planned (known); CIs in Ready wait.",CA="relationships",kA="compliance",$A="high",TA={classes:["business_process","business_application","business_service","service_instance"],exclude:{operational_status:["retired"]}},_A={type:"code",module:"mapping/backlog",ref:"reference/mapping-backlog"},OA={path:"mapping",audience:["owned_by","managed_by","managerOf(owned_by)"],message:{subject:"Mapping session",intro:"SACM maps every CI of the CMDB to the CIs above and below it. These CIs of yours are not fully mapped yet.",ask:"Could we plan a 30-minute mapping session with you? {Reply} with a time that suits you. There is nothing to prepare: we go through it together.",why:"Without these relationships, criticality cannot flow to the CIs that support your service, and incidents cannot be linked to it.",byProblem:{"no-process":{subject:"No Business Process",intro:"In a mapping session, the owners of these CIs told us that the Business Process they belong to does not exist yet.",ask:"Could you identify the Business Process of each CI, or have it created? {Reply} with the process, and SACM links the CI to it in ServiceNow."}}}},EA={id:vA,status:wA,title:bA,cardLabel:SA,cardHint:NA,cardText:jA,family:CA,dimension:kA,severity:$A,scope:TA,detector:_A,playbook:OA},AA="OFFERING-OWNER",MA="live",RA="Service Offering owner differs from its Business Service owner",DA="Offering owner ≠ Service owner",IA="A Service Offering made by a person has another owner than its Business Service. SACM copies the service owner.",LA="A Service Offering made by a person has the owner of its Business Service (procedure 2.6). Offerings from EPO take their owner from EPO and are not raised. SACM copies the owner of the Business Service onto the offering in ServiceNow: use the fix list. Nobody is asked.",zA="relationships",BA="correctness",UA="medium",HA={classes:["service_offering"],exclude:{operational_status:["retired"]}},PA={type:"code",module:"relationships/offering-owner",ref:"reference/relationship-model"},qA={path:"sacm-fix",audience:["sacm"]},GA={id:AA,status:MA,title:RA,cardLabel:DA,cardHint:IA,cardText:LA,family:zA,dimension:BA,severity:UA,scope:HA,detector:PA,playbook:qA},KA="OFFERING-PARENT",YA="live",VA="Parent field and Business Service relationship of an offering do not match",FA="Offering parent",XA="The Parent field of a Service Offering and its Business Service relationship do not name the same service. SACM fixes it.",ZA="The Parent field of a Service Offering and its Business Service relationship must name the same, single Business Service. SACM fixes it, nobody is asked: use the fix list. When the Parent field names a service and no relationship exists, add the relationship to that service.",QA="relationships",JA="correctness",WA="high",eM={classes:["service_offering"],exclude:{operational_status:["retired"]}},tM={type:"code",module:"relationships/offering-parent",ref:"reference/relationship-model"},nM={path:"sacm-fix",audience:["sacm"]},sM={id:KA,status:YA,title:VA,cardLabel:FA,cardHint:XA,cardText:ZA,family:QA,dimension:JA,severity:WA,scope:eM,detector:tM,playbook:nM},aM="REL-MISSING",iM="live",oM="Mandatory relationship is missing (unmapped CI)",lM="Relationship missing",rM="A CI lacks a relationship the model asks for, such as a Business Service without a Service Offering.",cM="A CI without a relationship the model asks for. On a Business Service and on an offering from EPO the change goes into EPO. A Business Capability needs at least one Business Process or Business Capability below it. One rule is only listed for a review (offering without a Service Instance): it is not agreed yet. What SACM maps with the owner (a Service Instance without a Business Application, a Business Application without a Service Instance or a Business Process, a Business Service without a Business Process, a Business Process with nothing below) is on the Mapping backlog.",dM="relationships",uM="compliance",fM="high",mM={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance"],exclude:{operational_status:["retired"]}},hM={type:"code",module:"relationships/missing",ref:"reference/relationship-model",rules:["bc-below","bp-business-capability","bs-offering","bso-business-service","bso-service-instance"]},pM={path:"self-fix",audience:["owned_by","managed_by","managerOf(owned_by)"],routeBy:"epo",message:{subject:"Relationship missing",intro:"A relationship the CMDB model asks for is missing on these CIs.",ask:"Could you tell us which CI is missing? {Reply} with its name (or EPO ID), and we add the relationship {request:service-mapping}.",several:"As there are several CIs, a 30-minute mapping session may be quicker. Reply with a time that suits you.",why:"Without these relationships, criticality cannot flow to the CIs that support your service, and incidents cannot be linked to it.",epoAsk:"Please add the missing relationship in EPO. If you are not sure which one, reply with the Business Process your system delivers and the systems it depends on (EPO IDs or names).",askByClass:{business_capability:"Which Business Processes or Business Capabilities carry out this capability? {Reply}, and we add the relationships {request:service-mapping}."}}},gM={id:aM,status:iM,title:oM,cardLabel:lM,cardHint:rM,cardText:cM,family:dM,dimension:uM,severity:fM,scope:mM,detector:hM,playbook:pM},yM="REL-ONE-TO-ONE",xM="live",vM="CI has more than the one allowed partner",wM="Too many partners",bM="A CI has more partners than the model allows, such as an offering with two Business Services. SACM fixes the mapping.",SM='An offering has exactly one Business Service; a Service Instance exactly one Business Application; a Business Application one Service Instance per environment. SACM fixes the mapping in ServiceNow: use the fix list. When SACM cannot tell which one is right, open the CI and press "Cannot tell which one is right: ask the owner": the owner is asked.',NM="relationships",jM="compliance",CM="high",kM={classes:["business_application","service_offering","service_instance"],exclude:{operational_status:["retired"]}},$M={type:"code",module:"relationships/too-many",ref:"reference/relationship-model",rules:["bso-business-service","ba-service-instance","si-business-application"]},TM={path:"sacm-fix",audience:["owned_by","managed_by","managerOf(owned_by)"],askWhenUnsure:"Cannot tell which one is right: ask the owner",message:{subject:"Too many related CIs",intro:"These CIs are related to more CIs than the CMDB model allows. The table shows which.",ask:"Which one is right? {Reply}, and SACM removes the other relationships in ServiceNow.",why:"With two parents, criticality and ownership are not clear."}},_M={id:yM,status:xM,title:vM,cardLabel:wM,cardHint:bM,cardText:SM,family:NM,dimension:jM,severity:CM,scope:kM,detector:$M,playbook:TM},OM="REL-RETIRED",EM="off",AM="Relationship to a Retired CI",MM="Relationship to a Retired CI",RM="One end of the relationship is Retired, the other is not (procedure 2.12). SACM removes it in ServiceNow: use the fix list, grouped by the live CI.",DM="relationships",IM="correctness",LM="low",zM={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},BM={type:"code",module:"relationships/retired-end",ref:"reference/relationship-model"},UM={path:"sacm-fix",audience:["sacm"]},HM={id:OM,status:EM,title:AM,cardLabel:MM,cardHint:RM,family:DM,dimension:IM,severity:LM,scope:zM,detector:BM,playbook:UM},PM="REL-TWICE",qM="live",GM="More than one relationship between two CIs",KM="Relationship entered twice",YM="Two CIs are linked more than once. Only one relationship is allowed: SACM keeps the right one and removes the others.",VM="Between two CIs only one relationship is allowed. This lists the same relationship entered more than once, and two CIs linked by relationships of different types or in both directions. SACM keeps the right one and removes the others: use the fix list.",FM="relationships",XM="correctness",ZM="low",QM={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},JM={type:"code",module:"relationships/twice",ref:"reference/relationship-model"},WM={path:"sacm-fix",audience:["sacm"]},e3={id:PM,status:qM,title:GM,cardLabel:KM,cardHint:YM,cardText:VM,family:FM,dimension:XM,severity:ZM,scope:QM,detector:JM,playbook:WM},t3="REL-WRONG-TYPE",n3="live",s3="Relationship type is not allowed between these classes",a3="Wrong relationship type",i3="The relationship has a type the model does not allow between these classes. SACM corrects it in ServiceNow.",o3="SACM corrects these in ServiceNow: use the fix list. A Platform above the Service Instance that uses it is only listed for a review: confirm with the criticality owner before changing production, because criticality flows down.",l3="relationships",r3="compliance",c3="medium",d3={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},u3={type:"code",module:"relationships/wrong-type",ref:"reference/relationship-model"},f3={path:"sacm-fix",audience:["sacm"]},m3={id:t3,status:n3,title:s3,cardLabel:a3,cardHint:i3,cardText:o3,family:l3,dimension:r3,severity:c3,scope:d3,detector:u3,playbook:f3},h3="The two contract files (piece 5C, procedure 2.8): the Solusi contract file (Excel, every Monday; row 1 field names, row 2 labels) and the ServiceNow contract report (ast_contract). They are matched by the Solusi contract number, which ServiceNow keeps in Vendor contract. Procurement owns the data: a wrong value is corrected in Solusi, because the next import writes over ServiceNow. The problems of the contract data ('problems') are split over two cards: For Procurement raises the problems of Solusi itself, Contracts to fix in ServiceNow the ones SACM corrects in ServiceNow ('change' and 'set' are the words of its fix list). An inactive contract owner or Procurement partner: when the loaded reports know an active account with the same name, the upload picked the wrong account and SACM sets the active one ('ownerInactive', 'partnerInactive'); when they know none, the person left and Procurement names a new person in Solusi ('ownerLeft', 'partnerLeft').",p3={columns:{number:["contract_no"],status:["contract_status"],name:["contract_name"],vendor:["partner_name"],vendorNumber:["partner_no"],category:["contract_category"],start:["contract_start"],end:["contract_end"],duration:["map_duration_type"],owner:["clm_contract_owner"],dailyResponsible:["clm_contract_daily_responsible"],procurementPartner:["clm_contract_supporter"],epoId:["clm_contract_epo_id"],terminated:["termination_date"]},labelRow:["contract no.","contract no","contract"],terminatedSheet:"The tab with a termination date column holds the contracts terminated in the last 7 days."},g3={columns:{number:["number"],vendorContract:["vendor_contract"],state:["state"],name:["short_description"],vendor:["vendor"],category:["u_contract_category"],start:["starts"],end:["ends"],owner:["business_owner"],ownerActive:["business_owner.active"],ownerUserId:["business_owner.user_name"],ownerEmail:["business_owner.email"],dailyResponsible:["u_point_of_contact"],procurementPartner:["contract_administrator"],procurementPartnerActive:["contract_administrator.active"],procurementPartnerUserId:["contract_administrator.user_name"],procurementPartnerEmail:["contract_administrator.email"],tags:["sys_tags"],criticality:["u_inherited_confidentiality","u_inherited_integrity","u_inherited_availability","u_inherited_authenticity"]}},y3=[{field:"name",label:"Name",kind:"text"},{field:"vendor",label:"Vendor",kind:"text"},{field:"category",label:"Category",kind:"text"},{field:"start",label:"Start date",kind:"date"},{field:"end",label:"End date",kind:"date"},{field:"owner",label:"Contract owner",kind:"person"},{field:"dailyResponsible",label:"Daily responsible",kind:"person"},{field:"procurementPartner",label:"Procurement partner",kind:"person"}],x3=["Expired"],v3=["Draft"],w3="\\b[ESTN]\\s*-\\s*(Ended|Terminated|Concluded|In negotiation)\\b",b3=["S - Concluded","N - In negotiation"],S3="target\\s*bc\\s*=\\s*[1-4]",N3=["S - Concluded"],j3=["Fixed-term"],C3={classes:["service_instance"],retiredStatuses:["Retired"],minDigits:3},k3=[30,90],$3=[{id:"ownerInactive",label:"Contract owner: an inactive account was picked",change:"Contract owner: set the active account with the same name",set:"the active account"},{id:"partnerInactive",label:"Procurement partner: an inactive account was picked",change:"Procurement partner: set the active account with the same name",set:"the active account"},{id:"noOwner",label:"No contract owner"},{id:"ownerLeft",label:"Contract owner left"},{id:"partnerLeft",label:"Procurement partner left"},{id:"personName",label:"A name ServiceNow does not show the same",change:"set the person Solusi names"},{id:"endPassed",label:"Concluded, but the end date has passed",change:"End date: correct it, or set the status Ended",set:"the right end date, or Ended"},{id:"noEnd",label:"Fixed-term, but no end date",change:"End date: add it, or correct the duration type",set:"the end date"},{id:"noVendorNumber",label:"No vendor number"},{id:"epoRetired",label:"The EPO ID names a Retired system"},{id:"epoUnknown",label:"The EPO ID is not a known EPO ID"}],T3={note:h3,solusi:p3,servicenow:g3,fields:y3,autoStates:x3,draftStates:v3,statusTag:w3,runningStatuses:b3,targetTag:S3,concludedStatuses:N3,fixedTermWords:j3,epo:C3,endsWithinDays:k3,problems:$3},_3="Criticality (CIA-A) flows down from the Business Process (BIA). Each parent passes its values to its children's Inherited fields; the highest value per dimension wins. A relationship 'Excluded for calculation' in the Relationship report passes nothing (D131). ServiceNow copies Inherited to Target after two weeks, unless an exception applies: a CI with Inherited set and Target empty waits 'waitDays' days after the last change of its record (D132).",O3=14,E3={note:_3,waitDays:O3},A3="The EPO ID is the asset tag. 'required': a missing EPO ID is to solve (the known cases of section 3.1 of the instruction are marked Not followed up once, by a manager). 'unique': two live CIs must not share an EPO ID. Service Offerings are ServiceNow records and are not checked (D128). Business Application, Business Process and Business Capability have no EPO ID: not checked.",M3=["business_service","service_instance"],R3=!0,D3={note:A3,required:M3,unique:R3},I3=`Where a fix is made (decisions D122 and D123). On a CI of 'classes' the fix is made in EPO, by the person the check asks, and ServiceNow receives it from EPO. A Service Offering is a ServiceNow record: it comes from EPO only when the EPO integration created it, that is when its Created by is not a person's user ID ('personUserId'); then it is fixed in EPO, on its Business Service. An offering made by a person, and every other class, is fixed in ServiceNow with the request the message names. Without the Created by column, every offering counts as made by a person. The service mapped flag plays no part here: only the card EPO ≠ ServiceNow reads it. On an offering the integration created, only Owned by follows its Business Service in EPO; Managed by, Supported by and the Support group are changed in ServiceNow with the request "Add or modify a Service (CI)", action "Modify service offering" ('inServiceNow': the fields, and the checks whose finding is about one of them; decision D187).`,L3=["business_service","service_instance"],z3={classes:["service_offering"],personUserId:"^[A-Za-z0-9]{3}$",inServiceNow:{fields:["managed_by","supported_by"],checks:["RESP-SAME-PERSON","SUPPORT-GROUP-MISSING","SUPPORT-GROUP-INACTIVE"]}},B3={note:I3,classes:L3,offerings:z3},U3="The EPO systems report (piece 5A): one line per EPO system. How its columns are called, what its status words mean, and how a system matches a CI. A system matches the Service Instance whose Asset tag is its EPO ID. The fix is always made in EPO; a service mapped CI is then updated in ServiceNow by SACM by hand.",H3={epoId:["epoid","epo_id"],name:["systemname","system_name"],description:["systemdescription","system_description"],status:["systemstatus","system_status"],department:["ownerdepartment","owner_department"],owner:["owner"],responsible1:["responsible1","responsible_1"],responsible2:["responsible2","responsible_2"],changed:["ajour_tms","last_change","changed"]},P3={Kørende:"Operational",Nedlagt:"Retired",Konstruktion:"Ready",Udgående:"Under retirement"},q3=["service_instance"],G3=" - PROD",K3=["Retired"],Y3=[{role:"owned_by",column:"owner",label:"Owned by",epoLabel:"System Owner"},{role:"managed_by",column:"responsible1",label:"Managed by",epoLabel:"Primary Responsible"},{role:"supported_by",column:"responsible2",label:"Supported by",epoLabel:"Secondary Responsible"}],V3={note:"The source first: a people line of these checks on a CI that pairs with an EPO system is compared with EPO before anybody is asked. EPO already names another person: the line waits (SACM copies it, or the sync brings it). EPO is wrong or empty too: the owner is asked, and the line says what EPO holds. A leftover (empty in EPO, a person still in ServiceNow) is asked of the owner; when its person is still active, the line is made on the check named in 'leftover'.",checks:["RESP-MISSING","RESP-INACTIVE","SUPPORTED-BY"],samePerson:["RESP-SAME-PERSON"],leftover:{owned_by:"RESP-MISSING",managed_by:"RESP-MISSING",supported_by:"SUPPORTED-BY"},cards:{mapped:"EPO-DIFF",notMapped:"EPO-NOT-ARRIVED"}},F3=2,X3=40,Z3="The two EPO criticality numbers (scale 1 to 5, ServiceNow uses another scale) and the GDPR marks are not compared.",Q3={note:U3,columns:H3,statuses:P3,classes:q3,nameSuffix:G3,retiredStatuses:K3,roles:Y3,sourceFirst:V3,waitDays:F3,descriptionStart:X3,notCompared:Z3},J3="Tags of the team that explain a finding. A finding of a listed check on a CI with one of the tags is listed under Known: not to solve, no message. Remove the tag in ServiceNow and the finding is to solve at the next report. Tags are compared ignoring case and spaces.",W3=[{checks:["CRIT-TARGET-MISSING","CRIT-NONE-REACHES"],tags:["BIA is pending","BIA N/A"],why:"The BIA that gives the values is pending, or does not apply."},{checks:["RESP-SAME-PERSON"],tags:["Owned by is interim managed by"],why:"The manager holds the owner role for a while, on purpose."},{checks:["REL-MISSING","MAPPING"],tags:["To Be Mapped","Descoped","Process is missing or unknown"],why:"Mapping is planned (To Be Mapped, Descoped), or the process is not known yet."}],eR={note:J3,rules:W3},tR="Lifecycle rules (Operational Activities Instruction 2.13). 'rules': a CI sits in a status for more than 'days' days, counted from the day the record was created or last changed, to the date of the report. 'days' is the value proposed; the team sets its own number in Settings ('setting'). 'fix': the line of the fix list when SACM changes the status itself (Business Capabilities in Ready). 'review': the sample of the lifecycle review, drawn only from the classes EPO holds (Business Service, Service Offering, Service Instance), so every CI of the sample can be compared with EPO; drawn once on a button press and saved in data/reviews/ of the team folder.",nR=[{id:"under-retirement",status:"Under retirement",from:"updated",days:90,setting:"underRetirementDays",say:"Status {status}, and the record did not change since {date} ({age} days)"},{id:"ready",status:"Ready",from:"created",days:90,setting:"readyDays",say:"Status {status} since it was created on {date} ({age} days)",fix:{change:"Operational status: make it Operational",set:"Operational"}}],sR={sample:50,classes:["business_service","service_offering","service_instance"],underRetirement:20,underRetirementStatus:"Under retirement",retiredStatuses:["Retired"],results:[{id:"same",label:"Same in EPO"},{id:"different",label:"Not the same"},{id:"not-in-epo",label:"Not in EPO"}],opensCase:["different"]},aR={note:"The stages of a Business Process in Ready (D197). Waits for the BIA: no CIA value (Target) yet, no line, only a note. To map: CIA values and nothing live linked below of the classes in below: no line here, the process is a case of the Mapping backlog (D200), and a note says how many. Mapped: CIA values and something linked below: SACM makes it Operational.",status:"Ready",below:["business_application","business_service"],waits:{one:"1 Business Process in Ready waits for the BIA (no CIA values yet): nothing to do.",many:"{n} Business Processes in Ready wait for the BIA (no CIA values yet): nothing to do."},toMap:{one:"1 Business Process in Ready is to map (CIA values set, nothing linked below): it is on the Mapping backlog.",many:"{n} Business Processes in Ready are to map (CIA values set, nothing linked below): they are on the Mapping backlog."},mapped:{say:"Mapped: the CIA values are set and {below} linked below. Make it Operational",change:"Operational status: make it Operational",current:"Ready, mapped",set:"Operational"}},iR={note:tR,rules:nR,review:sR,processStages:aR},oR=[{label:"process type (customer facing or internal)",oneOf:["Internal process","Internal BP"],endsWith:["facing","facing process"]}],lR={business_process:oR},rR="The mapping backlog (D200): one case per CI that must be mapped, SACM's work with the owner in a mapping session. 'rules' are the rules of reference/relationship-model that make a CI a mapping case; they are not on Relationship missing. A Business Process in 'readyStatus' is a case only when it has CIA values (a Target value): before that it waits for the BIA. 'tagged': a CI of 'classes' with a tag that matches one of 'tags' (a regular expression, ignoring case) and in 'status' is a case too: its future is decided in the session. 'stages': the steps of a case, in order; 'classStages': the steps each class goes through (D201). 'processMissing': the classes whose case can be marked 'The process does not exist' when one of 'rules' is the reason; 'team' is the team of reference/record-teams that is told (D203). 'criticality': the checks whose lines of the same CI are shown in the case (D204).",cR=["si-business-application","bs-business-process","ba-business-process","ba-service-instance","bp-application-or-service"],dR="Ready",uR={id:"tagged-to-delete",classes:["business_application"],tags:["to be deleted"],status:"Operational",say:"Tagged To be deleted and still Operational: decide in the session whether it is retired, or was never a Business Application"},fR=[{id:"to-plan",label:"To plan"},{id:"session-held",label:"Session held"},{id:"classified",label:"Classified"},{id:"application-linked",label:"Application linked"},{id:"process-linked",label:"Process linked"}],mR={service_instance:["to-plan","session-held","classified","application-linked","process-linked"],business_application:["to-plan","session-held","process-linked"],business_service:["to-plan","session-held","process-linked"],business_process:["to-plan","session-held","application-linked"]},hR={business_process:{"application-linked":"Applications linked"}},pR={classes:["business_service","business_application"],rules:["bs-business-process","ba-business-process"],team:"process-management"},gR=["CRIT-ABOVE-PARENT","CRIT-NONE-REACHES"],yR={note:rR,rules:cR,readyStatus:dR,tagged:uR,stages:fR,classStages:mR,stageWords:hR,processMissing:pR,criticality:gR},xR=`The naming rules of the SACM instruction, as data. Patterns are regular expressions; upper and lower case count. 'when': only names that match it are tested. The check packs name the rules they apply (detector.rules). Decision of 11 Nov 2026, to confirm: the instruction writes "API-", but the API offerings in ServiceNow are written "API - " with spaces, so the rule follows the data.`,vR=[{id:"ba-suffix",classes:["business_application"],pattern:"_BA$",say:"The name does not end with _BA"},{id:"bs-suffix",classes:["business_service"],pattern:"_BS$",say:"The name does not end with _BS"},{id:"si-suffix",classes:["service_instance"],pattern:" - (PROD|TEST)$",say:'The name does not end with " - PROD" or " - TEST"'},{id:"api-prefix",classes:["service_offering"],when:"^API\\b",pattern:"^API - ",say:'The name of an API offering does not start with "API - "',set:'Start the name with "API - " (API, space, hyphen, space)'},{id:"outer-space",classes:["*"],noOuterSpaces:!0,say:"The name has a space at its start or its end",set:"Remove the space"}],wR={note:xR,rules:vR},bR="Operational statuses of a CI that is not live yet. A CI is created in Ready and becomes Operational after sign-off; criticality comes after the BIA (Operational Activities Instruction 2.14). Findings on these CIs are listed under Waiting: not to solve, no message. They move to to solve at the first report that shows the CI live.",SR=["Ready"],NR=["NAME-HIDDEN-CHAR","REL-WRONG-TYPE","REL-RETIRED","REL-TWICE","APP-INSTANCE-MATCH","OFFERING-PARENT","OFFERING-OWNER","NAME-FORMAT","READY-TOO-LONG","READY-TOO-LONG-BC","LIFECYCLE-REVIEW","EPO-DIFF","EPO-NOT-ARRIVED","TAG-MISSING","PROCESS-STAGE","MAPPING"],jR="Checks that SACM fixes itself, with no question to anybody, do not wait: they stay to solve on a CI that is not live yet. Ready too long is about the status Ready itself, and the lifecycle review compares the status with EPO: they do not wait either. The EPO checks compare ServiceNow with EPO, which has its own status for a system in construction: they do not wait either. The mapping backlog decides itself (D200): a CI in Ready waits, except a Business Process with CIA values, which is the one to map now.",CR={note:bR,statuses:SR,exceptChecks:NR,exceptNote:jR},kR="Parked classes (decision D179): CIs that are not checked yet. A parked CI stays in the report, so relationships to it count, but no check tests it, it has no line on any card and it is not counted as tested. The first screen, the load message and the verification record show one grey line per rule instead, so nothing is hidden silently. 'statuses': only CIs in these statuses are parked (empty: every status); a Retired CI is never counted. 'one', 'many' ({n} is the number) and 'none' are the words of the line; 'none' empty: no line. 'fields': parts of checks (check:field) that are parked with the rule on every CI. A capability that is Operational or Under retirement is checked as before; its own rules wait for the round with Enterprise Architecture (OPEN-QUESTIONS).",$R=[{id:"capability-ready",classes:["business_capability"],statuses:["Ready"],one:"1 Business Capability in Ready is not checked yet",many:"{n} Business Capabilities in Ready are not checked yet",none:"",fields:["REL-MISSING:bp-business-capability"]},{id:"api-application",classes:["api","application"],one:"1 API or Application CI is not checked yet: the class is not used yet",many:"{n} API or Application CIs are not checked yet: the classes are not used yet",none:"No API or Application CIs in this report"},{id:"technology-management-service",classes:["technology_management_service"],one:"1 Technology Management Service is not checked yet: the class is not used yet",many:"{n} Technology Management Services are not checked yet: the class is not used yet",none:"No Technology Management Service in this report"}],TR={note:kR,rules:$R},_R="Teams that are the contact for the record of a class (D195). A line of one of the 'checks' on a CI of one of the 'classes' goes to the team, never to the people of the CI: one message to every person of the team (Settings, Requests and mailboxes), nobody copied. Process Management is responsible for the record of a Business Process; its mapping is SACM's work with the process owner (Relationship missing), and SACM does not chase the BIA (the criticality cards).",OR=[{id:"process-management",name:"Process Management",classes:["business_process"],checks:["RESP-MISSING","RESP-INACTIVE","RESP-SAME-PERSON","DESC-QUALITY","NAME-DUPLICATE","TAG-MISSING","TAG-STATUS-CONFLICT","UNDER-RETIREMENT-LONG"]}],ER={note:_R,teams:OR},AR="The relationship model of the Service Mapping Workspace (dictionary and mandatory relationships), as data. Relationships are written parent -> child: the parent is the upstream CI. Only the classes the reports hold today; more can be added. Rule ids are the ones of the Workspace, so both projects can be compared. A Service Instance with Platform ticked (u_platform) is the class 'platform'. A relationship counts only when neither end is Retired.",MR=["Retired"],RR={note:"The environment of a Service Instance: its Environment field, else a trailing word of its name ('- TEST'), else production. Synonyms count as one.",suffix:"\\b(prod|production|prd|preprod|pre-prod|pre-production|non-prod|nonprod|non-production|acc|acceptance|uat|test|tst|dev|development|dr|disaster recovery)\\)?\\s*$",aliases:[{pattern:"^(prod|production|prd)$",name:"PROD"},{pattern:"^(preprod|pre-prod|pre-production)$",name:"PREPROD"},{pattern:"^(acc|acceptance)$",name:"ACC"},{pattern:"^(test|tst)$",name:"TEST"},{pattern:"^(dev|development)$",name:"DEV"},{pattern:"^(dr|disaster recovery)$",name:"DR"},{pattern:"^(non-prod|nonprod|non-production)$",name:"NONPROD"}]},DR={descriptions:"poor",descriptionMin:30,descriptionStart:40,instanceSuffix:"\\s+-\\s+(PROD|TEST)$",applicationSuffix:"_BA"},IR=[{parents:["business_capability"],children:["business_capability"],status:"allowed",types:["Provided by::Provides"],note:"Capability hierarchy."},{parents:["business_capability"],children:["business_process"],status:"allowed",types:["Provided by::Provides"],note:"The process carries out the capability."},{parents:["business_capability"],children:["business_application"],status:"unconfirmed",types:["Provided by::Provides"],note:"Type not agreed yet: not checked."},{parents:["business_process"],children:["business_application"],status:"allowed",types:["Provided by::Provides"],note:"A process can use several applications, and the other way round."},{parents:["business_process"],children:["business_service"],status:"allowed",types:["Provided by:
