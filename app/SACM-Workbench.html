cess without target criticality (BIA missing)",rk="BIA missing",ck="An Operational Business Process has no CIA values and no tag BIA N/A or BIA is pending. SACM checks the status or the tag.",dk="Criticality starts on the Business Process: its CIA values come from the BIA, and the process becomes Operational after its mapping. A process in Ready without CIA values is not listed: it may wait there. An Operational (or Under retirement) process without CIA values is wrong, unless the tag BIA N/A or BIA is pending says why: SACM checks the status, or adds the tag. Nobody is written to: SACM does not chase the BIA.",uk="criticality",fk="completeness",mk="high",hk={classes:["business_process"],exclude:{operational_status:["retired","ready"]}},pk={type:"rule",when:{op:"levelsMissing",field:"target"}},gk={path:"sacm-fix",audience:["sacm"]},yk={id:ik,status:ok,title:lk,cardLabel:rk,cardHint:ck,cardText:dk,family:uk,dimension:fk,severity:mk,scope:hk,detector:pk,playbook:gk},xk="DESC-QUALITY",vk="proposed",wk="Description is missing or of poor quality",bk="Description",Sk="The description is empty, too short, the same as the name, or a placeholder. The owner writes what the CI is and what it is for.",Nk="The description is empty, too short, the same as the name, or a placeholder. The owner writes what the CI is and what it is for. On a Business Service or a Service Instance the owner corrects it in EPO. A Business Application is not asked: SACM copies the description of its Service Instance (card Application ≠ Instance).",Ck="description",jk="completeness",kk="medium",$k={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},Tk={type:"rule",when:{any:[{field:"description",op:"isEmpty"},{field:"description",op:"shorterThan",value:30},{field:"description",op:"equalsField",value:"name"},{field:"description",op:"matchesAny",value:["^tb nce/epo-id"},Pk={path:"sacm-fix",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],askWhenUnsure:"Must be created in EPO: ask the owner",message:{subject:"EPO ID to check",intro:"These CIs have no EPO ID in ServiceNow, or the same EPO ID as another CI, so they cannot be matched with EPO.",ask:"Please check that the system or service exists in EPO, once only. If it is not in EPO, please create it there: ServiceNow receives it from EPO. {Reply} if you have a question.",why:"The EPO ID links the ServiceNow record to EPO. Without it the two cannot be compared."}},qk={id:Ek,status:Ak,title:Mk,cardLabel:Rk,cardHint:Dk,cardText:Ik,family:Lk,dimension:zk,severity:Bk,scope:Uk,detector:Hk,playbook:Pk},Gk="NAME-DUPLICATE",Kk="live",Yk="CI name is used twice in one class, or has double spaces",Vk="Duplicate names",Fk="Two live CIs of one class have the same name, or a name has two spaces. SACM looks first: one thing twice, retire one.",Xk='Two live CIs of the same class with the same name, or a name with two spaces in a row. A Retired CI, or a CI of another class, with the same name does not count. SACM looks at each line first. Two records for one thing: SACM retires one, and removes the double space itself. Two real CIs: open the CI and press "Two real CIs: ask the owner": the owner gives each one its own name (in EPO for a Business Service or a Service Instance).',Zk="name",Qk="correctness",Jk="medium",Wk={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},e2={type:"rule",when:{any:[{op:"duplicatedInClass",field:"name",value:1},{op:"hasDoubleSpaces",field:"name"}]}},t2={path:"sacm-fix",audience:["managed_by","owned_by","managerOf(owned_by)"],askWhenUnsure:"Two real CIs: ask the owner",routeBy:"epo",message:{subject:"Duplicate name",intro:"Another live CI of the same class has the same name. They are two different CIs.",ask:"Could you give each one a name of its own? {Reply} with the right names, and we will update ServiceNow for you.",why:"A CI is found by its name, so each name must be unique.",epoWhat:"name"}},n2={id:Gk,status:Kk,title:Yk,cardLabel:Vk,cardHint:Fk,cardText:Xk,family:Zk,dimension:Qk,severity:Jk,scope:Wk,detector:e2,playbook:t2},s2="NAME-FORMAT",a2="proposed",i2="CI name has a wrong dash or a space at its start or end",o2="Name to tidy",l2="Small faults in a name, such as a space at the start or the end. SACM corrects them itself; nobody is asked.",r2='Small faults in a name that SACM corrects itself, nobody is asked: an API offering that does not start with "API - " (for example another dash), and a space at the start or the end of a name.',c2="name",d2="compliance",u2="low",f2={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},m2={type:"code",module:"ci/name-standard",ref:"reference/name-rules",rules:["api-prefix","outer-space"]},h2={path:"sacm-fix",audience:["sacm"]},p2={id:s2,status:a2,title:i2,cardLabel:o2,cardHint:l2,cardText:r2,family:c2,dimension:d2,severity:u2,scope:f2,detector:m2,playbook:h2},g2="NAME-HIDDEN-CHAR",y2="live",x2="CI name holds a hidden character",v2="Hidden character in name",w2="The name holds a character nobody can see, so searching and matching fail. SACM removes it in ServiceNow.",b2='The name holds a character nobody can see, most often a zero-width space. ServiceNow does not show it, but it is in the record, so searching for the name or matching it with another report fails. A CSV export shows it as "?". SACM removes it in ServiceNow; nobody needs to be asked.',S2="name",N2="correctness",C2="low",j2={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},k2={type:"rule",when:{op:"hasHiddenCharacters",field:"name"}},$2={path:"sacm-fix",audience:["sacm"]},T2={id:g2,status:y2,title:x2,cardLabel:v2,cardHint:w2,cardText:b2,family:S2,dimension:N2,severity:C2,scope:j2,detector:k2,playbook:$2},_2="NAME-STANDARD",O2="proposed",E2="CI name does not follow the naming standard",A2="Name not standard",M2="The name does not end as the instruction asks for its class, for example _BS. The owner corrects it in EPO.",R2='The instruction gives each class an ending: a Business Service ends with _BS, a Service Instance with " - PROD" or " - TEST". The owner is asked to correct the name in EPO. The name of a Business Application is on Application ≠ Instance: SACM copies it from its Service Instance.',D2="name",I2="compliance",L2="medium",z2={classes:["business_service","service_instance"],exclude:{operational_status:["retired"]}},B2={type:"code",module:"ci/name-standard",ref:"reference/name-rules",rules:["bs-suffix","si-suffix"]},U2={path:"service-request",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],routeBy:"epo",message:{subject:"Name not standard",intro:"Their name does not follow the SACM naming standard.",ask:"Please correct the name. {Reply} if you need help, or if the name is right as it is.",why:"A standard name lets everybody find the CI and see what it is.",epoWhat:"name"}},H2={id:_2,status:O2,title:E2,cardLabel:A2,cardHint:M2,cardText:R2,family:D2,dimension:I2,severity:L2,scope:z2,detector:B2,playbook:U2},P2="RESP-INACTIVE",q2="live",G2="Responsible person is an inactive user",K2="Inactive person",Y2="Owned by or Managed by names a person who is no longer active, so we ask who took over. Supported by has its own card.",V2="responsibility",F2="correctness",X2="high",Z2={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},Q2={type:"rule",forEach:["owned_by","managed_by","supported_by"],when:{op:"refInactive"},forEachClasses:{supported_by:[]}},J2={path:"service-request",audience:["managed_by","otherRoles","managerOf(field)","departmentHeadOf(field)","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"Inactive {who}",intro:"Their {role} is no longer an active user.",ask:"Could you tell us who took over? You can {reply}, or raise the request {request}.",why:"Without an active owner, approvals for these CIs are rejected automatically.",request:"role",askNoRequest:"Could you tell us who took over? Please {reply}, and we will update ServiceNow for you.",askByClass:{service_offering:"Could you tell us who took over? You can {reply}, or raise the request {request:modify-service-offering}."},askByTeam:{"process-management":"Could you tell us who took over? Please {reply} with the name of the person for each process, and we will update ServiceNow."}},routeBy:"epo"},W2={id:P2,status:q2,title:G2,cardLabel:K2,cardHint:Y2,family:V2,dimension:F2,severity:X2,scope:Z2,detector:Q2,playbook:J2},e$="RESP-MISSING",t$="live",n$="Responsible person is missing",s$="Owner or manager missing",a$="Owned by or Managed by is empty: every CI needs an owner and a manager. Supported by has its own card.",i$="responsibility",o$="completeness",l$="high",r$={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},c$={type:"rule",forEach:["owned_by","managed_by","supported_by"],when:{op:"isEmpty"},forEachClasses:{supported_by:[]}},d$={path:"service-request",audience:["managed_by","otherRoles","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"No {who}",intro:"The role {role} is empty.",ask:"Could you tell us who it should be? You can {reply}, or raise the request {request}.",why:"Incidents, changes and approvals for these CIs have nobody to go to.",request:"role",askNoRequest:"Could you tell us who it should be? Please {reply}, and we will update ServiceNow for you.",askByClass:{service_offering:"Could you tell us who it should be? You can {reply}, or raise the request {request:modify-service-offering}."},askByTeam:{"process-management":"Could you tell us who it should be? Please {reply} with the name of the person for each process, and we will update ServiceNow."}},routeBy:"epo"},u$={id:e$,status:t$,title:n$,cardLabel:s$,cardHint:a$,family:i$,dimension:o$,severity:l$,scope:r$,detector:c$,playbook:d$},f$="RESP-SAME-PERSON",m$="proposed",h$="Owned by and Managed by are the same person",p$="Owner = Manager",g$="Owned by and Managed by name the same person. They should be two different people.",y$="responsibility",x$="correctness",v$="medium",w$={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},b$={type:"rule",when:{op:"samePersonAs",field:"owned_by",value:"managed_by"}},S$={path:"service-request",audience:["managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],routeBy:"epo",message:{subject:"Same person as owner and manager",intro:"The same person is Owned by and Managed by.",ask:"Could you name a second person for Managed by? You can reply, or raise the request {request:managed-by-update}.",why:"The two roles approve changes together. One person in both means there is no second check.",epoAsk:"Could you name a second person as Primary Responsible (Managed by) in EPO?",askByTeam:{"process-management":"Could you name a second person for Managed by? Please {reply} with the name for each process, and we will update ServiceNow."}}},N$={id:f$,status:m$,title:h$,cardLabel:p$,cardHint:g$,family:y$,dimension:x$,severity:v$,scope:w$,detector:b$,playbook:S$},C$="SUPPORT-GROUP-INACTIVE",j$="live",k$="Support group of the CI is not active",$$="Support group inactive",T$="The Support group is no longer active, so incidents on the CI reach nobody.",_$="The Service Offering or Service Instance has a Support group, but the group is no longer active, so incidents on the CI reach nobody (procedure 2.5). A CI with no Support group at all is on the card Support group.",O$="support",E$="correctness",A$="high",M$={classes:["service_offering","service_instance"],exclude:{operational_status:["retired"]}},R$={type:"rule",when:{op:"groupInactive",field:"support_group"}},D$={path:"service-request",audience:["managed_by","owned_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"Inactive Support group",intro:"Their Support group is no longer active.",ask:"Please raise the request {request:support-group-update} and name an active group.",askByClass:{service_offering:"Please raise the request {request:modify-service-offering} and name an active group."},why:"Without an active Support group, incidents on these CIs are not assigned to a team."}},I$={id:C$,status:j$,title:k$,cardLabel:$$,cardHint:T$,cardText:_$,family:O$,dimension:E$,severity:A$,scope:M$,detector:R$,playbook:D$},L$="SUPPORT-GROUP-MISSING",z$="live",B$="Service Offering or Service Instance has no support group",U$="Support group",H$="A Service Offering or Service Instance has no Support group, so incidents on it reach nobody.",P$="support",q$="completeness",G$="high",K$={classes:["service_offering","service_instance"],exclude:{operational_status:["retired"]}},Y$={type:"rule",when:{op:"isEmpty",field:"support_group"}},V$={path:"service-request",audience:["managed_by","owned_by","supported_by","managerOf(owned_by)"],message:{subject:"No Support group",intro:"These CIs have no Support group.",ask:"Please raise the request {request:support-group-update}. If the group does not exist yet, there is a request to create it.",askByClass:{service_offering:"Please raise the request {request:modify-service-offering}. If the group does not exist yet, there is a request to create it."},why:"Without an active Support group, incidents on these CIs are not assigned to a team."}},F$={id:L$,status:z$,title:B$,cardLabel:U$,cardHint:H$,family:P$,dimension:q$,severity:G$,scope:K$,detector:Y$,playbook:V$},X$="SUPPORTED-BY",Z$="live",Q$="Supported by is empty or an inactive user",J$="Supported by",W$="Supported by is empty, or names a person who is no longer active. The owner or manager names the person.",eT="Supported by is important, but it comes after Owned by and Managed by. On a Service Instance the owner fills it in EPO (Secondary Responsible). On a Service Offering the owner or manager replies, or raises the request to modify the offering. Only these two classes are checked.",tT="responsibility",nT="completeness",sT="medium",aT="later",iT={classes:["service_offering","service_instance"],exclude:{operational_status:["retired"]}},oT={type:"rule",forEach:["supported_by"],when:{any:[{op:"isEmpty"},{op:"refInactive"}]}},lT={path:"service-request",audience:["managed_by","owned_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],routeBy:"epo",message:{subject:"Supported by to fill",intro:"The role Supported by is empty, or names a person who is no longer active.",ask:"Could you tell us who it should be? Please {reply}, and we will update ServiceNow for you.",why:"The support person is the second contact for incidents on these CIs.",askByClass:{service_offering:"Could you tell us who it should be? You can {reply}, or raise the request {request:modify-service-offering}."}}},rT={id:X$,status:Z$,title:Q$,cardLabel:J$,cardHint:W$,cardText:eT,family:tT,dimension:nT,severity:sT,priority:aT,scope:iT,detector:oT,playbook:lT},cT="TAG-INVALID",dT="off",uT="Tag key or value is not allowed",fT="Tag not allowed",mT="tags",hT="compliance",pT="low",gT={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},yT={type:"rule",when:{op:"tagsNotIn",ref:"reference/allowed-tags",field:"tags"}},xT={path:"self-fix",audience:["managed_by","managerOf(owned_by)"],message:{subject:"Tag not allowed",intro:"These CIs carry a tag that is not in the agreed list.",ask:"Could you tell us the right tag for each CI, or confirm that we can remove it?",why:"Reports and rules read the tags, so only the agreed tags can be used."}},vT={id:cT,status:dT,title:uT,cardLabel:fT,family:mT,dimension:hT,severity:pT,scope:gT,detector:yT,playbook:xT},wT="TAG-MISSING",bT="proposed",ST="Mandatory tag is missing",NT="Tag missing",CT="A tag the class must carry is missing (a process: customer facing or internal). SACM sets it, and asks Process Management when it cannot tell.",jT="tags",kT="compliance",$T="medium",TT={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},_T={type:"rule",when:{op:"missingTags",ref:"reference/mandatory-tags",field:"tags"}},OT={path:"sacm-fix",audience:["managed_by","owned_by","managerOf(owned_by)"],askWhenUnsure:"Cannot tell which type: ask Process Management",message:{subject:"Missing tag",intro:"A mandatory tag is missing on these CIs.",ask:"Could you tell us the right value for each CI? We will update ServiceNow for you.",why:"The mandatory tags say what kind of CI it is. Reports and rules depend on them.",askByTeam:{"process-management":"Is each process customer facing or internal? Please {reply}, and we will set the tag in ServiceNow."}}},ET={id:wT,status:bT,title:ST,cardLabel:NT,cardHint:CT,family:jT,dimension:kT,severity:$T,scope:TT,detector:_T,playbook:OT},AT="TAG-STATUS-CONFLICT",MT="proposed",RT="Tagged To be deleted, but still Operational",DT="Deleted but operational",IT="The CI is tagged To be deleted and is still Operational. The owner gives the planned retirement date.",LT="The CI is tagged To be deleted and is still Operational. Some are kept on purpose, for example to keep their data for some years. The owner is asked for the planned retirement date. Write it on the case (Planned retirement date): the CI then waits until that date. Business Applications are not on this card: they are decided in the mapping of their system.",zT="tags",BT="compliance",UT="medium",HT={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},PT={type:"rule",when:{all:[{op:"tagMatchesAny",field:"tags",value:["to be deleted"]},{op:"equals",field:"operational_status",value:"Operational"}]}},qT={path:"self-fix",audience:["owned_by","managed_by","managerOf(owned_by)"],routeBy:"epo",retirementDate:!0,message:{subject:"Tagged for deletion but still Operational",intro:"These CIs are tagged To be deleted, but they are still Operational.",ask:"When will they be retired? Please reply with the planned retirement date of each CI. It is fine to keep a CI for some years, for example to keep its data: we only need the date.",why:"A CI tagged To be deleted needs a planned date: on that date it is retired, so it no longer receives incidents or changes.",epoAsk:"When will they be retired? Please reply with the planned retirement date of each CI, and retire them in EPO on that date. It is fine to keep a CI for some years, for example to keep its data: we only need the date."}},GT={id:AT,status:MT,title:RT,cardLabel:DT,cardHint:IT,cardText:LT,family:zT,dimension:BT,severity:UT,scope:HT,detector:PT,playbook:qT},KT="CONTRACT-PROCUREMENT",YT="live",VT="contracts",FT="contract",XT="correctness",ZT="medium",QT={classes:["contract"]},JT="A problem in Solusi itself: only Procurement can correct it",WT="For Procurement",e_="Problems in Solusi itself, such as no contract owner or a person who left. Only Procurement can correct them: one message to their mailbox.",t_="Problems in Solusi itself: no contract owner, a contract owner or Procurement partner who left (inactive in ServiceNow, and no active account with that name is known), no vendor number, and an EPO ID that is unknown or names a Retired system. Nobody in SACM can correct them, and a correction in ServiceNow is lost at the next upload. One message goes to the Procurement mailbox (its address is in Settings), with one table per problem. After the reminders, the escalation goes to the Procurement lead of Settings. Export this list gives the same tables as a file. Nothing is sent before you press Send.",n_={type:"code",module:"contracts/problems",ref:"reference/contract-reports",rules:["noOwner","ownerLeft","partnerLeft","noVendorNumber","epoRetired","epoUnknown"]},s_={path:"source-fix",audience:["procurement"],message:{subject:"Contracts to correct in Solusi",intro:"These contracts need a correction in Solusi.",ask:"Please correct them in Solusi.",why:"ServiceNow receives the contract data from Solusi with each upload, so these values can only be corrected in Solusi. Please {reply} when it is done, or when a contract is right as it is.",byProblem:{noOwner:{subject:"No contract owner",intro:"These running contracts have no contract owner in Solusi.",ask:"Please add the contract owner in Solusi."},ownerLeft:{subject:"Contract owner left",intro:"The contract owner of these running contracts is no longer an active user in ServiceNow, and we know no active account with that name.",ask:"Please name a new contract owner in Solusi, or tell us if the person is still with the company."},partnerLeft:{subject:"Procurement partner left",intro:"The Procurement partner of these running contracts is no longer an active user in ServiceNow, and we know no active account with that name.",ask:"Please name a new Procurement partner in Solusi, or tell us if the person is still with the company."},noVendorNumber:{subject:"No vendor number",intro:"These contracts have no vendor number in Solusi. The upload finds the vendor by this number, so the vendor stays empty in ServiceNow.",ask:"Please add the vendor number in Solusi."},epoRetired:{subject:"The EPO ID names a Retired system",intro:"These running contracts name a system that is Retired in ServiceNow.",ask:"Please check if the contract still covers a system in use, and correct the EPO ID in Solusi."},epoUnknown:{subject:"The EPO ID is not a known EPO ID",intro:"The EPO ID of these running contracts holds a number that is not the EPO ID of a system in ServiceNow.",ask:"Please check the number, and correct the EPO ID in Solusi."}}}},a_={id:KT,status:YT,family:VT,subject:FT,dimension:XT,severity:ZT,scope:QT,title:JT,cardLabel:WT,cardHint:e_,cardText:t_,detector:n_,playbook:s_},i_="CONTRACT-NOT-IN-SOLUSI",o_="live",l_="A contract in ServiceNow is not in Solusi",r_="Not in Solusi",c_="Contracts in ServiceNow that the Solusi contract file does not hold. SACM deletes them in ServiceNow; the app deletes nothing.",d_='Contracts that ServiceNow holds and the Solusi contract file does not (procedure 2.8). What is not in Solusi does not exist, or should not exist, in ServiceNow: every line is to delete. SACM deletes them in ServiceNow; the app deletes nothing. A note "Still linked" on a line only says what links the contract to the CMDB. If Procurement asks to keep a contract, open it and choose Not followed up, with the reason.',u_="contracts",f_="contract",m_="compliance",h_="medium",p_={classes:["contract"]},g_={type:"code",module:"contracts/not-in-solusi",ref:"reference/contract-reports"},y_={path:"sacm-fix",markWord:"deleted",audience:["sacm"]},x_={id:i_,status:o_,title:l_,cardLabel:r_,cardHint:c_,cardText:d_,family:u_,subject:f_,dimension:m_,severity:h_,scope:p_,detector:g_,playbook:y_},v_="CONTRACT-SN-FIX",w_="live",b_="A contract value SACM corrects in ServiceNow",S_="Contracts to fix in ServiceNow",N_="Contract fields that are wrong in ServiceNow, such as an inactive account with the name of an active person. SACM corrects them itself.",C_='SACM corrects these contracts itself in ServiceNow; no email is needed: a contract owner or Procurement partner for whom the upload picked an inactive account while an active account with the same name exists (the line names the account to set), a person ServiceNow shows differently from Solusi, a fixed-term contract without an end date, and a Concluded contract whose end date has passed. A person who really left is on the card "For Procurement". Mark as fixed when it is done. A line is Verified when a later report no longer shows it.',j_="contracts",k_="contract",$_="correctness",T_="medium",__={classes:["contract"]},O_={type:"code",module:"contracts/problems",ref:"reference/contract-reports",rules:["ownerInactive","partnerInactive","personName","endPassed","noEnd"]},E_={path:"sacm-fix",audience:["sacm"]},A_={id:v_,status:w_,title:b_,cardLabel:S_,cardHint:N_,cardText:C_,family:j_,subject:k_,dimension:$_,severity:T_,scope:__,detector:O_,playbook:E_},M_="CONTRACT-STATUS",R_="proposed",D_="The status tag of a contract does not say what Solusi says",I_="Contract status",L_="The real status from Solusi is kept as a tag, because ServiceNow sets Expired by itself. The list shows the tag to set.",z_='ServiceNow sets "Expired" by itself from the end date, so the real status from Solusi is kept as a tag, for example "S - Concluded" (procedure 2.8, known challenge 4). This list shows the tag to add, change or remove. Contracts terminated in the last 7 days are checked the same way.',B_="contracts",U_="contract",H_="correctness",P_="medium",q_={classes:["contract"]},G_={type:"code",module:"contracts/status",ref:"reference/contract-reports"},K_={path:"sacm-fix",audience:["sacm"]},Y_={id:M_,status:R_,title:D_,cardLabel:I_,cardHint:L_,cardText:z_,family:B_,subject:U_,dimension:H_,severity:P_,scope:q_,detector:G_,playbook:K_},V_="CONTRACT-TO-CLEAR",F_="proposed",X_="A value removed in Solusi is still in ServiceNow",Z_="To clear by hand",Q_="A value Procurement removed in Solusi stays in ServiceNow, because the import never clears a field. SACM clears it by hand.",J_="The import from Solusi never clears a field (procedure 2.8, known challenge 2). A value that Procurement removed in Solusi stays in ServiceNow until SACM clears it by hand. An old end date matters most: ServiceNow shows the contract as Expired because of it.",W_="contracts",eO="contract",tO="correctness",nO="medium",sO={classes:["contract"]},aO={type:"code",module:"contracts/to-clear",ref:"reference/contract-reports"},iO={path:"sacm-fix",audience:["sacm"]},oO={id:V_,status:F_,title:X_,cardLabel:Z_,cardHint:Q_,cardText:J_,family:W_,subject:eO,dimension:tO,severity:nO,scope:sO,detector:aO,playbook:iO},lO="CONTRACT-UPLOAD",rO="live",cO="contracts",dO="contract",uO="correctness",fO="medium",mO={classes:["contract"]},hO="A field differs between Solusi and ServiceNow after the upload",pO="Upload check",gO="Solusi and ServiceNow differ. First check that the Solusi file was uploaded; if it was, SACM sets the Solusi value itself.",yO="First question: was this Solusi contract file uploaded to ServiceNow? If not, upload it, load a new ServiceNow contract report and look again. If it was, SACM sets the value of Solusi in ServiceNow itself and marks the line as fixed; no incident is raised. A person's name that differs is on Contracts to fix in ServiceNow.",xO={type:"code",module:"contracts/upload-check",ref:"reference/contract-reports"},vO={path:"sacm-fix",audience:["sacm"]},wO={id:lO,status:rO,family:cO,subject:dO,dimension:uO,severity:fO,scope:mO,title:hO,cardLabel:pO,cardHint:gO,cardText:yO,detector:xO,playbook:vO},bO="EPO-DIFF",SO="live",NO="A service mapped CI differs from EPO",CO="EPO ≠ ServiceNow",jO="Service mapped CIs whose status, name, people or description differ from EPO. SACM copies the EPO value into ServiceNow.",kO='Service mapped CIs whose status, name, people or description in ServiceNow are not the same as in EPO (procedure 2.7). The description is compared by letters and digits only: empty in ServiceNow, cut short, or another start. The sync to these CIs is cut, so SACM copies the EPO value into ServiceNow by hand: use the fix list. When the Service Instance changes, change its Business Application too (the card "Application ≠ Instance" shows it at the next report). Never remove the relationships.',$O="epo-report",TO="correctness",_O="medium",OO={classes:["service_instance"]},EO={type:"code",module:"epo/differs",ref:"reference/epo-systems-report"},AO={path:"sacm-fix",audience:["sacm"]},MO={id:bO,status:SO,title:NO,cardLabel:CO,cardHint:jO,cardText:kO,family:$O,dimension:TO,severity:_O,scope:OO,detector:EO,playbook:AO},RO="EPO-NOT-ARRIVED",DO=!0,IO="ServiceNow should follow EPO by itself: listed for a review of the sync",LO="live",zO="EPO change not in ServiceNow (not service mapped)",BO="EPO update not arrived",UO="CIs that should follow EPO by themselves but differ from it: the sync did not bring the change. A list to look at.",HO="CIs that are not service mapped: ServiceNow must follow EPO by itself, so a difference means the sync did not bring the change. Status, name, the three people and the description are compared (the description by letters and digits only). Check a few of them in EPO and in ServiceNow. A change made in EPO less than two days before the report waits: the sync may still bring it. After two days, raise one incident for the pattern with the ServiceNow development team, and keep its number on the cases.",PO="epo-report",qO="correctness",GO="medium",KO={classes:["service_instance"]},YO={type:"code",module:"epo/not-arrived",ref:"reference/epo-systems-report"},VO={path:"source-fix",audience:["sacm"]},FO={id:RO,reviewOnly:DO,reviewWhy:IO,status:LO,title:zO,cardLabel:BO,cardHint:UO,cardText:HO,family:PO,dimension:qO,severity:GO,scope:KO,detector:YO,playbook:VO},XO="LIFECYCLE-REVIEW",ZO="proposed",QO="Status in ServiceNow is not the same as in EPO (lifecycle review)",JO="Lifecycle review",WO="A manager found that the status of a sampled CI is not the same as in EPO. SACM looks at the source first.",eE='From the lifecycle review (Audit, Lifecycle): a manager compared the status of a sampled CI with EPO and marked it Not the same. A service mapped CI: SACM copies the status of EPO into ServiceNow. A CI that is not service mapped should follow EPO by itself: raise an incident with the ServiceNow development team. Only when EPO itself looks wrong, press "EPO itself looks wrong: ask the owner" on the line. A line stays to solve until a later report shows another status for the CI.',tE="lifecycle",nE="compliance",sE="medium",aE={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},iE={type:"manual",module:"review/lifecycle",ref:"reference/lifecycle"},oE={path:"sacm-fix",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"Status differs from EPO",intro:"In our lifecycle review, their status in ServiceNow was not the same as in EPO, and the status in EPO looks wrong to us.",ask:"Which status is right? Please correct it in EPO, or {reply}.",why:"The status decides whether a CI is followed up, and whether incidents and changes can use it."},askWhenUnsure:"EPO itself looks wrong: ask the owner"},lE={id:XO,status:ZO,title:QO,cardLabel:JO,cardHint:WO,cardText:eE,family:tE,dimension:nE,severity:sE,scope:aE,detector:iE,playbook:oE},rE="PROCESS-STAGE",cE="proposed",dE="Business Process in Ready that is mapped: make it Operational",uE="Process stage",fE="A Business Process in Ready has its CIA values and something linked below: SACM makes it Operational.",mE="A Business Process is created in Ready. After the BIA its CIA values are added: that is the sign to map it. To map: nothing is linked below yet, so the process is a case of the Mapping backlog, where SACM plans a mapping session with the process owner. Mapped: a Business Application or Business Service is linked below, so SACM makes the process Operational: that is the line of this card. A process in Ready without CIA values waits for the BIA: it has no line, and nobody is chased. Needs the Relationship report.",hE="lifecycle",pE="compliance",gE="medium",yE={classes:["business_process"],exclude:{operational_status:["retired"]}},xE={type:"code",module:"process/stage",ref:"reference/lifecycle"},vE={path:"sacm-fix",audience:["sacm"]},wE={id:rE,status:cE,title:dE,cardLabel:uE,cardHint:fE,cardText:mE,family:hE,dimension:pE,severity:gE,scope:yE,detector:xE,playbook:vE},bE="READY-TOO-LONG-BC",SE="off",NE="Business Capability is in status Ready for too long",CE="Capability Ready too long",jE="A Business Capability has been in status Ready for too long. SACM makes it Operational itself.",kE="The Business Capability was created more than the number of days in Settings ago (90 at first) and is still in status Ready. SACM makes it Operational itself in ServiceNow; Enterprise Architecture owns the capabilities and only answers questions. Mark as fixed when it is done. A line is Verified when a later report shows it Operational.",$E="lifecycle",TE="compliance",_E="medium",OE={classes:["business_capability"],exclude:{operational_status:["retired"]}},EE={type:"code",module:"ci/status-age",ref:"reference/lifecycle",rules:["ready"]},AE={path:"sacm-fix",audience:["sacm"]},ME={id:bE,status:SE,title:NE,cardLabel:CE,cardHint:jE,cardText:kE,family:$E,dimension:TE,severity:_E,scope:OE,detector:EE,playbook:AE},RE="READY-TOO-LONG",DE="proposed",IE="CI is in status Ready for too long",LE="Ready too long",zE="The CI has been in status Ready for months. Its other problems wait while it is not live, so the owner is asked.",BE="The CI was created more than the number of days in Settings ago (90 at first) and is still in status Ready. A CI in Ready is not live, so its other problems wait. That is right for a new CI, not for one that sits in Ready for months: clarify it with the owner when there is time. Business Processes and Business Applications are not on this card.",UE="lifecycle",HE="compliance",PE="medium",qE="later",GE={classes:["business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},KE={type:"code",module:"ci/status-age",ref:"reference/lifecycle",rules:["ready"]},YE={path:"email",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],message:{subject:"In status Ready for a long time",intro:"They are still in status Ready, long after they were created.",ask:"Is it in use? Then the status must be Operational. Is it not needed any more? Then it must be retired. Please make the change, or {reply}.",askByClass:{service_instance:"Is this system in use? Then its status must be Operational. Is it not needed any more? Then it must be retired. Please make the change in EPO, or {reply}."},why:"A CI in Ready is treated as not live: its owner, criticality and relationships are not followed up."}},VE={id:RE,status:DE,title:IE,cardLabel:LE,cardHint:zE,cardText:BE,family:UE,dimension:HE,severity:PE,priority:qE,scope:GE,detector:KE,playbook:YE},FE="UNDER-RETIREMENT-LONG",XE="proposed",ZE="CI is Under retirement for too long",QE="Under retirement too long",JE="The CI has been Under retirement for months without a change. The owner says if and when it is retired.",WE="The CI is in status Under retirement and its record did not change for more than the number of days in Settings (90 at first). The owner is asked if it is still going to be retired, and when. Write the date the owner gives on the case (Planned retirement date): the CI then waits until that date. Clarify it when there is time. Business Applications are not on this card: they follow their Service Instance.",eA="lifecycle",tA="compliance",nA="medium",sA="later",aA={classes:["business_capability","business_process","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},iA={type:"code",module:"ci/status-age",ref:"reference/lifecycle",rules:["under-retirement"]},oA={path:"email",audience:["owned_by","managed_by","managerOf(owned_by)","departmentHeadOf(owned_by)"],retirementDate:!0,message:{subject:"Under retirement for a long time",intro:"They are in status Under retirement, and nothing changed on them for a long time.",ask:"Is this CI still going to be retired, and when? Please {reply}. If it is no longer in use, please retire it.",askByClass:{service_instance:"Is this system still going to be retired, and when? Please {reply}. If it is no longer in use, please retire it in EPO."},why:"A CI that stays Under retirement keeps its relationships and its criticality, and nobody knows if it is still used.",askByTeam:{"process-management":"Is this process still going to be retired, and when? Please {reply}. If it is no longer in use, we will retire it in ServiceNow."}}},lA={id:FE,status:XE,title:ZE,cardLabel:QE,cardHint:JE,cardText:WE,family:eA,dimension:tA,severity:nA,priority:sA,scope:aA,detector:iA,playbook:oA},rA="APP-INSTANCE-MATCH",cA="live",dA="Business Application differs from its Service Instance",uA="Application ≠ Instance",fA="A Business Application is a copy of its Service Instance: owners, status, description and name. SACM copies what differs.",mA='A Business Application has the same Owned by, Managed by, Operational status and description as its Service Instance, and its name is the instance name without " - PROD" or " - TEST", plus "_BA" (procedure 2.9). With several instances: the production one whose name it carries. Nobody is asked about the owners, status, description or name of an application: SACM copies the value of the instance in ServiceNow. Use the fix list. When the instance itself is wrong, its own card asks its owner, in EPO.',hA="relationships",pA="correctness",gA="medium",yA={classes:["business_application"],exclude:{operational_status:["retired"]}},xA={type:"code",module:"relationships/application-instance",ref:"reference/relationship-model"},vA={path:"sacm-fix",audience:["sacm"]},wA={id:rA,status:cA,title:dA,cardLabel:uA,cardHint:fA,cardText:mA,family:hA,dimension:pA,severity:gA,scope:yA,detector:xA,playbook:vA},bA="MAPPING",SA="proposed",NA="CI to map with its owner",CA="Mapping backlog",jA="One case per CI to map: SACM invites the owner to a mapping session and moves the case through its stages.",kA="Everything that must be mapped, one case per CI: a Service Instance without a Business Application, a Business Service or Business Application without a Business Process, a Business Application without a Service Instance, a Business Process with nothing below (in Ready only once it has CIA values), and a Business Application tagged To be deleted that is still Operational. SACM invites the owner to a mapping session (no list of questions), maps the CI with the owner in the Service Mapping Workspace and makes the changes in ServiceNow. Set the stage on the case as it moves on. When the owner says the Business Process does not exist, mark it: Tell Process Management writes one message to the team. A case is solved when a later report no longer shows the problem. CIs tagged To Be Mapped, Descoped or Process is missing or unknown are planned (known); CIs in Ready wait.",$A="relationships",TA="compliance",_A="high",OA={classes:["business_process","business_application","business_service","service_instance"],exclude:{operational_status:["retired"]}},EA={type:"code",module:"mapping/backlog",ref:"reference/mapping-backlog"},AA={path:"mapping",audience:["owned_by","managed_by","managerOf(owned_by)"],message:{subject:"Mapping session",intro:"SACM maps every CI of the CMDB to the CIs above and below it. These CIs of yours are not fully mapped yet.",ask:"Could we plan a 30-minute mapping session with you? {Reply} with a time that suits you. There is nothing to prepare: we go through it together.",why:"Without these relationships, criticality cannot flow to the CIs that support your service, and incidents cannot be linked to it.",byProblem:{"no-process":{subject:"No Business Process",intro:"In a mapping session, the owners of these CIs told us that the Business Process they belong to does not exist yet.",ask:"Could you identify the Business Process of each CI, or have it created? {Reply} with the process, and SACM links the CI to it in ServiceNow."}}}},MA={id:bA,status:SA,title:NA,cardLabel:CA,cardHint:jA,cardText:kA,family:$A,dimension:TA,severity:_A,scope:OA,detector:EA,playbook:AA},RA="OFFERING-OWNER",DA="live",IA="Service Offering owner differs from its Business Service owner",LA="Offering owner ≠ Service owner",zA="A Service Offering made by a person has another owner than its Business Service. SACM copies the service owner.",BA="A Service Offering made by a person has the owner of its Business Service (procedure 2.6). Offerings from EPO take their owner from EPO and are not raised. SACM copies the owner of the Business Service onto the offering in ServiceNow: use the fix list. Nobody is asked.",UA="relationships",HA="correctness",PA="medium",qA={classes:["service_offering"],exclude:{operational_status:["retired"]}},GA={type:"code",module:"relationships/offering-owner",ref:"reference/relationship-model"},KA={path:"sacm-fix",audience:["sacm"]},YA={id:RA,status:DA,title:IA,cardLabel:LA,cardHint:zA,cardText:BA,family:UA,dimension:HA,severity:PA,scope:qA,detector:GA,playbook:KA},VA="OFFERING-PARENT",FA="live",XA="Parent field and Business Service relationship of an offering do not match",ZA="Offering parent",QA="The Parent field of a Service Offering and its Business Service relationship do not name the same service. SACM fixes it.",JA="The Parent field of a Service Offering and its Business Service relationship must name the same, single Business Service. SACM fixes it, nobody is asked: use the fix list. When the Parent field names a service and no relationship exists, add the relationship to that service.",WA="relationships",eM="correctness",tM="high",nM={classes:["service_offering"],exclude:{operational_status:["retired"]}},sM={type:"code",module:"relationships/offering-parent",ref:"reference/relationship-model"},aM={path:"sacm-fix",audience:["sacm"]},iM={id:VA,status:FA,title:XA,cardLabel:ZA,cardHint:QA,cardText:JA,family:WA,dimension:eM,severity:tM,scope:nM,detector:sM,playbook:aM},oM="REL-MISSING",lM="live",rM="Mandatory relationship is missing (unmapped CI)",cM="Relationship missing",dM="A CI lacks a relationship the model asks for, such as a Business Service without a Service Offering.",uM="A CI without a relationship the model asks for. On a Business Service and on an offering from EPO the change goes into EPO. A Business Capability needs at least one Business Process or Business Capability below it. One rule is only listed for a review (offering without a Service Instance): it is not agreed yet. What SACM maps with the owner (a Service Instance without a Business Application, a Business Application without a Service Instance or a Business Process, a Business Service without a Business Process, a Business Process with nothing below) is on the Mapping backlog.",fM="relationships",mM="compliance",hM="high",pM={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance"],exclude:{operational_status:["retired"]}},gM={type:"code",module:"relationships/missing",ref:"reference/relationship-model",rules:["bc-below","bp-business-capability","bs-offering","bso-business-service","bso-service-instance"]},yM={path:"self-fix",audience:["owned_by","managed_by","managerOf(owned_by)"],routeBy:"epo",message:{subject:"Relationship missing",intro:"A relationship the CMDB model asks for is missing on these CIs.",ask:"Could you tell us which CI is missing? {Reply} with its name (or EPO ID), and we add the relationship {request:service-mapping}.",several:"As there are several CIs, a 30-minute mapping session may be quicker. Reply with a time that suits you.",why:"Without these relationships, criticality cannot flow to the CIs that support your service, and incidents cannot be linked to it.",epoAsk:"Please add the missing relationship in EPO. If you are not sure which one, reply with the Business Process your system delivers and the systems it depends on (EPO IDs or names).",askByClass:{business_capability:"Which Business Processes or Business Capabilities carry out this capability? {Reply}, and we add the relationships {request:service-mapping}."}}},xM={id:oM,status:lM,title:rM,cardLabel:cM,cardHint:dM,cardText:uM,family:fM,dimension:mM,severity:hM,scope:pM,detector:gM,playbook:yM},vM="REL-ONE-TO-ONE",wM="live",bM="CI has more than the one allowed partner",SM="Too many partners",NM="A CI has more partners than the model allows, such as an offering with two Business Services. SACM fixes the mapping.",CM='An offering has exactly one Business Service; a Service Instance exactly one Business Application; a Business Application one Service Instance per environment. SACM fixes the mapping in ServiceNow: use the fix list. When SACM cannot tell which one is right, open the CI and press "Cannot tell which one is right: ask the owner": the owner is asked.',jM="relationships",kM="compliance",$M="high",TM={classes:["business_application","service_offering","service_instance"],exclude:{operational_status:["retired"]}},_M={type:"code",module:"relationships/too-many",ref:"reference/relationship-model",rules:["bso-business-service","ba-service-instance","si-business-application"]},OM={path:"sacm-fix",audience:["owned_by","managed_by","managerOf(owned_by)"],askWhenUnsure:"Cannot tell which one is right: ask the owner",message:{subject:"Too many related CIs",intro:"These CIs are related to more CIs than the CMDB model allows. The table shows which.",ask:"Which one is right? {Reply}, and SACM removes the other relationships in ServiceNow.",why:"With two parents, criticality and ownership are not clear."}},EM={id:vM,status:wM,title:bM,cardLabel:SM,cardHint:NM,cardText:CM,family:jM,dimension:kM,severity:$M,scope:TM,detector:_M,playbook:OM},AM="REL-RETIRED",MM="off",RM="Relationship to a Retired CI",DM="Relationship to a Retired CI",IM="One end of the relationship is Retired, the other is not (procedure 2.12). SACM removes it in ServiceNow: use the fix list, grouped by the live CI.",LM="relationships",zM="correctness",BM="low",UM={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},HM={type:"code",module:"relationships/retired-end",ref:"reference/relationship-model"},PM={path:"sacm-fix",audience:["sacm"]},qM={id:AM,status:MM,title:RM,cardLabel:DM,cardHint:IM,family:LM,dimension:zM,severity:BM,scope:UM,detector:HM,playbook:PM},GM="REL-TWICE",KM="live",YM="More than one relationship between two CIs",VM="Relationship entered twice",FM="Two CIs are linked more than once. Only one relationship is allowed: SACM keeps the right one and removes the others.",XM="Between two CIs only one relationship is allowed. This lists the same relationship entered more than once, and two CIs linked by relationships of different types or in both directions. SACM keeps the right one and removes the others: use the fix list.",ZM="relationships",QM="correctness",JM="low",WM={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},e3={type:"code",module:"relationships/twice",ref:"reference/relationship-model"},t3={path:"sacm-fix",audience:["sacm"]},n3={id:GM,status:KM,title:YM,cardLabel:VM,cardHint:FM,cardText:XM,family:ZM,dimension:QM,severity:JM,scope:WM,detector:e3,playbook:t3},s3="REL-WRONG-TYPE",a3="live",i3="Relationship type is not allowed between these classes",o3="Wrong relationship type",l3="The relationship has a type the model does not allow between these classes. SACM corrects it in ServiceNow.",r3="SACM corrects these in ServiceNow: use the fix list. A Platform above the Service Instance that uses it is only listed for a review: confirm with the criticality owner before changing production, because criticality flows down.",c3="relationships",d3="compliance",u3="medium",f3={classes:["business_capability","business_process","business_application","business_service","service_offering","service_instance","api","application","technology_management_service"],exclude:{operational_status:["retired"]}},m3={type:"code",module:"relationships/wrong-type",ref:"reference/relationship-model"},h3={path:"sacm-fix",audience:["sacm"]},p3={id:s3,status:a3,title:i3,cardLabel:o3,cardHint:l3,cardText:r3,family:c3,dimension:d3,severity:u3,scope:f3,detector:m3,playbook:h3},g3="The two contract files (piece 5C, procedure 2.8): the Solusi contract file (Excel, every Monday; row 1 field names, row 2 labels) and the ServiceNow contract report (ast_contract). They are matched by the Solusi contract number, which ServiceNow keeps in Vendor contract. Procurement owns the data: a wrong value is corrected in Solusi, because the next import writes over ServiceNow. The problems of the contract data ('problems') are split over two cards: For Procurement raises the problems of Solusi itself, Contracts to fix in ServiceNow the ones SACM corrects in ServiceNow ('change' and 'set' are the words of its fix list). An inactive contract owner or Procurement partner: when the loaded reports know an active account with the same name, the upload picked the wrong account and SACM sets the active one ('ownerInactive', 'partnerInactive'); when they know none, the person left and Procurement names a new person in Solusi ('ownerLeft', 'partnerLeft').",y3={columns:{number:["contract_no"],status:["contract_status"],name:["contract_name"],vendor:["partner_name"],vendorNumber:["partner_no"],category:["contract_category"],start:["contract_start"],end:["contract_end"],duration:["map_duration_type"],owner:["clm_contract_owner"],dailyResponsible:["clm_contract_daily_responsible"],procurementPartner:["clm_contract_supporter"],epoId:["clm_contract_epo_id"],terminated:["termination_date"]},labelRow:["contract no.","contract no","contract"],terminatedSheet:"The tab with a termination date column holds the contracts terminated in the last 7 days."},x3={columns:{number:["number"],vendorContract:["vendor_contract"],state:["state"],name:["short_description"],vendor:["vendor"],category:["u_contract_category"],start:["starts"],end:["ends"],owner:["business_owner"],ownerActive:["business_owner.active"],ownerUserId:["business_owner.user_name"],ownerEmail:["business_owner.email"],dailyResponsible:["u_point_of_contact"],procurementPartner:["contract_administrator"],procurementPartnerActive:["contract_administrator.active"],procurementPartnerUserId:["contract_administrator.user_name"],procurementPartnerEmail:["contract_administrator.email"],tags:["sys_tags"],criticality:["inherited_confidentiality","inherited_integrity","inherited_availability","inherited_authenticity"]}},v3=[{field:"name",label:"Name",kind:"text"},{field:"vendor",label:"Vendor",kind:"text"},{field:"category",label:"Category",kind:"text"},{field:"start",label:"Start date",kind:"date"},{field:"end",label:"End date",kind:"date"},{field:"owner",label:"Contract owner",kind:"person"},{field:"dailyResponsible",label:"Daily responsible",kind:"person"},{field:"procurementPartner",label:"Procurement partner",kind:"person"}],w3=["Expired"],b3=["Draft"],S3="\\b[ESTN]\\s*-\\s*(Ended|Terminated|Concluded|In negotiation)\\b",N3=["S - Concluded","N - In negotiation"],C3="target\\s*bc\\s*=\\s*[1-4]",j3=["S - Concluded"],k3=["Fixed-term"],$3={classes:["service_instance"],retiredStatuses:["Retired"],minDigits:3},T3=[30,90],_3=[{id:"ownerInactive",label:"Contract owner: an inactive account was picked",change:"Contract owner: set the active account with the same name",set:"the active account"},{id:"partnerInactive",label:"Procurement partner: an inactive account was picked",change:"Procurement partner: set the active account with the same name",set:"the active account"},{id:"noOwner",label:"No contract owner"},{id:"ownerLeft",label:"Contract owner left"},{id:"partnerLeft",label:"Procurement partner left"},{id:"personName",label:"A name ServiceNow does not show the same",change:"set the person Solusi names"},{id:"endPassed",label:"Concluded, but the end date has passed",change:"End date: correct it, or set the status Ended",set:"the right end date, or Ended"},{id:"noEnd",label:"Fixed-term, but no end date",change:"End date: add it, or correct the duration type",set:"the end date"},{id:"noVendorNumber",label:"No vendor number"},{id:"epoRetired",label:"The EPO ID names a Retired system"},{id:"epoUnknown",label:"The EPO ID is not a known EPO ID"}],O3={note:g3,solusi:y3,servicenow:x3,fields:v3,autoStates:w3,draftStates:b3,statusTag:S3,runningStatuses:N3,targetTag:C3,concludedStatuses:j3,fixedTermWords:k3,epo:$3,endsWithinDays:T3,problems:_3},E3="Criticality (CIA-A) flows down from the Business Process (BIA). Each parent passes its values to its children's Inherited fields; the highest value per dimension wins. A relationship 'Excluded for calculation' in the Relationship report passes nothing (D131). ServiceNow copies Inherited to Target after two weeks, unless an exception applies: a CI with Inherited set and Target empty waits 'waitDays' days after the last change of its record (D132).",A3=14,M3={note:E3,waitDays:A3},R3="The EPO ID is the asset tag. 'required': a missing EPO ID is to solve (the known cases of section 3.1 of the instruction are marked Not followed up once, by a manager). 'unique': two live CIs must not share an EPO ID. Service Offerings are ServiceNow records and are not checked (D128). Business Application, Business Process and Business Capability have no EPO ID: not checked.",D3=["business_service","service_instance"],I3=!0,L3={note:R3,required:D3,unique:I3},z3=`Where a fix is made (decisions D122 and D123). On a CI of 'classes' the fix is made in EPO, by the person the check asks, and ServiceNow receives it from EPO. A Service Offering is a ServiceNow record: it comes from EPO only when the EPO integration created it, that is when its Created by is not a person's user ID ('personUserId'); then it is fixed in EPO, on its Business Service. An offering made by a person, and every other class, is fixed in ServiceNow with the request the message names. Without the Created by column, every offering counts as made by a person. The service mapped flag plays no part here: only the card EPO ≠ ServiceNow reads it. On an offering the integration created, only Owned by follows its Business Service in EPO; Managed by, Supported by and the Support group are changed in ServiceNow with the request "Add or modify a Service (CI)", action "Modify service offering" ('inServiceNow': the fields, and the checks whose finding is about one of them; decision D187).`,B3=["business_service","service_instance"],U3={classes:["service_offering"],personUserId:"^[A-Za-z0-9]{3}$",inServiceNow:{fields:["managed_by","supported_by"],checks:["RESP-SAME-PERSON","SUPPORT-GROUP-MISSING","SUPPORT-GROUP-INACTIVE"]}},H3={note:z3,classes:B3,offerings:U3},P3="The EPO systems report (piece 5A): one line per EPO system. How its columns are called, what its status words mean, and how a system matches a CI. A system matches the Service Instance whose Asset tag is its EPO ID. The fix is always made in EPO; a service mapped CI is then updated in ServiceNow by SACM by hand.",q3={epoId:["epoid","epo_id"],name:["systemname","system_name"],description:["systemdescription","system_description"],status:["systemstatus","system_status"],department:["ownerdepartment","owner_department"],owner:["owner"],responsible1:["responsible1","responsible_1"],responsible2:["responsible2","responsible_2"],changed:["ajour_tms","last_change","changed"]},G3={Kørende:"Operational",Nedlagt:"Retired",Konstruktion:"Ready",Udgående:"Under retirement"},K3=["service_instance"],Y3=" - PROD",V3=["Retired"],F3=[{role:"owned_by",column:"owner",label:"Owned by",epoLabel:"System Owner"},{role:"managed_by",column:"responsible1",label:"Managed by",epoLabel:"Primary Responsible"},{role:"supported_by",column:"responsible2",label:"Supported by",epoLabel:"Secondary Responsible"}],X3={note:"The source first: a people line of these checks on a CI that pairs with an EPO system is compared with EPO before anybody is asked. EPO already names another person: the line waits (SACM copies it, or the sync brings it). EPO is wrong or empty too: the owner is asked, and the line says what EPO holds. A leftover (empty in EPO, a person still in ServiceNow) is asked of the owner; when its person is still active, the line is made on the check named in 'leftover'.",checks:["RESP-MISSING","RESP-INACTIVE","SUPPORTED-BY"],samePerson:["RESP-SAME-PERSON"],leftover:{owned_by:"RESP-MISSING",managed_by:"RESP-MISSING",supported_by:"SUPPORTED-BY"},cards:{mapped:"EPO-DIFF",notMapped:"EPO-NOT-ARRIVED"}},Z3=2,Q3=40,J3="The two EPO criticality numbers (scale 1 to 5, ServiceNow uses another scale) and the GDPR marks are not compared.",W3={note:P3,columns:q3,statuses:G3,classes:K3,nameSuffix:Y3,retiredStatuses:V3,roles:F3,sourceFirst:X3,waitDays:Z3,descriptionStart:Q3,notCompared:J3},eR="Tags of the team that explain a finding. A finding of a listed check on a CI with one of the tags is listed under Known: not to solve, no message. Remove the tag in ServiceNow and the finding is to solve at the next report. Tags are compared ignoring case and spaces.",tR=[{checks:["CRIT-TARGET-MISSING","CRIT-NONE-REACHES"],tags:["BIA is pending","BIA N/A"],why:"The BIA that gives the values is pending, or does not apply."},{checks:["RESP-SAME-PERSON"],tags:["Owned by is interim managed by"],why:"The manager holds the owner role for a while, on purpose."},{checks:["REL-MISSING","MAPPING"],tags:["To Be Mapped","Descoped","Process is missing or unknown"],why:"Mapping is planned (To Be Mapped, Descoped), or the process is not known yet."}],nR={note:eR,rules:tR},sR="Lifecycle rules (Operational Activities Instruction 2.13). 'rules': a CI sits in a status for more than 'days' days, counted from the day the record was created or last changed, to the date of the report. 'days' is the value proposed; the team sets its own number in Settings ('setting'). 'fix': the line of the fix list when SACM changes the status itself (Business Capabilities in Ready). 'review': the sample of the lifecycle review, drawn only from the classes EPO holds (Business Service, Service Offering, Service Instance), so every CI of the sample can be compared with EPO; drawn once on a button press and saved in data/reviews/ of the team folder.",aR=[{id:"under-retirement",status:"Under retirement",from:"updated",days:90,setting:"underRetirementDays",say:"Status {status}, and the record did not change since {date} ({age} days)"},{id:"ready",status:"Ready",from:"created",days:90,setting:"readyDays",say:"Status {status} since it was created on {date} ({age} days)",fix:{change:"Operational status: make it Operational",set:"Operational"}}],iR={sample:50,classes:["business_service","service_offering","service_instance"],underRetirement:20,underRetirementStatus:"Under retirement",retiredStatuses:["Retired"],results:[{id:"same",label:"Same in EPO"},{id:"different",label:"Not the same"},{id:"not-in-epo",label:"Not in EPO"}],opensCase:["different"]},oR={note:"The stages of a Business Process in Ready (D197). Waits for the BIA: no CIA value (Target) yet, no line, only a note. To map: CIA values and nothing live linked below of the classes in below: no line here, the process is a case of the Mapping backlog (D200), and a note says how many. Mapped: CIA values and something linked below: SACM makes it Operational.",status:"Ready",below:["business_application","business_service"],waits:{one:"1 Business Process in Ready waits for the BIA (no CIA values yet): nothing to do.",many:"{n} Business Processes in Ready wait for the BIA (no CIA values yet): nothing to do."},toMap:{one:"1 Business Process in Ready is to map (CIA values set, nothing linked below): it is on the Mapping backlog.",many:"{n} Business Processes in Ready are to map (CIA values set, nothing linked below): they are on the Mapping backlog."},mapped:{say:"Mapped: the CIA values are set and {below} linked below. Make it Operational",change:"Operational status: make it Operational",current:"Ready, mapped",set:"Operational"}},lR={note:sR,rules:aR,review:iR,processStages:oR},rR=[{label:"process type (customer facing or internal)",oneOf:["Internal process","Internal BP"],endsWith:["facing","facing process"]}],cR={business_process:rR},dR="The mapping backlog (D200): one case per CI that must be mapped, SACM's work with the owner in a mapping session. 'rules' are the rules of reference/relationship-model that make a CI a mapping case; they are not on Relationship missing. A Business Process in 'readyStatus' is a case only when it has CIA values (a Target value): before that it waits for the BIA. 'tagged': a CI of 'classes' with a tag that matches one of 'tags' (a regular expression, ignoring case) and in 'status' is a case too: its future is decided in the session. 'stages': the steps of a case, in order; 'classStages': the steps each class goes through (D201). 'processMissing': the classes whose case can be marked 'The process does not exist' when one of 'rules' is the reason; 'team' is the team of reference/record-teams that is told (D203). 'criticality': the checks whose lines of the same CI are shown in the case (D204).",uR=["si-business-application","bs-business-process","ba-business-process","ba-service-instance","bp-application-or-service"],fR="Ready",mR={id:"tagged-to-delete",classes:["business_application"],tags:["to be deleted"],status:"Operational",say:"Tagged To be deleted and still Operational: decide in the session whether it is retired, or was never a Business Application"},hR=[{id:"to-plan",label:"To plan"},{id:"session-held",label:"Session held"},{id:"classified",label:"Classified"},{id:"application-linked",label:"Application linked"},{id:"process-linked",label:"Process linked"}],pR={service_instance:["to-plan","session-held","classified","application-linked","process-linked"],business_application:["to-plan","session-held","process-linked"],business_service:["to-plan","session-held","process-linked"],business_process:["to-plan","session-held","application-linked"]},gR={business_process:{"application-linked":"Applications linked"}},yR={classes:["business_service","business_application"],rules:["bs-business-process","ba-business-process"],team:"process-management"},xR=["CRIT-ABOVE-PARENT","CRIT-NONE-REACHES"],vR={note:dR,rules:uR,readyStatus:fR,tagged:mR,stages:hR,classStages:pR,stageWords:gR,processMissing:yR,criticality:xR},wR=`The naming rules of the SACM instruction, as data. Patterns are regular expressions; upper and lower case count. 'when': only names that match it are tested. The check packs name the rules they apply (detector.rules). Decision of 11 Nov 2026, to confirm: the instruction writes "API-", but the API offerings in ServiceNow are written "API - " with spaces, so the rule follows the data.`,bR=[{id:"ba-suffix",classes:["business_application"],pattern:"_BA$",say:"The name does not end with _BA"},{id:"bs-suffix",classes:["business_service"],pattern:"_BS$",say:"The name does not end with _BS"},{id:"si-suffix",classes:["service_instance"],pattern:" - (PROD|TEST)$",say:'The name does not end with " - PROD" or " - TEST"'},{id:"api-prefix",classes:["service_offering"],when:"^API\\b",pattern:"^API - ",say:'The name of an API offering does not start with "API - "',set:'Start the name with "API - " (API, space, hyphen, space)'},{id:"outer-space",classes:["*"],noOuterSpaces:!0,say:"The name has a space at its start or its end",set:"Remove the space"}],SR={note:wR,rules:bR},NR="Operational statuses of a CI that is not live yet. A CI is created in Ready and becomes Operational after sign-off; criticality comes after the BIA (Operational Activities Instruction 2.14). Findings on these CIs are listed under Waiting: not to solve, no message. They move to to solve at the first report that shows the CI live.",CR=["Ready"],jR=["NAME-HIDDEN-CHAR","REL-WRONG-TYPE","REL-RETIRED","REL-TWICE","APP-INSTANCE-MATCH","OFFERING-PARENT","OFFERING-OWNER","NAME-FORMAT","READY-TOO-LONG","READY-TOO-LONG-BC","LIFECYCLE-REVIEW","EPO-DIFF","EPO-NOT-ARRIVED","TAG-MISSING","PROCESS-STAGE","MAPPING"],kR="Checks that SACM fixes itself, with no question to anybody, do not wait: they stay to solve on a CI that is not live yet. Ready too long is about the status Ready itself, and the lifecycle review compares the status with EPO: they do not wait either. The EPO checks compare ServiceNow with EPO, which has its own status for a system in construction: they do not wait either. The mapping backlog decides itself (D200): a CI in Ready waits, except a Business Process with CIA values, which is the one to map now.",$R={note:NR,statuses:CR,exceptChecks:jR,exceptNote:kR},TR="Parked classes (decision D179): CIs that are not checked yet. A parked CI stays in the report, so relationships to it count, but no check tests it, it has no line on any card and it is not counted as tested. The first screen, the load message and the verification record show one grey line per rule instead, so nothing is hidden silently. 'statuses': only CIs in these statuses are parked (empty: every status); a Retired CI is never counted. 'one', 'many' ({n} is the number) and 'none' are the words of the line; 'none' empty: no line. 'fields': parts of checks (check:field) that are parked with the rule on every CI. A capability that is Operational or Under retirement is checked as before; its own rules wait for the round with Enterprise Architecture (OPEN-QUESTIONS).",_R=[{id:"capability-ready",classes:["business_capability"],statuses:["Ready"],one:"1 Business Capability in Ready is not checked yet",many:"{n} Business Capabilities in Ready are not checked yet",none:"",fields:["REL-MISSING:bp-business-capability"]},{id:"api-application",classes:["api","application"],one:"1 API or Application CI is not checked yet: the class is not used yet",many:"{n} API or Application CIs are not checked yet: the classes are not used yet",none:"No API or Application CIs in this report"},{id:"technology-management-service",classes:["technology_management_service"],one:"1 Technology Management Service is not checked yet: the class is not used yet",many:"{n} Technology Management Services are not checked yet: the class is not used yet",none:"No Technology Management Service in this report"}],OR={note:TR,rules:_R},ER="Teams that are the contact for the record of a class (D195). A line of one of the 'checks' on a CI of one of the 'classes' goes to the team, never to the people of the CI: one message to every person of the team (Settings, Requests and mailboxes), nobody copied. Process Management is responsible for the record of a Business Process; its mapping is SACM's work with the process owner (Relationship missing), and SACM does not chase the BIA (the criticality cards).",AR=[{id:"process-management",name:"Process Management",classes:["business_process"],checks:["RESP-MISSING","RESP-INACTIVE","RESP-SAME-PERSON","DESC-QUALITY","NAME-DUPLICATE","TAG-MISSING","TAG-STATUS-CONFLICT","UNDER-RETIREMENT-LONG"]}],MR={note:ER,teams:AR},RR="The relationship model of the Service Mapping Workspace (dictionary and mandatory relationships), as data. Relationships are written parent -> child: the parent is the upstream CI. Only the classes the reports hold today; more can be added. Rule ids are the ones of the Workspace, so both projects can be compared. A Service Instance with Platform ticked (u_platform) is the class 'platform'. A relationship counts only when neither end is Retired.",DR=["Retired"],IR={note:"The environment of a Service Instance: its Environment field, else a trailing word of its name ('- TEST'), else production. Synonyms count as one.",suffix:"\\b(prod|production|prd|preprod|pre-prod|pre-production|non-prod|nonprod|non-production|acc|acceptance|uat|test|tst|dev|development|dr|disaster recovery)\\)?\\s*$",aliases:[{pattern:"^(prod|production|prd)$",name:"PROD"},{pattern:"^(preprod|pre-prod|pre-production)$",name:"PREPROD"},{pattern:"^(acc|acceptance)$",name:"ACC"},{pattern:"^(test|tst)$",name:"TEST"},{pattern:"^(dev|development)$",name:"DEV"},{pattern:"^(dr|disaster recovery)$",name:"DR"},{pattern:"^(non-prod|nonprod|non-production)$",name:"NONPROD"}]},LR={descriptions:"poor",descriptionMin:30,descriptionStart:40,instanceSuffix:"\\s+-\\s+(PROD|TEST)$",applicationSuffix:"_BA"},zR=[{parents:["business_capability"],children:["business_capability"],status:"allowed",types:["Provided by::Provides"],note:"Capability hierarchy."},{parents:["business_capability"],children:["business_process"],status:"allowed",types:["Provided by::Provides"],note:"The process carries out the capability."},{parents:["business_capability"],children:["business_application"],status:"unconfirmed",types:["Provided by::Provides"],note:"Type not agreed yet: not checked."},{parents:["business_process"],children:["business_application"],status:"allowed",types:["Provided by::Provides"],note:"A process can use several applications, and the other way round."},{parents:["business_process"],children:["business_service"],status:"allowed",types:["Provided by::Provide
